# A toy world for the territory rules (tests only).
#
# Two powers already at war on the start date, one leader each, both playable, on a
# flat map (`toy.map.json` beside this file). No rule of the territory game is
# switched on yet: `rules: []`. The world names its own piece kinds and resources
# (levies and galleys, not armies and fleets), so a rule that reads a kind's name
# instead of its domain or role shows up here. Later items add the rules they test.
# Every name is invented.

world: territory-toy
name: Territory Toy
ruleset: realism
start: "The Norra-Sudland border, spring 1900"
start_date: 1900-04-02

rules: []

entities:
  - {key: norra, kind: polity, name: Norra, lift_pool: norra_shipping}
  - {key: sudland, kind: polity, name: Sudland}
  - {key: ilse, kind: person, name: Ilse Varg, parent: norra}
  - {key: tomas, kind: person, name: Tomas Brand, parent: sudland}
  # Norrhavn is a port on the gulf: a galley there stands in the gulf, and a levy
  # embarks or lands there. Sudby is not.
  - {key: norrhavn, kind: location, name: Norrhavn, at: [150, 150], within: norra_plain, port_on: the_gulf}
  - {key: sudby, kind: location, name: Sudby, at: [40, 60], within: sudland_coast}
  - {key: gulf_roads, kind: location, name: The Gulf Roads, at: [150, 50], within: the_gulf}

# The board: a flat plane 300 by 200, four land territories and two sea zones. The
# isle shares no border with the mainland; a ferry joins it to the Norra plain.
map: {coords: flat, file: toy.map.json, sha256: c85e9773c786d427609b240ea1c45e21ae5c3c57ae2ab98d6b0d96713a20f28e, box: [0, 0, 300, 200]}

terrain:
  - {key: hills, kind: land, defence: 1}
  - {key: plain, kind: land}
  - {key: shallows, kind: sea}
  - {key: deep, kind: sea}

regions:
  - {key: mainland, name: The Mainland}
  - {key: north, name: The North, parent: mainland}
  - {key: south, name: The South, parent: mainland}
  - {key: waters, name: The Waters}

territories:
  - {key: norra_hills, name: The Norra Hills, region: north, terrain: hills, holder: norra, source: toy}
  - {key: norra_plain, name: The Norra Plain, region: north, terrain: plain, holder: norra, sites: [norrhavn], yields: {grain: 10, levies: 2000}, source: toy}
  - {key: sudland_coast, name: The Sudland Coast, region: south, terrain: plain, holder: sudland, sites: [sudby], yields: {grain: 6, iron: 2}, source: toy}
  - {key: isle, name: The Isle, region: waters, terrain: hills, holder: sudland, source: toy}

sea_zones:
  - {key: the_gulf, name: The Gulf, region: waters, terrain: shallows}
  - {key: open_sea, name: The Open Sea, region: waters, terrain: deep}

adjacency:
  - [norra_hills, norra_plain]
  - [norra_hills, sudland_coast]
  - [norra_plain, the_gulf]
  - [norra_plain, open_sea]
  - [sudland_coast, the_gulf]
  - [the_gulf, open_sea]
  - [isle, open_sea]
  - {a: isle, b: norra_plain, crossing: the ferry}

# Norra's shipping, from which a levy's lift across the water is drawn.
quantities:
  - {key: norra_shipping, owner: norra, name: Norra's shipping, value: 100000, unit: tons, source: toy}
  - {key: barge_act_passed, owner: norra, name: Barge Act passed, value: 0, unit: flag, source: toy}

# The world's own law, read with the laws rule on: no code table knows its key, its
# clause or its flag.
laws:
  - key: barge_act
    title: The Barge Act
    nation: norra
    clauses:
      - {kind: power, subject: arm the gulf barges}
    passed: barge_act_passed
    does: {kind: arms_merchant_ships}

# What the land yields. Two resources share the output role; none has supply or
# prestige.
resources:
  - {key: grain, name: Grain, unit: tons, role: output}
  - {key: iron, name: Iron, unit: tons, role: output}
  - {key: levies, name: Levies, unit: men, role: manpower}
  - {key: pitch, name: Pitch, unit: barrels, role: fuel}

# The world's own piece kinds, one of each domain.
piece_kinds:
  - {key: levy, name: Levy, domain: land, days_per_step: {hills: 7, plain: 5}}
  - key: galley
    name: Galley
    domain: sea
    days_per_step: {shallows: 2, deep: 3}
    max_strength: 3
    fuel_per_step: 1
    detect: 20
    conceal: 10
    carries: [levy]
  - {key: kite, name: Kite Wing, domain: air, days_per_step: {hills: 1, plain: 1, shallows: 1, deep: 1}, range_steps: 2, detect: 60}
  - {key: herald, name: Herald, domain: envoy, days_per_step: {hills: 3, plain: 2, shallows: 2, deep: 4}}

features:
  - {key: norra_levy, kind: piece, piece: levy, name: The Norra Levy, side: norra, places: [norrhavn], source: toy}
  - {key: sudland_levy, kind: piece, piece: levy, name: The Sudland Levy, side: sudland, places: [sudby], source: toy}
  - {key: sudland_galleys, kind: piece, piece: galley, name: The Sudland Galleys, side: sudland, places: [gulf_roads], source: toy}
  - {key: norra_kites, kind: piece, piece: kite, name: The Norra Kites, side: norra, places: [norrhavn], source: toy}
  - {key: norra_herald, kind: piece, piece: herald, name: The Norra Herald, side: norra, places: [norrhavn], source: toy}

sources:
  - key: toy
    title: Invented for the toy world
    note: Not history. Stands in for a real citation in tests.
    verified: true

wars:
  - {a: norra, b: sudland, since: 1900-03-01, source: toy}

# Each nation's groups at home: read only with the `groups` rule on.
groups:
  - nation: norra
    groups:
      - key: smiths
        name: The Smiths' Guild
        kind: guild
        start: 50
        baseline: 50
        feeds: {output: 1, manpower: 1}
        moved_by: {territory_lost: -5, battle_won: 2}
      - key: greens
        name: The Greens
        kind: party
        start: 60
        baseline: 55
        chamber: assembly
        seats: 60
        feeds: {votes: 1, standing: 1}
        moved_by: {battle_won: 3, battle_lost: -4, capital_threatened: -6, war_declared: 2}
        votes: {levy_act: {assembly: {voting: 55, yeas: 40}}}
        vote_default: {assembly: {voting: 50, yeas: 25}}
        stances: {power: 1, money: -1}
      - key: greys
        name: The Greys
        kind: party
        start: 30
        baseline: 30
        chamber: assembly
        seats: 40
        feeds: {votes: 1}
        stances: {limit: 2}
      - key: public
        name: The Norra Public
        kind: public
        start: 40
        baseline: 45
        feeds: {standing: 3, opinion: 1}
        moved_by: {territory_taken: 3, territory_lost: -3, losses_at_sea: -2}
  - nation: sudland
    groups:
      - key: farmers
        name: The Farmers
        kind: estate
        start: 30
        baseline: 35
        feeds: {output: 1}
        moved_by: {territory_taken: 2, battle_lost: -3}

# The player's own aim, read with the own_aim rule on: patterns a player may fill to
# replace his card's replaceable aim. `$name` in a condition is a blank the sentence names
# as `{name}`; `$nation` and `$person` stand for the person's own nation and the person.
# A blank takes a closed list of values or a kind resolved from the seat's view.
aim_patterns:
  - key: take_ground
    posts: [head_of_government, military]
    sentence: Take {place} for {nation}.
    condition: {check: holds_area, area: $place, holder: $nation}
    blanks:
      - {name: place, kind: territory_not_held}
  - key: keep_support
    posts: [political]
    sentence: Keep {group} at {line} or more.
    condition: {check: support_at, nation: $nation, group: $group, op: ge, value: $line}
    blanks:
      - {name: group, kind: own_group}
      - {name: line, values: [55, 65, 75]}
    government: false
  - key: make_peace
    posts: [head_of_government]
    sentence: Make peace with {foe}.
    condition: {check: at_war, a: $nation, b: $foe, war: false}
    blanks:
      - {name: foe, kind: other_nation}
    government: false
  - key: hold_the_line
    posts: [army_commander]
    sentence: Hold {place} with {nation}'s army.
    condition: {check: holds_area, area: $place, holder: $nation}
    blanks:
      - {name: place, values: [norra_hills, sudland_coast]}

cards:
  - person: ilse
    office: Chancellor of Norra
    playable: true
    principals: [norra]
    horizon_days: 14
    post_kind: head_of_government
  - person: tomas
    office: Premier of Sudland
    playable: true
    principals: [sudland]
    horizon_days: 14

seats: []

roster:
  - {entity: ilse, pitch: The chancellor who started the war., reach: The army of Norra., composite: true}
  - {entity: tomas, pitch: The premier who must hold the border., reach: The army of Sudland., composite: true}
# The roster holds two to four people, not the drafted 8 to 12. [proposed]
roster_limit: [2, 4]
