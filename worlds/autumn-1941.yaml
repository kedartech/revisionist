# The map. Positions and dates are approximate and unsourced (gap: true): a
# force's legs are where the record has it if nobody orders it elsewhere.
features:
  - {key: us_atlantic_fleet, kind: piece, piece: fleet, name: US Atlantic Fleet, side: usa, tier: 4, places: [norfolk], gap: true}
  - {key: us_pacific_fleet, kind: piece, piece: fleet, name: US Pacific Fleet, side: usa, tier: 5, places: [pearl_harbor_base], gap: true}
  - {key: home_fleet, kind: piece, piece: fleet, name: Home Fleet, side: uk, tier: 4, places: [scapa_flow], gap: true}
  - {key: uboat_arm, kind: piece, piece: fleet, name: U-boat arm, side: germany, tier: 3, places: [north_atlantic], gap: true}
  # The 22 November leg is concealed (ITD): the strike force gathered at Hitokappu Bay under radio
  # silence. source: prange_1981
  - {key: combined_fleet, kind: piece, piece: fleet, name: Combined Fleet, side: japan, tier: 5, places: [kure], legs: [{since: 1941-11-22, places: [hitokappu_bay], concealed: true}], gap: true}
  # With battles on (ITD): Kiev falls on 19 September to the encirclement that this army group's
  # Second Panzer Group closed from the north (the leg stays at Smolensk and takes the Kiev area).
  # Typhoon opens on 30 September: the leg to Mozhaisk takes seven days through the forest, so the
  # army group enters the Moscow area on 7 October, the day the Vyazma pocket closed, and the
  # battle there opens. From then on history steps aside: the rules move it, so no leg after
  # that one is kept (Kalinin, taken on 14 October, is left to the battle). source: glantz_house_1995
  - {key: army_group_centre, kind: piece, piece: army, name: Army Group Centre, side: germany, tier: 5, places: [smolensk], legs: [{since: 1941-09-19, places: [smolensk], takes: [kiev_area]}, {since: 1941-09-30, places: [mozhaisk]}], gap: true}
  # The map is coarse: Vyazma lies in the Smolensk area with Army Group Centre, so a front standing
  # there would open a battle on the first day and drop both pieces' record (ITD). The Western
  # Front starts at Mozhaisk, in the Moscow area, the line it fell back to in October.
  - {key: soviet_western_front, kind: piece, piece: army, name: Soviet Western Front, side: ussr, tier: 4, places: [mozhaisk], legs: [{since: 1941-10-24, places: [moscow]}], gap: true}
  - key: eastern_front
    kind: front
    name: The Eastern Front
    places: [leningrad, smolensk, kiev, odessa]
