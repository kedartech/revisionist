# Nobody is pre-seated: players claim playable cards at Session Zero.
# Mandates: what each playable figure is asked, or has brought on themselves.
# Triggers are the history items above; deadlines, wording and the choice of
# which item to answer are design values [proposed], not data. "on" is quoted:
# YAML 1.1 reads a bare on as true.
mandates:
  # Roosevelt's broadcast of 11 Sep (rules for the western Atlantic) followed
  # the Greer of 4 Sep by a week; the Navy Day speech of 27 Oct answered the Kearny.
  - key: greer_response
    kind: crisis
    trigger: {"on": history, history: greer_incident}
    to: [roosevelt]
    condition: {check: ordered, person: roosevelt, effect: engagement}
    days: 14
    text: "After the Greer, set the Navy's rules in the western Atlantic."
  - key: shoot_outcry
    kind: blowback
    trigger: {"on": act, effect: engagement}
    to: [roosevelt]
    condition: {check: ordered, person: roosevelt, effect: statement}
    days: 7
    text: "Answer the outcry over the Navy's new orders."
  - key: kearny_address
    kind: crisis
    trigger: {"on": history, history: kearny_hit}
    to: [roosevelt]
    condition: {check: ordered, person: roosevelt, effect: statement}
    days: 14
    text: "The Kearny is hit and eleven are dead: tell the country what the Navy will do."
  # The Commons pressed for the Atlantic convoys through the autumn.
  - key: commons_convoys
    kind: order
    issuer: commons
    trigger: {"on": history, history: greer_incident}
    to: [churchill]
    condition: {check: ordered, person: churchill, effect: move_force}
    days: 10
    text: "The House expects the Home Fleet placed to cover the convoys."
  # Lend-Lease reached the Soviet Union by the 7 Nov finding; Stalin's requests ran on Molotov's cables.
  - key: soviet_aid_window
    kind: opportunity
    trigger: {"on": history, history: soviet_lend_lease_finding}
    to: [stalin]
    condition: {check: ordered, person: stalin, effect: deal}
    days: 21
    text: "Washington has opened Lend-Lease to Russia: press what is wanted."
  # Raeder pressed to answer American escorts; Hitler held the U-boats to avoid incidents.
  - key: uboat_rules
    kind: crisis
    trigger: {"on": history, history: greer_incident}
    to: [hitler]
    condition: {check: ordered, person: hitler, effect: engagement}
    days: 14
    text: "The Greer has been fired on: settle the U-boats' rules toward American ships."
  # The services, Tojo above all, held the Cabinet to its line on the talks.
  - key: services_line
    kind: blowback
    trigger: {"on": act, effect: deal}
    to: [konoe]
    condition: {check: ordered, person: konoe, effect: statement}
    days: 14
    text: "The services want the Cabinet's line on the talks made plain."
  # The Emperor told Tojo to form the cabinet on 17 Oct, the day after Konoe went.
  - key: form_cabinet
    kind: order
    issuer: hirohito
    trigger: {"on": history, history: konoe_resigns}
    to: [tojo]
    condition: {check: ordered, person: tojo, effect: appointment}
    days: 7
    text: "The Throne calls on the War Minister to form a cabinet."
  # Tripartite Pact partner: Rome kept in step with Berlin and Tokyo.
  - key: axis_in_step
    kind: crisis
    trigger: {"on": history, history: konoe_resigns}
    to: [mussolini]
    condition: {check: ordered, person: mussolini, effect: statement}
    days: 14
    text: "Tokyo's Cabinet has fallen: show Italy standing with its partners."
  # Chiang cabled Washington and London against a modus vivendi in the last days of Nov.
  - key: hull_note_appeal
    kind: opportunity
    trigger: {"on": history, history: hull_note}
    to: [chiang]
    condition: {check: ordered, person: chiang, effect: deal}
    days: 10
    text: "Washington has answered Tokyo: make China's case to the Allies."

seats: []

roster:
  - entity: roosevelt
    pitch: Third-term President steering a neutral nation toward the Allies.
    reach: Executive orders, the Navy, Lend-Lease, and what Congress will pass.
    composite: false
    sides:
      - {contest: neutrality_revision, side: interventionists}
      - {contest: us_japan_talks, side: usa}
  - entity: churchill
    pitch: Prime Minister holding on until America comes in.
    reach: The War Cabinet, the Chiefs of Staff, and cables to Roosevelt.
    composite: false
    sides: [{contest: atlantic_war, side: uk}]
  - entity: stalin
    pitch: Leader of a country invaded and begging for supplies.
    reach: Stavka, the State Defence Committee, and the Soviet war economy.
    composite: false
    sides: [{contest: atlantic_war, side: ussr}]
  - entity: hitler
    pitch: Fuehrer at the height of his conquests, committed to the East.
    reach: The OKW, the Kriegsmarine, and the U-boat war.
    composite: false
    sides: [{contest: atlantic_war, side: germany}]
  - entity: konoe
    pitch: Prime Minister seeking a settlement with Washington before the Army moves.
    reach: The cabinet, the Liaison Conference, and a summit he cannot arrange alone.
    composite: false
    sides: [{contest: us_japan_talks, side: japan}]
  - entity: tojo
    pitch: War Minister and serving general, the Army's voice in the cabinet.
    reach: The Army Ministry, the Liaison Conference, and the Army's veto on any deal.
    composite: false
    sides: [{contest: us_japan_talks, side: japan}]
  - entity: mussolini
    pitch: Duce tied to Germany and answerable to a King.
    reach: The Comando Supremo, the Italian convoys, and Hitler's ear.
    composite: false
    sides: [{contest: atlantic_war, side: italy}]
  - entity: chiang
    pitch: Generalissimo holding China open on American aid.
    reach: The Military Affairs Commission, the Burma Road, and Soong in Washington.
    composite: false
    sides: [{contest: us_japan_talks, side: china}]

contests:
  - key: neutrality_revision
    kind: rivalry
    name: Revising the Neutrality Act
    prize: Whether Congress repeals the 1939 Act's bans on arming merchant ships and on war zones.
    sides: [interventionists, noninterventionists]
    countdown_days: 73
  - key: us_japan_talks
    kind: rivalry
