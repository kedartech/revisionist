# Nobody is pre-seated: players claim playable cards at Session Zero.
# Mandates: what each playable figure is asked, or has brought on themselves.
# Triggers are the history items above; deadlines, wording and the choice of
# which item to answer are design values [proposed], not data. "on" is quoted:
# YAML 1.1 reads a bare on as true.
mandates:
  # Roosevelt's broadcast of 11 Sep (rules for the western Atlantic) followed
  # the Greer of 4 Sep by a week; the Navy Day speech of 27 Oct answered the Kearny.
  - key: greer_response
    kind: crisis
    trigger: {"on": history, history: greer_incident}
    to: [roosevelt]
    condition: {check: ordered, person: roosevelt, effect: engagement}
    days: 14
    text: "After the Greer, set the Navy's rules in the western Atlantic."
  - key: shoot_outcry
    kind: blowback
    trigger: {"on": act, effect: engagement}
    to: [roosevelt]
    condition: {check: ordered, person: roosevelt, effect: statement}
    days: 7
    text: "Answer the outcry over the Navy's new orders."
  - key: kearny_address
    kind: crisis
    trigger: {"on": history, history: kearny_hit}
    to: [roosevelt]
    condition: {check: ordered, person: roosevelt, effect: statement}
    days: 14
    text: "The Kearny is hit and eleven are dead: tell the country what the Navy will do."
  # KCD: after the Greer the Atlantic Fleet took up the escort of the fast HX convoys as far as
  # the meeting point south of Iceland (HX 150, from 16 Sep). Named, not read: gap: true.
  - key: greer_escorts
    kind: order
    issuer: stark
    trigger: {"on": history, history: greer_incident}
    to: [king]
    condition: {check: ordered, person: king, effect: engagement}
    days: 14
    text: "After the Greer, the Chief of Naval Operations wants the fleet escorting the HX convoys toward Iceland."
  # NUK: the Home Fleet covered the convoys to northern Russia from the autumn (the PQ series, from
  # 29 September). Tied here to the American finding that opens Lend-Lease to the Soviet Union.
  # Named, not read: gap: true, [proposed].
  - key: arctic_cover
    kind: order
    issuer: pound
    trigger: {"on": history, history: soviet_lend_lease_finding}
    to: [tovey]
    condition: {check: ordered, person: tovey, effect: move_force}
    days: 14
    text: "The convoys to Russia are to run every ten days: the First Sea Lord wants the Home Fleet placed to cover them."
  # NGE: after the Greer, Hitler ordered the U-boats to avoid incidents with American ships (17
  # September), and the Naval Staff passed the order down. Named, not read: gap: true, [proposed].
  # source: fuehrer_naval_17_sep_1941
  - key: uboats_clear_of_americans
    kind: order
    issuer: raeder
    trigger: {"on": history, history: greer_incident}
    to: [doenitz]
    condition: {check: ordered, person: doenitz, effect: move_force}
    days: 14
    text: "The Fuehrer wants no incident with American ships: the Naval Staff wants the boats disposed clear of the American escorts."
  # NJP: the Imperial Conference of 5 November set early December for war if the talks failed,
  # and the Navy General Staff ordered the Combined Fleet to make ready. Named, not read:
  # gap: true, [proposed]. source: prange_1981
  - key: combined_fleet_ready
    kind: order
    issuer: nagano
    trigger: {"on": history, history: tojo_cabinet}
    to: [yamamoto]
    condition: {check: ordered, person: yamamoto, effect: move_force}
    days: 21
    text: "The new Cabinet holds to early December if the talks fail: the Navy General Staff wants the Combined Fleet made ready."
  # NIT: when Italian shipping is at sea for Libya, the Comando Supremo wants the battle fleet
  # placed to cover the convoys, as it was sent out in November and December 1941. Named, not
  # read: gap: true, [proposed]. source: bragadin_1957
  - key: battle_fleet_covers_the_convoys
    kind: order
    issuer: cavallero
    trigger: {"on": quantity, quantity: italy_sealift_grt, op: le, value: 140000}
    to: [iachino]
    condition: {check: ordered, person: iachino, effect: move_force}
    days: 14
    text: "Italian shipping is at sea for Libya: the Comando Supremo wants the battle fleet placed to cover the convoys."
  # NSU: a front moved by its own commander answered to the Stavka for the road to Moscow.
  # Blowback on his own move, so it fires only in a game where he is held and moves the front.
  # gap: true, [proposed]. source: erickson_1975
  - key: western_front_holds_the_road
    kind: blowback
    trigger: {"on": act, effect: move_force}
    to: [timoshenko]
    condition: {check: holds_area, area: moscow_area, holder: ussr}
    days: 14
    text: "You have moved the front: the Stavka holds you to the road to Moscow."
  # NCH: a war area moved by its own commander answered to the Generalissimo for Changsha.
  # Blowback on his own move, so it fires only in a game where he is held and moves the area.
  # gap: true, [proposed]. source: van_de_ven_2003
  - key: ninth_war_area_holds_changsha
    kind: blowback
    trigger: {"on": act, effect: move_force}
    to: [xue_yue]
    condition: {check: holds_area, area: hunan, holder: china}
    days: 14
    text: "You have moved the war area's armies: the Generalissimo holds you to Changsha."
  # NFI: the Finnish Army moved by its own commander answers to the President for Finland's
  # own ground; the President's word abroad answers to Parliament for the same. Blowback on
  # each one's own act, so each fires only in a game where he is held and acts. gap: true,
  # [proposed].
  - key: finnish_army_holds_finland
    kind: blowback
    trigger: {"on": act, effect: move_force}
    to: [mannerheim]
    condition: {check: holds_area, area: finland, holder: finland_state}
    days: 14
    text: "You have moved the army: the President holds you to Finland's own ground."
  - key: finland_kept_out_of_the_wider_war
    kind: blowback
    trigger: {"on": act, effect: statement}
    to: [ryti]
    condition: {check: holds_area, area: finland, holder: finland_state}
    days: 14
    text: "You have spoken for Finland: Parliament holds you to Finland's own war, and no wider one."
  # The Commons pressed for the Atlantic convoys through the autumn.
  - key: commons_convoys
    kind: order
    issuer: commons
    trigger: {"on": history, history: greer_incident}
    to: [churchill]
    condition: {check: ordered, person: churchill, effect: move_force}
    days: 10
    text: "The House expects the Home Fleet placed to cover the convoys."
  # Lend-Lease reached the Soviet Union by the 7 Nov finding; Stalin's requests ran on Molotov's cables.
  - key: soviet_aid_window
    kind: opportunity
    trigger: {"on": history, history: soviet_lend_lease_finding}
    to: [stalin]
    condition: {check: ordered, person: stalin, effect: deal}
    days: 21
    text: "Washington has opened Lend-Lease to Russia: press what is wanted."
  # Raeder pressed to answer American escorts; Hitler held the U-boats to avoid incidents.
  - key: uboat_rules
    kind: crisis
    trigger: {"on": history, history: greer_incident}
    to: [hitler]
    condition: {check: ordered, person: hitler, effect: engagement}
    days: 14
    text: "The Greer has been fired on: settle the U-boats' rules toward American ships."
  # The services, Tojo above all, held the Cabinet to its line on the talks.
  - key: services_line
    kind: blowback
    trigger: {"on": act, effect: deal}
    to: [konoe]
    condition: {check: ordered, person: konoe, effect: statement}
    days: 14
    text: "The services want the Cabinet's line on the talks made plain."
  # The Emperor told Tojo to form the cabinet on 17 Oct, the day after Konoe went.
  - key: form_cabinet
    kind: order
    issuer: hirohito
    trigger: {"on": history, history: konoe_resigns}
    to: [tojo]
    condition: {check: ordered, person: tojo, effect: appointment}
    days: 7
    text: "The Throne calls on the War Minister to form a cabinet."
  # Tripartite Pact partner: Rome kept in step with Berlin and Tokyo.
  - key: axis_in_step
    kind: crisis
    trigger: {"on": history, history: konoe_resigns}
    to: [mussolini]
    condition: {check: ordered, person: mussolini, effect: statement}
    days: 14
    text: "Tokyo's Cabinet has fallen: show Italy standing with its partners."
  # Chiang cabled Washington and London against a modus vivendi in the last days of Nov.
  - key: hull_note_appeal
    kind: opportunity
    trigger: {"on": history, history: hull_note}
    to: [chiang]
    condition: {check: ordered, person: chiang, effect: deal}
    days: 10
    text: "Washington has answered Tokyo: make China's case to the Allies."

seats: []

# The roster's bounds (NUK) [proposed]: room for the people this run's nation items add, a
# commander for each of six nations and Finland's two, beside the nine before them.
roster_limit: [8, 24]

roster:
  - entity: roosevelt
    pitch: Third-term President steering a neutral nation toward the Allies.
    reach: Executive orders, the Navy, Lend-Lease, and what Congress will pass.
    composite: false
    sides:
      - {contest: neutrality_revision, side: interventionists}
      - {contest: us_japan_talks, side: usa}
  - entity: churchill
    pitch: Prime Minister holding on until America comes in.
    reach: The War Cabinet, the Chiefs of Staff, and cables to Roosevelt.
    composite: false
    sides: [{contest: atlantic_war, side: uk}]
  - entity: stalin
    pitch: Leader of a country invaded and begging for supplies.
    reach: Stavka, the State Defence Committee, and the Soviet war economy.
    composite: false
    sides: [{contest: atlantic_war, side: ussr}]
  - entity: hitler
    pitch: Fuehrer at the height of his conquests, committed to the East.
    reach: The OKW, the Kriegsmarine, and the U-boat war.
    composite: false
    sides: [{contest: atlantic_war, side: germany}]
  - entity: konoe
    pitch: Prime Minister seeking a settlement with Washington before the Army moves.
    reach: The cabinet, the Liaison Conference, and a summit he cannot arrange alone.
    composite: false
    sides: [{contest: us_japan_talks, side: japan}]
  - entity: tojo
    pitch: War Minister and serving general, the Army's voice in the cabinet.
    reach: The Army Ministry, the Liaison Conference, and the Army's veto on any deal.
    composite: false
    sides: [{contest: us_japan_talks, side: japan}]
  - entity: mussolini
    pitch: Duce tied to Germany and answerable to a King.
    reach: The Comando Supremo, the Italian convoys, and Hitler's ear.
    composite: false
    sides: [{contest: atlantic_war, side: italy}]
  - entity: chiang
    pitch: Generalissimo holding China open on American aid.
    reach: The Military Affairs Commission, the Burma Road, and Soong in Washington.
    composite: false
    sides: [{contest: us_japan_talks, side: china}]
  - entity: king
    pitch: Admiral commanding the Atlantic Fleet in an undeclared war at sea.
    reach: The Atlantic Fleet, what it may do under the President, and a cable to him.
    composite: false
    sides: [{contest: neutrality_revision, side: interventionists}]
  - entity: tovey
    pitch: Admiral commanding the Home Fleet at Scapa Flow, between the German heavy ships and the convoys.
    reach: The Home Fleet, what it may do under the Admiralty, and a cable to the Prime Minister.
    composite: false
    sides: [{contest: atlantic_war, side: uk}]
  - entity: doenitz
    pitch: Admiral commanding the U-boats from Lorient, held back from American ships by Hitler's order.
    reach: The U-boat arm, what it may do under the Navy's commander in chief, and a cable to Hitler.
    composite: false
    sides: [{contest: atlantic_war, side: germany}]
  - entity: yamamoto
    pitch: Admiral commanding the Combined Fleet, who planned the blow at Pearl Harbor against a war he did not want.
    reach: The Combined Fleet, what it may do under the Navy General Staff, and a cable to its Chief.
    composite: false
    sides: [{contest: us_japan_talks, side: japan}]
  - entity: iachino
    pitch: Admiral commanding the Italian Battle Fleet from Taranto, short of fuel and sent to sea from Rome.
    reach: The Italian Battle Fleet, what it may do under the Comando Supremo, and a cable to its Chief.
    composite: false
    sides: [{contest: atlantic_war, side: italy}]
  - entity: timoshenko
    pitch: Marshal holding the Western Front before Moscow, with orders to counter-attack and no leave to fall back.
    reach: The Western Front, what it may do under the General Staff, and a telephone to its Chief.
    composite: false
    sides: [{contest: atlantic_war, side: ussr}]
  - entity: xue_yue
    pitch: General holding Changsha and the Ninth War Area against the Japanese Eleventh Army, with no leave to give the city up.
    reach: The Ninth War Area, what it may do under the General Staff, and a telephone to its Chief.
    composite: false
    sides: [{contest: us_japan_talks, side: china}]

  # Finland (NFI) stands on Germany's side in the war in Europe: it fought the Soviet Union
  # beside Germany as a co-belligerent, not an ally, and Britain declared war on it only on 6
  # December 1941 (mannerheim_foundation). The character rule needs a side in some contest.
  - entity: ryti
    pitch: President of a small nation fighting beside Germany for the lands it lost, not for Germany's war.
    reach: The Finnish Army through his Commander-in-Chief, and Finland's word abroad.
    composite: false
    sides: [{contest: atlantic_war, side: germany}]
  - entity: mannerheim
    pitch: Marshal commanding the Finnish Army, who took command on condition he never lead it against Leningrad.
    reach: The Finnish Army, where it halts, and a telephone to the President.
    composite: false
    sides: [{contest: atlantic_war, side: germany}]

