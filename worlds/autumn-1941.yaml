# The five yields a territory has.
resources:
  - {key: industry, name: Industry, unit: points, role: output}
  - {key: manpower, name: Manpower, unit: points, role: manpower}
  - {key: oil, name: Oil, unit: points, role: fuel}
  - {key: supply, name: Rail and ports, unit: hubs, role: supply}
  - {key: prestige, name: Prestige, unit: points, role: prestige}

# The world's piece kinds. Days per step [proposed] (plan, Values): an army 5 over plain, 7 through
# forest or marsh, 10 through mountain; a fleet 3 a sea zone; an air group 1; an envoy 2.
piece_kinds:
# Search and concealment (ITD) [proposed] (plan, DET's defaults): an air group searches the areas
# in its range and a fleet on patrol its zone and the zones beside it, each at 60 in 100 a day,
# less the target's `conceal`; no kind starts concealed (0), and concealment adds 30. An army
# and an envoy search nothing of their own accord (0): they see by contact only.
  - {key: army, name: Army, domain: land, days_per_step: {plain: 5, forest: 7, marsh: 7, mountain: 10}, detect: 0, conceal: 0}
  - {key: fleet, name: Fleet, domain: sea, days_per_step: {sea: 3}, carries: [army], detect: 60, conceal: 0}
  - {key: air_group, name: Air group, domain: air, days_per_step: {plain: 1, forest: 1, marsh: 1, mountain: 1, sea: 1}, range_steps: 2, detect: 60, conceal: 0}
  - {key: envoy, name: Envoy, domain: envoy, days_per_step: {plain: 2, forest: 2, marsh: 2, mountain: 2, sea: 2}, detect: 0, conceal: 0}

# Each nation's intelligence on 1 September 1941 (ITD), with `reports` on. For each source a
# nation has, the person who reports it to the leader and the channel. Every person was
# already in the world except Menzies and Dai Li, whose entity lines carry their sources. The first source
# listed ranks highest. Codebreaking levels and agents carry a source or `gap: true` on their
# line; the levels themselves are [proposed] (plan, ITD defaults). One level per nation reads
# every other nation's piece moves (DET), so MAGIC reports Japanese moves, not cables.
intelligence:
  - nation: usa
    codebreaking: 2  # source: pha_1946 (MAGIC: Purple and the naval attache codes read; the level is [proposed])
    sources:
      - {source: contact, person: marshall, channel: cable}
      - {source: air, person: marshall, channel: cable}
      - {source: patrol, person: stark, channel: cable}
      - {source: codebreaking, person: kramer, channel: in_person}  # MAGIC, carried by hand by Kramer
  - nation: uk
    codebreaking: 1  # source: hinsley_1979 (naval Enigma read from mid-1941; the level is [proposed])
    sources:
      - {source: contact, person: ismay, channel: in_person}
      - {source: air, person: ismay, channel: in_person}
      - {source: patrol, person: pound, channel: in_person}
      - {source: codebreaking, person: menzies, channel: in_person}  # Ultra, in C's daily boxes
      - {source: agent, person: menzies, channel: in_person}  # SIS and SOE agents' reports, through C
  - nation: japan
    sources:
      - {source: contact, person: sugiyama, channel: in_person}
      - {source: air, person: nagano, channel: in_person}
      - {source: patrol, person: nagano, channel: in_person}
      - {source: agent, person: nagano, channel: cable}  # the Honolulu consulate's cables
    agents:
      - {area: hawaii}  # source: prange_1981 (Yoshikawa at the Honolulu consulate, to 7 December)
  - nation: germany
    sources:
      - {source: contact, person: jodl, channel: cable}
      - {source: air, person: goering, channel: telephone}
      - {source: patrol, person: raeder, channel: cable}
  - nation: italy
    sources:
      - {source: contact, person: cavallero, channel: in_person}
      - {source: patrol, person: cavallero, channel: in_person}
  - nation: ussr
    sources:
      - {source: contact, person: shaposhnikov, channel: in_person}
      - {source: patrol, person: shaposhnikov, channel: in_person}
      - {source: agent, person: shaposhnikov, channel: radio}  # Sorge's radio messages to Moscow
    agents:
      - {area: japan_east, until: 1941-10-17}  # source: deakin_storry_1966 (Sorge, arrested 18 October)
  - nation: china
    sources:
      - {source: contact, person: he_yingqin, channel: cable}
      - {source: agent, person: dai_li, channel: radio}  # Dai Li's service behind the Japanese lines

# Each nation's groups at home on 1 September 1941 (GRD), with `groups` on. Each group's
# `- key:` line carries its source or `gap: true`. Every starting support, baseline, weight,
# stance and amount is [proposed] (plan, GRD defaults); every group starts at its baseline.
# The groups that feed manpower start at a weighted 50, so each nation's manpower is its
# sourced yield on the first day. The United States has six blocs, a party's members and the
# other members of each chamber. A bloc's seats are the party division at the start of the
# 77th Congress (the quantities above), raised to the most members the record has voting:
# the House record counts six other members voting, the division five. Each bloc's rows are
# the record the votes module holds (`votes.TALLIES`, Voteview), so with every bloc at its
# baseline each bill's tally is the recorded vote; a bill the record does not hold takes the
# Neutrality revision's rows (`vote_default`), as the module's borrowed rows do. The public
# starts at the Gallup "about right" figure the world cites. Themes are the ones the
# nations' writing already names: the address form's choices and the standing answers'
# statements.
groups:
  - nation: usa
    groups:
      - key: house_democrats  # source: congress_77th (seats); the rows: voteview
        name: House Democrats
        kind: party bloc
        start: 60
        baseline: 60
        chamber: house
        seats: 267
        feeds: {votes: 1, standing: 1}
        moved_by: {measure_passed: 1, war_declared: 5}
        votes:
          neutrality_revision: {house: {voting: 239, yeas: 218}, concur: {voting: 241, yeas: 188}}
          draft_extension: {house: {voting: 246, yeas: 181}}
          lend_lease_appropriation: {house: {voting: 237, yeas: 229}}
          arm_merchant_ships: {house: {voting: 239, yeas: 218}}
        vote_default: {house: {voting: 239, yeas: 218}, concur: {voting: 241, yeas: 188}}
        stances: {power: 1, limit: -1, money: 1}
      - key: house_republicans  # source: congress_77th (seats); the rows: voteview
        name: House Republicans
        kind: party bloc
        start: 35
        baseline: 35
        chamber: house
        seats: 162
        feeds: {votes: 1, standing: 1}
        moved_by: {measure_passed: -1, war_declared: 10}
