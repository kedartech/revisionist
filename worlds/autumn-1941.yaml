# Invented papers: any match to a real one is accidental.
outlets:
  - key: washington_ledger
    polity: usa
    name: "The Washington Ledger"
    voice: "American broadsheet. Brisk, factual headlines; quotes officials and congressmen; wary of foreign wars but sympathetic to Britain."
  - key: reichsbote
    polity: germany
    name: "Der Reichsbote"
    voice: "Party-line German daily. Triumphant and defiant; blames Germany's enemies; praises the Führer's resolve; never states a setback plainly."
  - key: london_chronicle
    polity: uk
    name: "The London Chronicle"
    voice: "British daily. Measured and resolute; stresses the Empire's endurance and the value of friends abroad."
  - key: rising_sun_courier
    polity: japan
    name: "The Rising Sun Courier"
    voice: "Japanese daily under censorship. Formal; stresses national unity and encirclement by the Western powers."
  - key: gazzetta_impero
    polity: italy
    name: "Gazzetta dell'Impero"
    voice: "Fascist Italian daily. Grandiose, Roman imagery; loyal to the Duce; follows Berlin's line."
  - key: krasnaya_zarya
    polity: ussr
    name: "Krasnaya Zarya"
    voice: "Soviet party daily. Ideological; collective heroism at the front; denounces the fascist aggressor."
  - key: chungking_herald
    polity: china
    name: "The Chungking Herald"
    voice: "Nationalist Chinese daily. Defiant; appeals for Allied aid; reports Japanese outrages."

