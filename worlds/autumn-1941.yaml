    steps:
      - {person: soong, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend]}
      - {person: hull, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, refuse]}

# Topics [proposed] (SHT, 14 Nov sheet): the matters Roosevelt's people want and hold to.
# An order touches a topic when its form is one of `levers`, one of its effects has a
# kind in `effects`, or one of its own words is in `words`.
topics:
  - {key: lend_lease, name: Lend-Lease, levers: [lend_lease_finding], words: [lend, lease]}
  - {key: aid_britain, name: Aid to Britain, levers: [cable_to_churchill], words: [uk, britain, british, churchill]}
  - {key: aid_soviet, name: Aid to the Soviet Union, words: [ussr, soviet, russia, moscow]}
  - {key: aid_china, name: Aid to China, words: [china, chinese, chiang, burma]}
  - {key: rearmament, name: Rearmament and war production, effects: [allocate], words: [production, munitions, aircraft, tanks, rearmament]}
  - {key: atlantic_escort, name: Escort of the Atlantic convoys, words: [escort, convoys, convoy, atlantic, iceland]}
  - {key: naval_engagement, name: Rules for engaging at sea, effects: [engagement], words: [shoot, sight, engagement]}
  - {key: fleet_movements, name: Where the fleets lie, levers: [move_fleet, detach_fleet], effects: [move_force], words: [fleet]}
  - {key: pacific_fleet, name: The Pacific Fleet, words: [pacific, pearl, harbor]}
  - {key: freedom_of_seas, name: Freedom of the seas, words: [seas, freedom, shipping]}
  - {key: europe_first, name: Germany first, words: [germany, german, europe, uboat]}
  - {key: the_draft, name: The draft, words: [draft, selective, conscription]}
  - {key: neutrality_repeal, name: Repeal of the Neutrality Act, words: [neutrality, merchant, arm]}
  - {key: legislation, name: Bills before Congress, levers: [send_bill], effects: [measure], words: [bill, congress]}
  - {key: public_opinion, name: The public's view, levers: [public_address], effects: [statement], words: [address, public, opinion]}
  - {key: national_unity, name: National unity, words: [unity, national]}
  - {key: japan_talks, name: The talks with Japan, words: [japan, japanese, talks, modus, vivendi]}
  - {key: diplomacy, name: Settlement by negotiation, effects: [deal], words: [negotiation, settlement, treaty, agreement]}
  - {key: free_trade, name: Free trade, words: [trade, tariff, tariffs, reciprocal]}
  - {key: finance, name: Credit and the Treasury, words: [credit, dollars, finance, treasury, gold, loan]}
  - {key: embargo, name: Embargo and freezing of assets, words: [embargo, oil, freeze, sanctions, exports]}

# The player's own aim (OWD), read with own_aim on: patterns a player may fill to replace
# his card's replaceable aim, by kind of post (a card's post_kind). No pattern names a place:
# a place or a nation is a blank resolved from the seat's view, and a line is a closed list
# none of whose values any group meets on the first day (support 25 to 75 at the start).
# government: whether the person's own government would issue the aim. The list, the posts
# each suits, the lines and the government marks are a balance decision. [proposed]
aim_patterns:
  - key: take_ground
    posts: [head_of_government, war_minister, fleet_commander, army_commander]
    sentence: Take {place} for {nation}.
    condition: {check: holds_area, area: $place, holder: $nation}
    blanks:
      - {name: place, kind: territory_not_held}
  - key: hold_and_take
    posts: [war_minister, fleet_commander, army_commander]
    sentence: Hold {held} and take {place}.
    condition:
      check: all_of
      conditions:
        - {check: holds_area, area: $held, holder: $nation}
        - {check: holds_area, area: $place, holder: $nation}
    blanks:
      - {name: held, kind: territory_held}
      - {name: place, kind: territory_not_held}
  - key: war_with
    posts: [head_of_government, war_minister, fleet_commander, army_commander]
    sentence: Bring {nation} into the war against {foe}.
    condition: {check: at_war, a: $nation, b: $foe}
    blanks:
      - {name: foe, kind: other_nation}
    government: false
  - key: raise_group
    posts: [head_of_government, war_minister, fleet_commander, army_commander]
    sentence: Lift {group} to {line} or more.
    condition: {check: support_at, nation: $nation, group: $group, op: ge, value: $line}
    blanks:
      - {name: group, kind: own_group}
      - {name: line, values: [80, 90]}
    government: false
  - key: weaken_group
    posts: [head_of_government, war_minister]
    sentence: Bring {group} down to {line} or less.
    condition: {check: support_at, nation: $nation, group: $group, op: le, value: $line}
    blanks:
      - {name: group, kind: own_group}
      - {name: line, values: [20, 10]}
    government: false
  - key: make_agreement
    posts: [head_of_government]
    sentence: Bring {other} into an agreement with {nation} and keep it in force.
    condition: {check: agreement_in_force, between: [$nation, $other]}
    blanks:
      - {name: other, kind: other_nation}

cards:
  # --- the eight playable cards ---
  # opposes: who each head is set against and over what (shown in the Opponents list).
  # answers: what the head does back while nobody plays them. when: a form that went
  # through (lever, params with the values that count) or a typed act that landed
  # (effect, party), by a person or polity (human: only a player's act); or a cadence
  # (every_days from start). gate: the head's stance toward whoever acted. act: one of
  # the head's own forms, or a typed effect inside their authority. helps: costs no
  # regard. until: a history item that retires the answer.
  - person: roosevelt
    post: us_presidency  # OFD
    post_kind: head_of_government
    allies: [uk, china]
    opposes:
      - {against: germany, over: "U-boat war on the Atlantic convoys"}
      - {against: tojo, over: "the Army's advance south and the oil embargo"}
    answers:
      - key: escorts_shoot_on_sight
        aim: 2
        when: {lever: uboat_directive, params: {posture: [unrestricted_atlantic]}, by: germany}
        gate: [obstructing, hostile]
        act: {lever: naval_order, params: {order: shoot_on_sight, zone: western_atlantic}}
        delay_days: 3
        cooldown_days: 30
      - key: lend_lease_to_russia
        aim: 1
        when: {lever: move_army, params: {to: [mozhaisk, moscow]}, by: germany}
        gate: [obstructing, hostile]
        act: {lever: lend_lease_finding, params: {recipient: ussr, share_pct: 20, route: arctic_route}}
        delay_days: 7
        cooldown_days: 60
      - key: warn_japan
        aim: 3
        when: {lever: mobilisation_plan, params: {sector: [oil]}, by: japan}
        gate: [obstructing, hostile]
        act: {effect: {kind: statement, theme: "a warning to Japan"}}
        delay_days: 2
        cooldown_days: 21
      - key: aid_for_russia
        aim: 1
        helps: true
        when: {lever: aid_request, by: ussr}
        gate: [neutral, cooperative, aligned]
        act: {lever: lend_lease_finding, params: {recipient: ussr, share_pct: 20, route: arctic_route}}
        delay_days: 7
        cooldown_days: 45
      - key: escort_for_britain
        aim: 2
        helps: true
        when: {lever: broadcast, params: {audience: [america]}, by: uk}
        gate: [cooperative, aligned]
        act: {lever: naval_order, params: {order: escort_convoys, zone: western_atlantic}}
        delay_days: 3
        cooldown_days: 30
    office: President of the United States
    playable: true
    principals: [usa]
    powers:
      - Commander in Chief of the Army and Navy
      - sign or veto bills
      - issue executive orders
      - make executive agreements
      - nominate and appoint officers
    levers:
      - name: send_bill
        pipeline: bill_through_congress
        resolver: votes
        label: "Send a bill to Congress"
        summary: "Ask the Speaker and the Majority Leader to carry a bill through both Houses."
        params:
          - {name: bill, kind: enum, choices: [neutrality_revision, arm_merchant_ships, lend_lease_appropriation, draft_extension], label: "Which bill", choice_labels: ["Revise the Neutrality Act", "Arm merchant ships", "Fund Lend-Lease", "Extend the draft"]}
          - {name: urgency, kind: enum, choices: [ordinary, urgent], label: "How hard to press", choice_labels: ["In the ordinary way", "As a matter of urgency"]}
      - name: lend_lease_finding
        pipeline: lend_lease_allocation
        resolver: production
        label: "Allocate Lend-Lease aid"
        summary: "Decide how much of the aid programme goes to a given country."
        params:
          - {name: recipient, kind: enum, choices: [uk, ussr, china], label: "Which country", choice_labels: ["Britain", "The Soviet Union", "China"]}
          - {name: share_pct, kind: int, lo: 0, hi: 100, label: "Share of the aid (per cent)"}
          - {name: route, kind: enum, choices: [hx_route, sc_route, arctic_route], label: "By which route", choice_labels: ["HX convoys", "SC convoys", "Arctic convoys"]}
      - name: naval_order
        pipeline: naval_order
        resolver: shipping
        label: "Give a naval order"
        summary: "Instruct the Navy how to act at sea in a stated zone."
        params:
          - {name: order, kind: enum, choices: [escort_convoys, shoot_on_sight, hold_in_port], label: "The order", choice_labels: ["Escort the convoys", "Shoot on sight", "Hold in port"]}
          - {name: zone, kind: enum, choices: [western_atlantic, iceland_route, pacific], label: "Where", choice_labels: ["Western Atlantic", "The Iceland route", "The Pacific"]}
        escort_level: {order: {escort_convoys: 1, shoot_on_sight: 2, hold_in_port: 0}}  # the levels shipping's ESCORT_LEVEL gives these words
      - name: move_fleet
        pipeline: naval_order
        resolver: movement
        label: "Move a fleet"
        summary: "Send a fleet to another base. The Navy Department carries it out."
        params:
          - {name: force, kind: enum, choices: [us_atlantic_fleet, us_pacific_fleet], label: "Which fleet", choice_labels: ["The Atlantic Fleet", "The Pacific Fleet"]}
          - {name: to, kind: enum, choices: [norfolk, argentia, reykjavik, pearl_harbor_base], label: "To", choice_labels: ["Norfolk", "Argentia", "Reykjavik", "Pearl Harbor"]}
      - name: detach_fleet
        pipeline: naval_order
        resolver: movement
        label: "Detach part of a fleet"
        summary: "Send part of a fleet's strength to another place; the rest stays where it is. The Navy Department carries it out."
        params:
          - {name: force, kind: enum, choices: [us_atlantic_fleet, us_pacific_fleet], label: "Which fleet", choice_labels: ["The Atlantic Fleet", "The Pacific Fleet"]}
          - {name: to, kind: enum, choices: [norfolk, argentia, reykjavik, pearl_harbor_base], label: "To", choice_labels: ["Norfolk", "Argentia", "Reykjavik", "Pearl Harbor"]}
          - {name: strength, kind: int, lo: 1, hi: 4, label: "How much of its strength"}
      - name: public_address
        pipeline: public_address
        resolver: opinion
        label: "Address the nation"
        summary: "Speak to the country by radio on a chosen theme."
        params:
          - {name: theme, kind: enum, choices: [aid_to_allies, freedom_of_the_seas, national_unity], label: "Theme", choice_labels: ["Aid to the Allies", "Freedom of the seas", "National unity"]}
      # [proposed] The resolver moves no figure for this lever yet: the order runs
      # its pipeline and its reply letter, and nothing more. (Executive orders gave
      # way to "Move a fleet" under the six-lever cap, Josh, Batch 6.)
      - name: cable_to_churchill
        pipeline: cable_to_churchill
        resolver: shipping
        label: "Cable the Prime Minister"
        summary: "Send Mr. Churchill a message through the State Department cable office."
        params:
          - {name: message, kind: text, label: "The message"}
      - name: fly_recon  # gap: true
        pipeline: naval_order
        resolver: intel
        label: "Fly a reconnaissance"
        summary: "Have the Hawaiian Air Force search the sea around Hawaii."
        params:
          - {name: intel, kind: enum, choices: [recon]}
          - {name: piece, kind: enum, choices: [hawaiian_air_force], label: "Which air group", choice_labels: ["Hawaiian Air Force"]}
          - {name: area, kind: enum, choices: [hawaii, central_pacific, north_pacific], label: "Over", choice_labels: ["Hawaii", "The Central Pacific", "The North Pacific"]}
      - name: send_on_patrol  # source: fdr_1941_09_11
        pipeline: naval_order
        resolver: intel
        label: "Send a fleet on patrol"
        summary: "Send a fleet to patrol its waters, as the Atlantic patrols of 1941 did."
        params:
          - {name: intel, kind: enum, choices: [patrol]}
          - {name: piece, kind: enum, choices: [us_atlantic_fleet, us_pacific_fleet], label: "Which fleet", choice_labels: ["US Atlantic Fleet", "US Pacific Fleet"]}
      - name: fund_the_codebreakers  # source: pha_1946
        pipeline: naval_order
        resolver: intel
        label: "Fund the codebreakers"
        summary: "Spend output on the Navy's and the Army's codebreakers, who read Japan's traffic."
        params:
          - {name: intel, kind: enum, choices: [codebreaking]}
    inner_circle:
      - {person: hull, channel: in_person}
