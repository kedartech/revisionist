  # The ninth playable card (KCD): a military card, flagged playable by hand, under Stark and so
  # under the President. His own forms go through his own staff (atlantic_fleet_staff), with no
  # step above him; the President's naval order still crosses his desk. His aims and their
  # conditions are written from his office: every line [proposed] (values sheet).
  - person: king
    post: atlantic_fleet_command  # OFD
    post_kind: fleet_commander
    office: Commander in Chief, Atlantic Fleet
    voice: "Gruff and curt; gives orders, not reasons, and expects them carried out at once."
    addressed_as: "Admiral King"
    playable: true
    path: military
    principals: [stark]
    powers: [command the Atlantic Fleet, order escorts and patrols]
    inner_circle:
      - {person: stark, channel: cable}
      - {person: roosevelt, channel: cable}
    feeds: [atlantic_reports]
    pipelines: [naval_order, atlantic_fleet_staff]
    levers:
      - name: move_fleet
        pipeline: atlantic_fleet_staff
        resolver: movement
        label: "Move the fleet"
        summary: "Send the Atlantic Fleet to another base. Your staff carries it out."
        params:
          - {name: force, kind: enum, choices: [us_atlantic_fleet], label: "Which fleet", choice_labels: ["The Atlantic Fleet"]}
          - {name: to, kind: enum, choices: [norfolk, argentia, reykjavik], label: "To", choice_labels: ["Norfolk", "Argentia", "Reykjavik"]}
      - name: detach_fleet
        pipeline: atlantic_fleet_staff
        resolver: movement
        label: "Detach part of the fleet"
        summary: "Send part of the Atlantic Fleet's strength to another base; the rest stays where it is."
        params:
          - {name: force, kind: enum, choices: [us_atlantic_fleet], label: "Which fleet", choice_labels: ["The Atlantic Fleet"]}
          - {name: to, kind: enum, choices: [norfolk, argentia, reykjavik], label: "To", choice_labels: ["Norfolk", "Argentia", "Reykjavik"]}
          - {name: strength, kind: int, lo: 1, hi: 4, label: "How much of its strength"}
      # The fleet's naval order: how it fights in a stated zone. war_zone is the route beyond
      # Iceland into the war zone (the region war_zone above). Two of its orders are locked
      # (`locks`). The President's own naval order keeps its three zones.
      - name: fleet_naval_order
        pipeline: atlantic_fleet_staff
        resolver: shipping
        label: "Give the fleet a naval order"
        summary: "Tell the Atlantic Fleet how to act at sea in a stated zone."
        params:
          - {name: order, kind: enum, choices: [escort_convoys, shoot_on_sight, hold_in_port], label: "The order", choice_labels: ["Escort the convoys", "Shoot on sight", "Hold in port"]}
          - {name: zone, kind: enum, choices: [western_atlantic, iceland_route, war_zone], label: "Where", choice_labels: ["Western Atlantic", "The Iceland route", "Beyond Iceland, into the war zone"]}
        escort_level: {order: {escort_convoys: 1, shoot_on_sight: 2, hold_in_port: 0}}  # the levels shipping's ESCORT_LEVEL gives these words
    loyalty: 0
    competence: 4
    wants: [naval_engagement, fleet_movements]
    holds_to: [atlantic_escort]
    reach: {rank: 2}
    horizon_days: 7
    aims:
      - "Get the convoys through to Britain."
      - "Hold the Atlantic bases the fleet escorts to."
      - "Win the fleet leave to escort beyond Iceland."
    aim_rules:
      - {aim: 1, deadline: 1941-12-07, rule: "The war against Germany is decided for Britain.", condition: {check: contest_won, contest: atlantic_war, side: uk}}
      - {aim: 2, deadline: 1941-12-07, rule: "Iceland, Newfoundland and Britain's two home territories stay British.", condition: {check: all_of, conditions: [{check: holds_area, area: iceland, holder: uk}, {check: holds_area, area: newfoundland, holder: uk}, {check: holds_area, area: britain_south, holder: uk}, {check: holds_area, area: britain_north, holder: uk}]}}
      - {aim: 3, deadline: 1941-12-07, replaceable: true, rule: "The Neutrality revision becomes law.", condition: {check: quantity_at, quantity: neutrality_revision_passed, op: ge, value: 1}}
    authority:
      - name: atlantic_fleet
        effects: [move_force, engagement]
        forces: [us_atlantic_fleet]
        summary: "Command of the Atlantic Fleet: where it goes, what it detaches, how it fights."
  # The tenth playable card (NUK): a military card, flagged playable by hand, under the First Sea
  # Lord and so under the Prime Minister, whose own order over the Home Fleet stands. His own forms
