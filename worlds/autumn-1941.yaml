# How each kind of happening reaches the groups at home, read with `classes` on (HFD), as the
# design's first sort of events has it: a capital threatened is felt; a battle won or lost,
# losses at sea, territory taken, war declared and an agreement broken are known by report;
# territory lost and the size of a day's battle losses are mixed, half felt. A law touching
# daily life passed is felt, any other measure reported. Each felt share is [proposed].
happenings:
  - {kind: capital_threatened, reach: felt}
  - {kind: battle_won, reach: reported}
  - {kind: battle_lost, reach: reported}
  - {kind: losses_at_sea, reach: reported}
  - {kind: territory_taken, reach: reported}
  - {kind: war_declared, reach: reported}
  - {kind: agreement_broken, reach: reported}
  - {kind: territory_lost, reach: reported, felt: 0.5}
  - {kind: battle_losses, reach: reported, felt: 0.5}
  - {kind: measure_passed, reach: reported}
  - {kind: daily_life_passed, reach: felt}

# Places with political weight, read with `places` on (HFD): for each nation with groups, up to
# five territories it holds on 1 September 1941 whose loss the record shows weighed at home,
# with the points each of its groups moves when the place is lost after a fight (abandoning it
# costs twice that, retaking it moves them back). Each line carries `gap: true`: no figure is
# sourced. Every amount is [proposed]. A nation's seat stays its `capital`; a seat listed here
# is also a weighted place.
places:
  - {territory: hawaii, nation: usa, moves: {public: -3, press: -2, house_democrats: -1, senate_democrats: -1}}  # gap: true (Pearl Harbor, the Pacific Fleet's base)
  - {territory: philippines, nation: usa, moves: {public: -2, press: -1}}  # gap: true (the Commonwealth the United States had promised to defend)
  - {territory: britain_south, nation: uk, moves: {commons: -5, public: -5, dominions: -3}}  # gap: true (London and the home island)
  - {territory: egypt, nation: uk, moves: {commons: -3, dominions: -2, press: -2}}  # gap: true (Suez and the Nile army's base)
  - {territory: british_islands, nation: uk, moves: {commons: -2, public: -1, press: -1}}  # gap: true (Malta, under siege)
  - {territory: tobruk_area, nation: uk, moves: {commons: -2, dominions: -2, press: -2}}  # gap: true (the besieged garrison, Australian and British)
  - {territory: malaya, nation: uk, moves: {commons: -3, dominions: -3, press: -2}}  # gap: true (Singapore, the Far East's fortress)
  - {territory: moscow_area, nation: ussr, moves: {party: -5, public: -4, red_army_command: -3}}  # gap: true (the capital)
  - {territory: leningrad_area, nation: ussr, moves: {party: -4, public: -3, evacuated_workers: -2}}  # gap: true (the city of the revolution, under siege)
  - {territory: kiev_area, nation: ussr, moves: {party: -2, red_army_command: -2, public: -2}}  # gap: true (the Ukraine's capital)
  - {territory: crimea, nation: ussr, moves: {red_army_command: -2, public: -1}}  # gap: true (Sevastopol and the Black Sea Fleet)
  - {territory: caucasus, nation: ussr, moves: {party: -3, evacuated_workers: -2, red_army_command: -2}}  # gap: true (Baku's oil)
  - {territory: germany_east, nation: germany, moves: {party: -5, public: -5, wehrmacht_command: -3}}  # gap: true (Berlin)
  - {territory: germany_west, nation: germany, moves: {industrialists: -4, public: -3}}  # gap: true (the Ruhr)
  - {territory: east_prussia, nation: germany, moves: {wehrmacht_command: -3, party: -2, public: -2}}  # gap: true (the Prussian heartland and the Führer's headquarters)
  - {territory: japan_east, nation: japan, moves: {court: -5, public: -5, navy: -3, army: -3}}  # gap: true (Tokyo and the home islands)
  - {territory: manchuria, nation: japan, moves: {army: -4, zaibatsu: -2, public: -2}}  # gap: true (Manchukuo, the Kwantung Army's charge)
  - {territory: korea, nation: japan, moves: {army: -2, court: -2}}  # gap: true (a colony since 1910)
  - {territory: formosa, nation: japan, moves: {navy: -2, court: -1}}  # gap: true (a colony since 1895)
