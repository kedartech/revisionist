# Autumn 1941: 1 September to 7 December 1941, a realism world (realism plan, Phase 3).
#
# No seat is pre-assigned: any of the eight playable cards may be claimed at
# Session Zero and the rest are run by code. Every figure is cited to a source
# declared below (values from the Phase 0b source note) or left `gap: true`
# with no value. Step lengths, feed cadences and horizons are unsourced gaps or
# design values [proposed], not data. Offices are as of 1 September 1941.
# There is no Map Room feed: it was established in January 1942.

world: autumn-1941
name: Autumn 1941
ruleset: realism
start: "Washington, September 1941"
start_date: 1941-09-01

# battles and reports (ITD): battles run one round a day; enemy pieces reach a nation only as
# reports from the people named under `intelligence`.
# groups (GRD): each nation's groups at home, declared under `groups`.
# command and locks (KCD): Admiral King's card is a military card under the President, and
# two of his naval orders are held by the locks declared under `locks`.
# laws and ask_answers (LWD): the four American bills are the laws declared under `laws`; an ask to
# a person no player holds is answered on its due day. deciders stays off until the world names a
# council and the kinds of question its posts decide, which the world check requires with it on.
# classes, losses and places (HFD): the class of each kind of happening under `happenings`, the
# groups the size of a day's battle losses moves (`battle_losses` in their `moved_by`), and the
# places with political weight under `places`.
# posts, office and defiance (OFD): each card names its post; what each head's post rests on and
# how its holder is removed, who may move each commander, his ladder and his acts without leave
# are on the office assets under `assets`, from Ava's sourcing note or marked a gap.
# playable_rule (PBD): the roster is the cards the playable rule admits at the default floor
# (rank 2, a force of tier 3), which are the cards flagged playable by hand; none is held back.
rules: [territories, holders, economy, supply, fuel, aid, battles, reports, agreements, conference, groups, contests, aims, command, locks, own_aim, laws, ask_answers, deciders, offers, classes, losses, places, posts, office, defiance, peace, playable_rule]

entities:
