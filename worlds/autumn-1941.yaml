  - {key: mac_reports, name: Military Affairs Commission reports, author: he_yingqin, kind: report, channel: courier, classification: secret, sights: [chinese_army, ninth_war_area, eleventh_army], every_days: 3, latency_days: 1, assumed: true, gap: true}

pipelines:
  - key: executive_order
    name: An executive order
    gap: true
    steps:
      - {person: wh_clerk, kind: clerical, days: 1, assumed: true}
      - {person: roosevelt, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend, refuse]}
  # The House floor vote is the `votes` resolver's, at settlement, not a person's step.
  # Step lengths from H.J.Res. 237: message 9 Oct, House 17 Oct (8 days), Senate
  # 7 Nov (21 days, one of them the clerk's), signed 17 Nov (10 days). The 13 Nov concurrence
  # is a floor vote, so it is the votes resolver's, not a step.
  - key: bill_through_congress
    name: A bill through Congress
    source: hjr237_timeline
    steps:
      - {person: rayburn, kind: decision, days: 8, allowed: [pass, expedite, stall, amend, refuse, leak]}
      - {person: house_clerk, kind: clerical, days: 1, assumed: true}
      - {person: barkley, kind: decision, days: 20, allowed: [pass, expedite, stall, amend, refuse, leak]}
      - {person: roosevelt, kind: decision, days: 10, allowed: [pass, refuse]}
  - key: naval_order
    name: A naval order
    gap: true
    steps:
      - {person: stark, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend, refuse]}
      - {person: king, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, refuse]}
  - key: cable_to_churchill
    name: A cable to the Prime Minister
    gap: true
    steps:
      - {person: cable_clerk, kind: clerical, days: 1, assumed: true}
      - {person: churchill, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, leak, refuse]}
  - key: lend_lease_allocation
    name: A Lend-Lease allocation
    gap: true
    steps:
      - {person: hopkins, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend]}
      - {person: stettinius, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, refuse]}
      - {person: roosevelt, kind: decision, days: 2, assumed: true, allowed: [pass, refuse]}
  - key: public_address
    name: A public address
    gap: true
    steps:
      - {person: early, kind: clerical, days: 1, assumed: true}
  - key: cos_directive
    name: A Chiefs of Staff directive
    gap: true
    steps:
      - {person: pound, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend, refuse]}
      - {person: ismay, kind: clerical, days: 1, assumed: true}
  - key: cable_to_roosevelt
    name: A cable to the President
    gap: true
    steps:
      - {person: uk_cipher_clerk, kind: clerical, days: 1, assumed: true}
      - {person: roosevelt, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, leak, refuse]}
  - key: press_broadcast
    name: A broadcast to the nation
    gap: true
    steps:
      - {person: bbc_clerk, kind: clerical, days: 1, assumed: true}
  - key: japan_state_policy
    name: Liaison Conference to Imperial sanction
    gap: true
    steps:
      - {person: sugiyama, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, refuse]}
      - {person: nagano, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, refuse]}
      - {person: hirohito, kind: decision, days: 2, assumed: true, allowed: [pass, stall, refuse]}
  - key: cabinet_statement
    name: A cabinet statement
    gap: true
    steps:
      - {person: cabinet_clerk, kind: clerical, days: 1, assumed: true}
  - key: okw_directive
    name: An OKW directive
    gap: true
    steps:
      - {person: jodl, kind: clerical, days: 1, assumed: true}
      - {person: raeder, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend, refuse]}
  - key: okw_army_directive
    name: An OKW army directive
    gap: true
    steps:
      - {person: jodl, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend]}
  - key: reich_declaration
    name: A declaration of war, delivered by the Foreign Office
    gap: true
    steps:
      - {person: ribbentrop, kind: decision, days: 1, assumed: true, allowed: [pass, expedite, stall, amend]}
  - key: gko_decree
    name: A Stavka or State Defence Committee decree
    gap: true
    steps:
      - {person: shaposhnikov, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend]}
      - {person: molotov, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall]}
  - key: soviet_aid_request
    name: A Soviet request for aid
    gap: true
    steps:
      - {person: molotov, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend]}
      - {person: hopkins, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend, refuse]}
  - key: comando_supremo_order
    name: A Comando Supremo order
    gap: true
    steps:
      - {person: cavallero, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend, refuse]}
  - key: mac_order
    name: A Military Affairs Commission order
    gap: true
    steps:
      - {person: he_yingqin, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend, refuse]}
  - key: appeal_through_soong
    name: An appeal to Washington through Soong
    gap: true
    steps:
      - {person: soong, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend]}
      - {person: hull, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, refuse]}

# Topics [proposed] (SHT, 14 Nov sheet): the matters Roosevelt's people want and hold to.
# An order touches a topic when its form is one of `levers`, one of its effects has a
# kind in `effects`, or one of its own words is in `words`.
topics:
  - {key: lend_lease, name: Lend-Lease, levers: [lend_lease_finding], words: [lend, lease]}
  - {key: aid_britain, name: Aid to Britain, levers: [cable_to_churchill], words: [uk, britain, british, churchill]}
  - {key: aid_soviet, name: Aid to the Soviet Union, words: [ussr, soviet, russia, moscow]}
  - {key: aid_china, name: Aid to China, words: [china, chinese, chiang, burma]}
  - {key: rearmament, name: Rearmament and war production, effects: [allocate], words: [production, munitions, aircraft, tanks, rearmament]}
  - {key: atlantic_escort, name: Escort of the Atlantic convoys, words: [escort, convoys, convoy, atlantic, iceland]}
  - {key: naval_engagement, name: Rules for engaging at sea, effects: [engagement], words: [shoot, sight, engagement]}
  - {key: fleet_movements, name: Where the fleets lie, levers: [move_fleet, detach_fleet], effects: [move_force], words: [fleet]}
  - {key: pacific_fleet, name: The Pacific Fleet, words: [pacific, pearl, harbor]}
  - {key: freedom_of_seas, name: Freedom of the seas, words: [seas, freedom, shipping]}
  - {key: europe_first, name: Germany first, words: [germany, german, europe, uboat]}
  - {key: the_draft, name: The draft, words: [draft, selective, conscription]}
  - {key: neutrality_repeal, name: Repeal of the Neutrality Act, words: [neutrality, merchant, arm]}
  - {key: legislation, name: Bills before Congress, levers: [send_bill], effects: [measure], words: [bill, congress]}
  - {key: public_opinion, name: The public's view, levers: [public_address], effects: [statement], words: [address, public, opinion]}
  - {key: national_unity, name: National unity, words: [unity, national]}
  - {key: japan_talks, name: The talks with Japan, words: [japan, japanese, talks, modus, vivendi]}
  - {key: diplomacy, name: Settlement by negotiation, effects: [deal], words: [negotiation, settlement, treaty, agreement]}
  - {key: free_trade, name: Free trade, words: [trade, tariff, tariffs, reciprocal]}
  - {key: finance, name: Credit and the Treasury, words: [credit, dollars, finance, treasury, gold, loan]}
  - {key: embargo, name: Embargo and freezing of assets, words: [embargo, oil, freeze, sanctions, exports]}

cards:
  # --- the eight playable cards ---
  # opposes: who each head is set against and over what (shown in the Opponents list).
  # answers: what the head does back while nobody plays them. when: a form that went
  # through (lever, params with the values that count) or a typed act that landed
  # (effect, party), by a person or polity (human: only a player's act); or a cadence
  # (every_days from start). gate: the head's stance toward whoever acted. act: one of
  # the head's own forms, or a typed effect inside their authority. helps: costs no
  # regard. until: a history item that retires the answer.
  - person: roosevelt
    allies: [uk, china]
    opposes:
      - {against: germany, over: "U-boat war on the Atlantic convoys"}
      - {against: tojo, over: "the Army's advance south and the oil embargo"}
    answers:
      - key: escorts_shoot_on_sight
        aim: 2
        when: {lever: uboat_directive, params: {posture: [unrestricted_atlantic]}, by: germany}
        gate: [obstructing, hostile]
        act: {lever: naval_order, params: {order: shoot_on_sight, zone: western_atlantic}}
        delay_days: 3
        cooldown_days: 30
      - key: lend_lease_to_russia
        aim: 1
        when: {lever: move_army, params: {to: [mozhaisk, moscow]}, by: germany}
        gate: [obstructing, hostile]
        act: {lever: lend_lease_finding, params: {recipient: ussr, share_pct: 20, route: arctic_route}}
        delay_days: 7
        cooldown_days: 60
      - key: warn_japan
        aim: 3
        when: {lever: mobilisation_plan, params: {sector: [oil]}, by: japan}
        gate: [obstructing, hostile]
        act: {effect: {kind: statement, theme: "a warning to Japan"}}
        delay_days: 2
        cooldown_days: 21
      - key: aid_for_russia
        aim: 1
        helps: true
        when: {lever: aid_request, by: ussr}
        gate: [neutral, cooperative, aligned]
        act: {lever: lend_lease_finding, params: {recipient: ussr, share_pct: 20, route: arctic_route}}
        delay_days: 7
        cooldown_days: 45
      - key: escort_for_britain
        aim: 2
        helps: true
        when: {lever: broadcast, params: {audience: [america]}, by: uk}
        gate: [cooperative, aligned]
        act: {lever: naval_order, params: {order: escort_convoys, zone: western_atlantic}}
        delay_days: 3
        cooldown_days: 30
    office: President of the United States
    playable: true
    principals: [usa]
    powers:
      - Commander in Chief of the Army and Navy
      - sign or veto bills
      - issue executive orders
      - make executive agreements
      - nominate and appoint officers
    levers:
      - name: send_bill
        pipeline: bill_through_congress
        resolver: votes
        label: "Send a bill to Congress"
        summary: "Ask the Speaker and the Majority Leader to carry a bill through both Houses."
        params:
          - {name: bill, kind: enum, choices: [neutrality_revision, arm_merchant_ships, lend_lease_appropriation, draft_extension], label: "Which bill", choice_labels: ["Revise the Neutrality Act", "Arm merchant ships", "Fund Lend-Lease", "Extend the draft"]}
          - {name: urgency, kind: enum, choices: [ordinary, urgent], label: "How hard to press", choice_labels: ["In the ordinary way", "As a matter of urgency"]}
      - name: lend_lease_finding
        pipeline: lend_lease_allocation
        resolver: production
        label: "Allocate Lend-Lease aid"
        summary: "Decide how much of the aid programme goes to a given country."
        params:
          - {name: recipient, kind: enum, choices: [uk, ussr, china], label: "Which country", choice_labels: ["Britain", "The Soviet Union", "China"]}
          - {name: share_pct, kind: int, lo: 0, hi: 100, label: "Share of the aid (per cent)"}
          - {name: route, kind: enum, choices: [hx_route, sc_route, arctic_route], label: "By which route", choice_labels: ["HX convoys", "SC convoys", "Arctic convoys"]}
      - name: naval_order
        pipeline: naval_order
        resolver: shipping
        label: "Give a naval order"
        summary: "Instruct the Navy how to act at sea in a stated zone."
        params:
          - {name: order, kind: enum, choices: [escort_convoys, shoot_on_sight, hold_in_port], label: "The order", choice_labels: ["Escort the convoys", "Shoot on sight", "Hold in port"]}
          - {name: zone, kind: enum, choices: [western_atlantic, iceland_route, pacific], label: "Where", choice_labels: ["Western Atlantic", "The Iceland route", "The Pacific"]}
      - name: move_fleet
        pipeline: naval_order
        resolver: movement
        label: "Move a fleet"
        summary: "Send a fleet to another base. The Navy Department carries it out."
        params:
          - {name: force, kind: enum, choices: [us_atlantic_fleet, us_pacific_fleet], label: "Which fleet", choice_labels: ["The Atlantic Fleet", "The Pacific Fleet"]}
          - {name: to, kind: enum, choices: [norfolk, argentia, reykjavik, pearl_harbor_base], label: "To", choice_labels: ["Norfolk", "Argentia", "Reykjavik", "Pearl Harbor"]}
      - name: detach_fleet
        pipeline: naval_order
        resolver: movement
        label: "Detach part of a fleet"
        summary: "Send part of a fleet's strength to another place; the rest stays where it is. The Navy Department carries it out."
        params:
          - {name: force, kind: enum, choices: [us_atlantic_fleet, us_pacific_fleet], label: "Which fleet", choice_labels: ["The Atlantic Fleet", "The Pacific Fleet"]}
          - {name: to, kind: enum, choices: [norfolk, argentia, reykjavik, pearl_harbor_base], label: "To", choice_labels: ["Norfolk", "Argentia", "Reykjavik", "Pearl Harbor"]}
          - {name: strength, kind: int, lo: 1, hi: 4, label: "How much of its strength"}
      - name: public_address
        pipeline: public_address
        resolver: opinion
        label: "Address the nation"
        summary: "Speak to the country by radio on a chosen theme."
        params:
          - {name: theme, kind: enum, choices: [aid_to_allies, freedom_of_the_seas, national_unity], label: "Theme", choice_labels: ["Aid to the Allies", "Freedom of the seas", "National unity"]}
      # [proposed] The resolver moves no figure for this lever yet: the order runs
      # its pipeline and its reply letter, and nothing more. (Executive orders gave
      # way to "Move a fleet" under the six-lever cap, Josh, Batch 6.)
      - name: cable_to_churchill
        pipeline: cable_to_churchill
        resolver: shipping
        label: "Cable the Prime Minister"
        summary: "Send Mr. Churchill a message through the State Department cable office."
        params:
          - {name: message, kind: text, label: "The message"}
      - name: fly_recon  # gap: true
        pipeline: naval_order
        resolver: intel
        label: "Fly a reconnaissance"
        summary: "Have the Hawaiian Air Force search the sea around Hawaii."
        params:
          - {name: intel, kind: enum, choices: [recon]}
          - {name: piece, kind: enum, choices: [hawaiian_air_force], label: "Which air group", choice_labels: ["Hawaiian Air Force"]}
          - {name: area, kind: enum, choices: [hawaii, central_pacific, north_pacific], label: "Over", choice_labels: ["Hawaii", "The Central Pacific", "The North Pacific"]}
      - name: send_on_patrol  # source: fdr_1941_09_11
        pipeline: naval_order
        resolver: intel
        label: "Send a fleet on patrol"
        summary: "Send a fleet to patrol its waters, as the Atlantic patrols of 1941 did."
        params:
          - {name: intel, kind: enum, choices: [patrol]}
          - {name: piece, kind: enum, choices: [us_atlantic_fleet, us_pacific_fleet], label: "Which fleet", choice_labels: ["US Atlantic Fleet", "US Pacific Fleet"]}
      - name: fund_the_codebreakers  # source: pha_1946
        pipeline: naval_order
        resolver: intel
        label: "Fund the codebreakers"
        summary: "Spend output on the Navy's and the Army's codebreakers, who read Japan's traffic."
        params:
          - {name: intel, kind: enum, choices: [codebreaking]}
    inner_circle:
      - {person: hull, channel: in_person}
      - {person: hopkins, channel: in_person}
      - {person: stimson, channel: in_person}
      - {person: knox, channel: in_person}
      - {person: marshall, channel: in_person}
      - {person: stark, channel: in_person}
      - {person: early, channel: in_person}
      - {person: rayburn, channel: telephone}
      - {person: barkley, channel: telephone}
      - {person: churchill, channel: cable}
    feeds: [state_dept_reports, magic_intercepts, gallup_polls, house_whip_count, senate_whip_count, atlantic_reports, churchill_cables, soviet_requests]
    pipelines: [bill_through_congress, naval_order, cable_to_churchill, lend_lease_allocation, public_address]
    constraints:
      - Congress alone declares war
      - Congress holds appropriations
      - Neutrality Act of 1939 in force
      - a third-term President with a divided Congress
    personal: [legs paralysed by polio; kept from the public]
    successor: wallace
    horizon_days: 14
    aims:
      - "Keep Britain and the Soviet Union supplied through Lend-Lease, short of a declaration of war."
      - "Protect the Atlantic convoys against German submarines."
      - "Hold Japan in check with the oil embargo and talks while the Army and Navy rearm."
    # What makes each aim a goal: every line and date [proposed] (values sheet). Aims 1 and 2
    # are from the post; aim 3 is the default a player's own aim would replace.
    aim_rules:
      - {aim: 1, deadline: 1941-12-07, rule: "The Soviet Union is made eligible for Lend-Lease and the United States is not at war with Germany.", condition: {check: all_of, conditions: [{check: quantity_at, quantity: soviet_lend_lease_eligible, op: ge, value: 1}, {check: at_war, a: usa, b: germany, war: false}]}}
      - {aim: 2, deadline: 1941-12-07, rule: "Britain's war-economy figure stays at 34 or more, and Iceland and Newfoundland stay British.", condition: {check: all_of, conditions: [{check: income_at, nation: uk, op: ge, value: 34}, {check: holds_area, area: iceland, holder: uk}, {check: holds_area, area: newfoundland, holder: uk}]}}
      - {aim: 3, deadline: 1941-12-07, replaceable: true, rule: "The United States is not at war with Japan, and Japan has taken neither the Philippines nor the Dutch East Indies.", condition: {check: all_of, conditions: [{check: at_war, a: usa, b: japan, war: false}, {check: holds_area, area: philippines, holder: usa}, {check: holds_area, area: dutch_east_indies, holder: netherlands}]}}
    voice: Warm, confident, evasive when pressed; never commits to a date for war.
    addressed_as: "Mr. President"
    interests: [aid to Britain and the Soviet Union, keeping the public behind him]
    # Authority and reach are design values [proposed]; the offices are as of 1 Sep 1941.
    authority:
      - name: naval_operations
        effects: [move_force, engagement]
        executor: stark
        forces: [us_atlantic_fleet, us_pacific_fleet]
        summary: "Orders to the fleets, carried out by the Chief of Naval Operations."
      - name: public_word
        effects: [statement]
        summary: "Speak to the nation, by radio or to the press."
      - name: appointments
        effects: [appointment]
        summary: "Nominate and appoint officers and officials."
      - name: executive_agreements
        effects: [deal]
        executor: hull
        summary: "Make executive agreements with other governments, through the State Department."
      - name: lend_lease
        effects: [allocate]
        summary: "Decide how the aid programme is shared out."
    reach: {rank: 5, chain: [usa], heads: true}
  - person: churchill
    allies: [usa, ussr]
    opposes:
      - {against: germany, over: "the war at sea and the bombing of Britain", irreducible: true}
      - {against: italy, over: "Malta, Libya and the Mediterranean"}
      - {against: japan, over: "Japan's threat to Malaya and Singapore"}
    answers:
      - key: home_fleet_to_iceland
        aim: 1
        when: {lever: uboat_directive, params: {posture: [unrestricted_atlantic], theatre: [north_atlantic]}, by: germany}
        gate: [obstructing, hostile]
        act: {lever: move_fleet, params: {force: home_fleet, to: reykjavik}}
