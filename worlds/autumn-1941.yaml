# Autumn 1941: 1 September to 7 December 1941, a realism world (realism plan, Phase 3).
#
# No seat is pre-assigned: any of the eight playable cards may be claimed at
# Session Zero and the rest are run by code. Every figure is cited to a source
# declared below (values from the Phase 0b source note) or left `gap: true`
# with no value. Step lengths, feed cadences and horizons are unsourced gaps or
# design values [proposed], not data. Offices are as of 1 September 1941.
# There is no Map Room feed: it was established in January 1942.

world: autumn-1941
name: Autumn 1941
ruleset: realism
start: "Washington, September 1941"
start_date: 1941-09-01

