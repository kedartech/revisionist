cards:
  # --- the eight playable cards ---
  # opposes: who each head is set against and over what (shown in the Opponents list).
  # answers: what the head does back while nobody plays them. when: a form that went
  # through (lever, params with the values that count) or a typed act that landed
  # (effect, party), by a person or polity (human: only a player's act); or a cadence
  # (every_days from start). gate: the head's stance toward whoever acted. act: one of
  # the head's own forms, or a typed effect inside their authority. helps: costs no
  # regard. until: a history item that retires the answer.
  - person: roosevelt
    allies: [uk, china]
    opposes:
      - {against: germany, over: "U-boat war on the Atlantic convoys"}
      - {against: tojo, over: "the Army's advance south and the oil embargo"}
    answers:
      - key: escorts_shoot_on_sight
        aim: 2
        when: {lever: uboat_directive, params: {posture: [unrestricted_atlantic]}, by: germany}
        gate: [obstructing, hostile]
        act: {lever: naval_order, params: {order: shoot_on_sight, zone: western_atlantic}}
        delay_days: 3
        cooldown_days: 30
      - key: lend_lease_to_russia
        aim: 1
        when: {lever: move_army, params: {to: [mozhaisk, moscow]}, by: germany}
        gate: [obstructing, hostile]
        act: {lever: lend_lease_finding, params: {recipient: ussr, share_pct: 20}}
        delay_days: 7
        cooldown_days: 60
      - key: warn_japan
        aim: 3
        when: {lever: mobilisation_plan, params: {sector: [oil]}, by: japan}
        gate: [obstructing, hostile]
        act: {effect: {kind: statement, theme: "a warning to Japan"}}
        delay_days: 2
        cooldown_days: 21
      - key: aid_for_russia
        aim: 1
        helps: true
        when: {lever: aid_request, by: ussr}
        gate: [neutral, cooperative, aligned]
        act: {lever: lend_lease_finding, params: {recipient: ussr, share_pct: 20}}
        delay_days: 7
        cooldown_days: 45
      - key: escort_for_britain
        aim: 2
        helps: true
        when: {lever: broadcast, params: {audience: [america]}, by: uk}
        gate: [cooperative, aligned]
        act: {lever: naval_order, params: {order: escort_convoys, zone: western_atlantic}}
        delay_days: 3
        cooldown_days: 30
    office: President of the United States
    playable: true
    principals: [usa]
    powers:
      - Commander in Chief of the Army and Navy
      - sign or veto bills
      - issue executive orders
      - make executive agreements
      - nominate and appoint officers
    levers:
      - name: send_bill
        pipeline: bill_through_congress
        resolver: votes
        label: "Send a bill to Congress"
        summary: "Ask the Speaker and the Majority Leader to carry a bill through both Houses."
        params:
          - {name: bill, kind: enum, choices: [neutrality_revision, arm_merchant_ships, lend_lease_appropriation, draft_extension], label: "Which bill", choice_labels: ["Revise the Neutrality Act", "Arm merchant ships", "Fund Lend-Lease", "Extend the draft"]}
          - {name: urgency, kind: enum, choices: [ordinary, urgent], label: "How hard to press", choice_labels: ["In the ordinary way", "As a matter of urgency"]}
      - name: lend_lease_finding
        pipeline: lend_lease_allocation
        resolver: production
        label: "Allocate Lend-Lease aid"
        summary: "Decide how much of the aid programme goes to a given country."
        params:
          - {name: recipient, kind: enum, choices: [uk, ussr, china], label: "Which country", choice_labels: ["Britain", "The Soviet Union", "China"]}
          - {name: share_pct, kind: int, lo: 0, hi: 100, label: "Share of the aid (per cent)"}
      - name: naval_order
        pipeline: naval_order
        resolver: shipping
        label: "Give a naval order"
        summary: "Instruct the Navy how to act at sea in a stated zone."
        params:
          - {name: order, kind: enum, choices: [escort_convoys, shoot_on_sight, hold_in_port], label: "The order", choice_labels: ["Escort the convoys", "Shoot on sight", "Hold in port"]}
          - {name: zone, kind: enum, choices: [western_atlantic, iceland_route, pacific], label: "Where", choice_labels: ["Western Atlantic", "The Iceland route", "The Pacific"]}
      - name: move_fleet
        pipeline: naval_order
        resolver: movement
        label: "Move a fleet"
        summary: "Send a fleet to another base. The Navy Department carries it out."
        params:
          - {name: force, kind: enum, choices: [us_atlantic_fleet, us_pacific_fleet], label: "Which fleet", choice_labels: ["The Atlantic Fleet", "The Pacific Fleet"]}
          - {name: to, kind: enum, choices: [norfolk, argentia, reykjavik, pearl_harbor_base], label: "To", choice_labels: ["Norfolk", "Argentia", "Reykjavik", "Pearl Harbor"]}
      - name: detach_fleet
        pipeline: naval_order
        resolver: movement
        label: "Detach part of a fleet"
        summary: "Send part of a fleet's strength to another place; the rest stays where it is. The Navy Department carries it out."
        params:
          - {name: force, kind: enum, choices: [us_atlantic_fleet, us_pacific_fleet], label: "Which fleet", choice_labels: ["The Atlantic Fleet", "The Pacific Fleet"]}
          - {name: to, kind: enum, choices: [norfolk, argentia, reykjavik, pearl_harbor_base], label: "To", choice_labels: ["Norfolk", "Argentia", "Reykjavik", "Pearl Harbor"]}
          - {name: strength, kind: int, lo: 1, hi: 4, label: "How much of its strength"}
      - name: public_address
        pipeline: public_address
        resolver: opinion
        label: "Address the nation"
        summary: "Speak to the country by radio on a chosen theme."
        params:
          - {name: theme, kind: enum, choices: [aid_to_allies, freedom_of_the_seas, national_unity], label: "Theme", choice_labels: ["Aid to the Allies", "Freedom of the seas", "National unity"]}
      # [proposed] The resolver moves no figure for this lever yet: the order runs
      # its pipeline and its reply letter, and nothing more. (Executive orders gave
      # way to "Move a fleet" under the six-lever cap, Josh, Batch 6.)
      - name: cable_to_churchill
        pipeline: cable_to_churchill
        resolver: shipping
        label: "Cable the Prime Minister"
        summary: "Send Mr. Churchill a message through the State Department cable office."
        params:
          - {name: message, kind: text, label: "The message"}
    inner_circle:
      - {person: hull, channel: in_person}
      - {person: hopkins, channel: in_person}
      - {person: stimson, channel: in_person}
      - {person: knox, channel: in_person}
      - {person: marshall, channel: in_person}
      - {person: stark, channel: in_person}
      - {person: early, channel: in_person}
      - {person: rayburn, channel: telephone}
      - {person: barkley, channel: telephone}
      - {person: churchill, channel: cable}
    feeds: [state_dept_reports, magic_intercepts, gallup_polls, house_whip_count, senate_whip_count, atlantic_reports, churchill_cables, soviet_requests]
    pipelines: [bill_through_congress, naval_order, cable_to_churchill, lend_lease_allocation, public_address]
    constraints:
      - Congress alone declares war
      - Congress holds appropriations
      - Neutrality Act of 1939 in force
      - a third-term President with a divided Congress
    personal: [legs paralysed by polio; kept from the public]
    successor: wallace
    horizon_days: 14
    aims:
      - "Keep Britain and the Soviet Union supplied through Lend-Lease, short of a declaration of war."
      - "Protect the Atlantic convoys against German submarines."
      - "Hold Japan in check with the oil embargo and talks while the Army and Navy rearm."
    voice: Warm, confident, evasive when pressed; never commits to a date for war.
    addressed_as: "Mr. President"
    interests: [aid to Britain and the Soviet Union, keeping the public behind him]
    # Authority and reach are design values [proposed]; the offices are as of 1 Sep 1941.
    authority:
      - name: naval_operations
        effects: [move_force, engagement]
        executor: stark
        forces: [us_atlantic_fleet, us_pacific_fleet]
        summary: "Orders to the fleets, carried out by the Chief of Naval Operations."
      - name: public_word
        effects: [statement]
        summary: "Speak to the nation, by radio or to the press."
      - name: appointments
        effects: [appointment]
        summary: "Nominate and appoint officers and officials."
      - name: executive_agreements
        effects: [deal]
        executor: hull
        summary: "Make executive agreements with other governments, through the State Department."
      - name: lend_lease
        effects: [allocate]
        summary: "Decide how the aid programme is shared out."
    reach: {rank: 5, chain: [usa], heads: true}
  - person: churchill
    allies: [usa, ussr]
    opposes:
      - {against: germany, over: "the war at sea and the bombing of Britain", irreducible: true}
      - {against: italy, over: "Malta, Libya and the Mediterranean"}
      - {against: japan, over: "Japan's threat to Malaya and Singapore"}
    answers:
      - key: home_fleet_to_iceland
        aim: 1
        when: {lever: uboat_directive, params: {posture: [unrestricted_atlantic], theatre: [north_atlantic]}, by: germany}
        gate: [obstructing, hostile]
        act: {lever: move_fleet, params: {force: home_fleet, to: reykjavik}}
        delay_days: 2
        cooldown_days: 30
      - key: appeal_to_america
        aim: 2
        when: {lever: naval_order, params: {order: [hold_in_port]}, by: usa}
        act: {effect: {kind: statement, theme: "an appeal to America"}}
        delay_days: 1
        cooldown_days: 21
      - key: malta_strikes
        aim: 3
        when: {lever: libya_convoys, by: italy}
        gate: [obstructing, hostile]
        act: {effect: {kind: statement, theme: "Malta will strike the Libya convoys"}}
        delay_days: 2
        cooldown_days: 21
      - key: warn_japan_over_malaya
        aim: 3
        when: {lever: requisition_shipping, params: {tonnage_class: [navy]}, by: japan}
        gate: [obstructing, hostile]
        act: {effect: {kind: statement, theme: "a warning to Japan over Malaya"}}
        delay_days: 2
        cooldown_days: 30
