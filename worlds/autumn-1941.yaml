pipelines:
  - key: executive_order
    name: An executive order
    gap: true
    steps:
      - {person: wh_clerk, kind: clerical, days: 1, assumed: true}
      - {person: roosevelt, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend, refuse]}
  # The House floor vote is the `votes` resolver's, at settlement, not a person's step.
  # Step lengths from H.J.Res. 237: message 9 Oct, House 17 Oct (8 days), Senate
  # 7 Nov (21 days, one of them the clerk's), signed 17 Nov (10 days). The 13 Nov concurrence
  # is a floor vote, so it is the votes resolver's, not a step.
  - key: bill_through_congress
    name: A bill through Congress
    source: hjr237_timeline
    steps:
      - {person: rayburn, kind: decision, days: 8, allowed: [pass, expedite, stall, amend, refuse, leak]}
      - {person: house_clerk, kind: clerical, days: 1, assumed: true}
      - {person: barkley, kind: decision, days: 20, allowed: [pass, expedite, stall, amend, refuse, leak]}
      - {person: roosevelt, kind: decision, days: 10, allowed: [pass, refuse]}
  - key: naval_order
    name: A naval order
    gap: true
    steps:
      - {person: stark, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend, refuse]}
      - {person: king, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, refuse]}
  # King's own forms (KCD): through his own staff, with no step above him. The step is his.
  - key: atlantic_fleet_staff
    name: Through the Atlantic Fleet's staff
    gap: true
    steps:
      - {person: king, kind: clerical, days: 1, assumed: true}
  # Tovey's own forms (NUK): through his own staff, with no step above him. The step is his.
  - key: home_fleet_staff
    name: Through the Home Fleet's staff
    gap: true
    steps:
      - {person: tovey, kind: clerical, days: 1, assumed: true}
  # Dönitz's own forms (NGE): through his own staff at Kernevel, with no step above him. The step
  # is his.
  - key: bdu_staff
    name: Through the U-boat command's staff
    gap: true
    steps:
      - {person: doenitz, kind: clerical, days: 1, assumed: true}
  # Yamamoto's own forms (NJP): through the Combined Fleet's staff in his flagship, with no step
  # above him. The step is his.
  - key: combined_fleet_staff
    name: Through the Combined Fleet's staff
    gap: true
    steps:
      - {person: yamamoto, kind: clerical, days: 1, assumed: true}
  # Iachino's own forms (NIT): through the Battle Fleet's staff in his flagship, with no step
  # above him. The step is his.
  - key: battle_fleet_staff
    name: Through the Battle Fleet's staff
    gap: true
    steps:
      - {person: iachino, kind: clerical, days: 1, assumed: true}
  # Timoshenko's own form (NSU): through the Western Front's staff at his headquarters, with no
  # step above him. The step is his. His forms are a move and a concealment of the front (an
  # engagement his domain holds). He has no detach form: a side may keep no army detachment in
  # play (detachments.DETACHMENTS_PER_SIDE), so a split of the front would change nothing.
  - key: western_front_staff
    name: Through the Western Front's staff
    gap: true
    steps:
      - {person: timoshenko, kind: clerical, days: 1, assumed: true}
  # Xue Yue's own form (NCH): through the Ninth War Area's headquarters at Changsha, with no
  # step above him. The step is his. His forms are a move and a concealment of the area (an
  # engagement his domain holds); a side may keep no army detachment in play, so he has no
  # detach form.
  - key: ninth_war_area_hq
    name: Through the Ninth War Area's headquarters
    gap: true
    steps:
      - {person: xue_yue, kind: clerical, days: 1, assumed: true}
  # Ryti's orders to the army (NFI): through the Commander-in-Chief, to whom he handed command.
  - key: through_the_commander_in_chief
    name: Through the Commander-in-Chief
    gap: true
    steps:
      - {person: mannerheim, kind: clerical, days: 1, assumed: true}
  # Mannerheim's own forms (NFI): through his headquarters at Mikkeli, with no step above him.
  - key: finnish_headquarters
    name: Through Headquarters at Mikkeli
    gap: true
    steps:
      - {person: mannerheim, kind: clerical, days: 1, assumed: true}
  - key: cable_to_churchill
    name: A cable to the Prime Minister
    gap: true
    steps:
      - {person: cable_clerk, kind: clerical, days: 1, assumed: true}
