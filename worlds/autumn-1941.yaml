# Invented papers: any match to a real one is accidental.
outlets:
  - key: washington_ledger
    polity: usa
    name: "The Washington Ledger"
    voice: "American broadsheet. Brisk, factual headlines; quotes officials and congressmen; wary of foreign wars but sympathetic to Britain."
  - key: reichsbote
    polity: germany
    name: "Der Reichsbote"
    voice: "Party-line German daily. Triumphant and defiant; blames Germany's enemies; praises the Führer's resolve; never states a setback plainly."
  - key: london_chronicle
    polity: uk
    name: "The London Chronicle"
    voice: "British daily. Measured and resolute; stresses the Empire's endurance and the value of friends abroad."
  - key: rising_sun_courier
    polity: japan
    name: "The Rising Sun Courier"
    voice: "Japanese daily under censorship. Formal; stresses national unity and encirclement by the Western powers."
  - key: gazzetta_impero
    polity: italy
    name: "Gazzetta dell'Impero"
    voice: "Fascist Italian daily. Grandiose, Roman imagery; loyal to the Duce; follows Berlin's line."
  - key: krasnaya_zarya
    polity: ussr
    name: "Krasnaya Zarya"
    voice: "Soviet party daily. Ideological; collective heroism at the front; denounces the fascist aggressor."
  - key: chungking_herald
    polity: china
    name: "The Chungking Herald"
    voice: "Nationalist Chinese daily. Defiant; appeals for Allied aid; reports Japanese outrages."
  # Each seat reads three papers: its home paper; its country's opposition daily
  # (tagged opposition), or where there is none, as in a censored state, the
  # neutral paper (tagged neutral); and the home paper of the first power its
  # card opposes.
  - key: heartland_sentinel
    polity: usa
    name: "The Heartland Sentinel"
    voice: "Midwestern isolationist daily. Distrusts the Administration and foreign entanglements; quotes the America First Committee and the Senate's noninterventionists; warns that aid to Britain leads to war."
  - key: alpine_gazette
    polity: switzerland
    name: "The Alpine Gazette"
    voice: "Neutral Swiss daily. Sober and even-handed; reports each side's claims as claims; says plainly what cannot be confirmed; watches trade, refugees and the Red Cross."

# OFD: what each head's post rests on and how its holder is removed, who may move each
# commander, his ladder and the acts he may do without leave, read with `posts`, `office`
# and `defiance` on. Every line is from Ava's sourcing note (reports/2026-11-21-revisionist-
# third-run-sourcing and its 1941 sheets; the sheet's question is named beside each line).
# A line the note does not give is not written and is marked `# gap: true`: the rule reads
# it as absent (no base, no question on the post, no ladder, no act without leave, and the
# old rule for who moves the holder: an order from one of his principals). No ladder and no
# act without leave is sourced for any commander.
assets:
  # U1, U2: elected by the Electoral College for a fixed term, removed by impeachment or at
  # the term's end, noon on 20 January (Twentieth Amendment; the third term began 20 January
  # 1941). The Electoral College is not in the world: rests_on gap: true. Impeachment (the
  # House, then two thirds of the Senate) is not a way of removal the rule carries: the term
  # is written.
  - key: us_presidency
    kind: office
    name: President of the United States
    tier: 5
    controller: roosevelt
    removed_by: {by: term, ends: 1945-01-20}
  # K1, K2: the confidence of the Commons; by convention he resigns on losing it.
  - key: uk_premiership
    kind: office
    name: Prime Minister of the United Kingdom
    tier: 4
    controller: churchill
    rests_on: [commons]
    removed_by: {by: vote, chamber: commons}
  # S1, S2: the party (formally also the Supreme Soviet, which is not in the world). Formal
  # removal lies with the Supreme Soviet, and no rule is found for the party post:
  # removed_by gap: true.
  - key: soviet_chairmanship
    kind: office
    name: Chairman of the Council of People's Commissars
    tier: 5
    controller: stalin
    rests_on: [party]
  # G1, G2: the party and the armed forces. The 1934 law names no term and no removing
  # body, and no source states a way or that none existed: removed_by gap: true.
  - key: reich_chancellorship
    kind: office
    name: Fuehrer and Reich Chancellor
    tier: 5
    controller: hitler
    rests_on: [party, wehrmacht_command]
  # J1, J2: the Emperor's mandate and the cooperation of the Army and the Navy; the Emperor
  # appoints and dismisses (Meiji Constitution, arts. 10 and 55). Whether the Diet could vote
  # a premier out is a gap.
  - key: japan_premiership
    kind: office
    name: Prime Minister of Japan
    tier: 4
    controller: konoe
    rests_on: [army, navy]
    removed_by: {by: person, person: hirohito}
  - {key: army_ministry, kind: office, name: Army Minister of Japan, tier: 3, controller: tojo}
  # I1, I2: the King and the Fascist Party; the King appoints and revokes (Statuto art. 65;
  # law of 24 December 1925, n. 2263, art. 2).
  - key: italian_premiership
    kind: office
    name: Prime Minister of Italy
    tier: 3
    controller: mussolini
    rests_on: [crown, fascist_party]
    removed_by: {by: person, person: victor_emmanuel}
  # C1, C2: Chiang's standing rests on his four offices, not on a group: rests_on gap: true.
  # Only the appointing bodies are sourced (the Council of State, on designation by the
  # Supreme National Defense Council, which Chiang chaired); no removal procedure is found:
  # removed_by gap: true.
  - {key: chinese_chairmanship, kind: office, name: Chairman of the Military Affairs Commission, tier: 4, controller: chiang}
  # KCD: the ninth playable card's post. The tier is [proposed], as Tojo's and Mussolini's are.
  # U3: the President relieves a fleet commander (Richardson, January 1941).
  # ladder gap: true; without_leave gap: true.
  - key: atlantic_fleet_command
    kind: office
    name: "Commander in Chief, Atlantic Fleet"
    tier: 3
    controller: king
    moved_by: [us_presidency]
  # NUK: the Home Fleet's commander's post. The tier is [proposed], as King's is.
  # K3: in practice the Prime Minister decides a change of command (Wavell to Auchinleck,
  # 5 July 1941). ladder gap: true; without_leave gap: true.
  - key: home_fleet_command
    kind: office
    name: "Commander in Chief, Home Fleet"
    tier: 3
    controller: tovey
    moved_by: [uk_premiership]
  # NGE: the U-boat arm's commander's post. The tier is [proposed], as Tovey's is.
  # G3: Hitler, personally, from 4 February 1938. ladder gap: true; without_leave gap: true
  # (G8: the standing orders of summer 1941 forbid attacking US ships unless attacked).
  - key: uboat_command
    kind: office
    name: Commander of U-boats
    tier: 3
    controller: doenitz
    moved_by: [reich_chancellorship]
  # NJP: the Combined Fleet's commander's post. The tier is [proposed], as Tovey's is.
  # J3: in law the Emperor, who holds no post in the world; who arranged a relief in
  # practice is a gap: moved_by gap: true; ladder gap: true; without_leave gap: true.
  - {key: combined_fleet_command, kind: office, name: "Commander in Chief, Combined Fleet", tier: 3, controller: yamamoto}
  # NIT: the Italian Battle Fleet's commander's post. The tier is [proposed], as Tovey's is.
  # I3: in practice Mussolini (he removed Badoglio and appointed Cavallero); the formal
  # instrument for a fleet commander is a gap. ladder gap: true; without_leave gap: true.
  - key: battle_fleet_command
    kind: office
    name: "Commander in Chief, Battle Fleet"
    tier: 3
    controller: iachino
    moved_by: [italian_premiership]
  # NSU: the Western Front's commander's post. The tier is [proposed], as Tovey's is.
  # S3, S8: in practice Stalin appointed and replaced front commanders (on paper the
  # Presidium of the Supreme Soviet). ladder gap: true; without_leave gap: true.
  - key: western_front_command
    kind: office
    name: "Commander, Western Front"
    tier: 3
    controller: timoshenko
    moved_by: [soviet_chairmanship]
  # NCH: the Ninth War Area's commander's post. The tier is [proposed], as Tovey's is.
  # C3: no rule for appointing or relieving a war area commander is found: moved_by
  # gap: true; ladder gap: true; without_leave gap: true.
  - {key: ninth_war_area_command, kind: office, name: "Commander, Ninth War Area", tier: 3, controller: xue_yue}
  # NFI: the President's office. The tier is [proposed], as Mussolini's is.
  # F1, F2: chosen by a college of 300 electors, governing with a cabinet that has
  # Parliament's confidence, neither in the world: rests_on gap: true. Removed at the end of
  # Kallio's term or by impeachment on a three-fourths vote; the note gives no day the term
  # ends, and Finland has no chamber in the world: removed_by gap: true.
  - {key: finnish_presidency, kind: office, name: President of the Republic of Finland, tier: 3, controller: ryti}
  # NFI: the Commander-in-Chief's post. The tier is [proposed], as Tovey's is.
  # F3: who could relieve the Commander-in-Chief once the command was transferred is a gap:
  # moved_by gap: true; ladder gap: true; without_leave gap: true.
  - {key: finnish_supreme_command, kind: office, name: "Commander-in-Chief of the Finnish Armed Forces", tier: 3, controller: mannerheim}

