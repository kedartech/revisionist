  - {key: hansard_1939_09_03, title: "House of Commons debates, 3 September 1939: the Prime Minister's statement that Britain is at war with Germany", note: "Named citation; the lane had no network and read no edition or column. Confirm the locator before release."}
  - {key: dgfp_d_xii, title: "Documents on German Foreign Policy, Series D, vol. XII: Germany's note to the Soviet Union of 22 June 1941", note: "Named citation; the lane had no network and read no document number. Confirm the locator before release."}
  - {key: frus_japan_1931_1941, title: "Foreign Relations of the United States, Japan 1931-1941, vol. I: the Marco Polo Bridge incident, 7 July 1937", note: "Named citation for the start of the undeclared war; the lane had no network and read no page. Confirm before release."}
  - {key: kennedy_1987, title: "Paul Kennedy, The Rise and Fall of the Great Powers (Random House, 1987), table 32: Relative War Potential of the Powers in 1937, p. 332", note: "Locator and figures (US 41.7, Germany 14.4, USSR 14.0, UK 10.2, France 4.2, Japan 3.5, Italy 2.5) seen only in search results quoting the table, not in the book. A 1937 measure, after Hillmann."}
  - {key: harrison_1998, title: "Mark Harrison (ed.), The Economics of World War II: Six Great Powers in International Comparison (Cambridge, 1998), the GDP and munitions tables", note: "The alternative 1941 measure (GDP or munitions output in 1941). Named citation; not read. Confirm the table before use."}
  - {key: lon_yearbook_1941, title: "League of Nations, Statistical Year-Book of the League of Nations 1940/41 (Geneva, 1941): area and population tables", note: "Named citation; not read. Confirm the table and the year of each estimate before release."}
  - {key: census_ussr_1939, title: "All-Union Census of 17 January 1939: population by oblast and republic", note: "Named citation; not read. Confirm the published tables before release."}
  - {key: census_us_1940, title: "Sixteenth Census of the United States, 1940: Population, vol. I, number of inhabitants by state", note: "Named citation; not read. Confirm the table before release."}
  - {key: minerals_yearbook, title: "U.S. Bureau of Mines, Minerals Yearbook 1942 (review of 1941): petroleum, world production by country", note: "Named citation; not read. Confirm the table and the 1941 figures before release."}
  - {key: frus_1941_iv, title: "Foreign Relations of the United States, 1941, vol. IV, The Far East: the freezing of Japanese assets, 26 July 1941", note: "Named citation; not read. Confirm the document before release."}
  - {key: pha_1946, title: "Investigation of the Pearl Harbor Attack: Report of the Joint Committee, 79th Congress (1946): the distribution of MAGIC, carried by hand by Lt Cdr Alwin D. Kramer", note: "Named citation; the lane had no network and read no page. Confirm the locator before release."}
  - {key: hinsley_1979, title: "F. H. Hinsley et al., British Intelligence in the Second World War, vol. I (HMSO, 1979)", note: "For naval Enigma read from mid-1941, and the Chief of SIS, Sir Stewart Menzies, sending Bletchley's decrypts to the Prime Minister. Named citation; not read. Confirm the chapters before release."}
  - {key: action_this_day, title: "Churchill's minute to Ismay of 22 October 1941, 'Action this day', on the Bletchley Park codebreakers' letter of 21 October asking for staff", note: "Named citation; not read. Printed in Hinsley vol. II, appendix 3, as the lane recalls; confirm before release."}
  - {key: prange_1981, title: "Gordon W. Prange, At Dawn We Slept (McGraw-Hill, 1981): Yoshikawa's reports from the Honolulu consulate, and the strike force's gathering at Hitokappu Bay under radio silence", note: "Named citation; not read. Confirm the chapters before release."}
  - {key: deakin_storry_1966, title: "F. W. Deakin and G. R. Storry, The Case of Richard Sorge (Chatto and Windus, 1966): Sorge's radio reports to Red Army intelligence until his arrest on 18 October 1941", note: "Named citation; not read. Confirm the date and pages before release."}
  - {key: wakeman_2003, title: "Frederic Wakeman Jr., Spymaster: Dai Li and the Chinese Secret Service (University of California Press, 2003)", note: "For Dai Li's Military Statistics Bureau running agents in occupied China and reporting to Chiang. Named citation; not read. Confirm before release."}
  - {key: glantz_house_1995, title: "David M. Glantz and Jonathan M. House, When Titans Clashed (University Press of Kansas, 1995): the fall of Kiev on 19 September and of Kalinin on 14 October 1941", note: "Named citation; not read. Confirm the pages before release."}
  - {key: national_service_1941, title: "National Service (No. 2) Act 1941: men liable to the age of 51, unmarried women from 20 to 30", note: "Announced to the Commons by the Prime Minister on 2 December 1941; Royal Assent 18 December 1941. Named citation; the lane had no network and read no edition or division list. Confirm the dates and the divisions before release."}
  - {key: tovey_1941, title: "Admiral Sir John Tovey, Commander in Chief, Home Fleet, from December 1940 to May 1943, at Scapa Flow", note: "Named citation; not read. Confirm the dates before release."}
  - {key: doenitz_1941, title: "Karl Dönitz, Befehlshaber der Unterseeboote (Commander of U-boats) from 1939, Vizeadmiral from September 1940, with his headquarters at Kernevel by Lorient from November 1940", note: "Named citation; the lane had no network and read no edition. Confirm the rank and dates before release."}
  - {key: yamamoto_1941, title: "Admiral Isoroku Yamamoto, Commander in Chief of the Combined Fleet from August 1939, with his flagship in the Inland Sea by Kure", note: "Named citation; the lane had no network and read no edition. Confirm the rank and dates before release."}
  - {key: iachino_1941, title: "Admiral Angelo Iachino, Commander in Chief of the Italian Battle Fleet (the Squadra Navale) from December 1940 to April 1943, with the fleet based at Taranto", note: "Named citation; the lane had no network and read no edition. Confirm the rank and dates before release."}
  - {key: bragadin_1957, title: "Marc'Antonio Bragadin, The Italian Navy in World War II (United States Naval Institute, 1957): the battle fleet's sorties ordered from Rome through Supermarina", note: "Mussolini held the Ministry of the Navy; the sorties were held back for want of fuel and air cover. Named citation; not read. Confirm the chain of orders and the restrictions before release."}
  - {key: timoshenko_1941, title: "Marshal Semyon Timoshenko, commanding the Soviet Western Front (and the Western Direction) from July to 12 September 1941", note: "Konev took the front on 12 September and Zhukov on 10 October. Named citation; the lane had no network and read no edition. Confirm the dates of each change of command before release."}
  - {key: xue_yue_1941, title: "General Xue Yue, commanding the Chinese Ninth War Area (Hunan, Kiangsi and Hupeh south of the Yangtze) from 1939, with his headquarters at Changsha", note: "He held Changsha against the Japanese Eleventh Army in September 1939, September and October 1941, and December 1941 to January 1942. Named citation; the lane had no network and read no edition. Confirm the post and its dates before release."}
  - {key: finland_constitution_1919, title: "The Form of Government of Finland, 1919: a President chosen by a college of 300 electors, commanding the armed forces, who may hand that command to another", note: "Read through the sourcing sheet of 21 Nov (USSR and Finland). Risto Ryti President from 19 December 1940; supreme command transferred to Mannerheim (Article 30). Who could relieve him, and how: not found, gap."}
  - {key: mannerheim_foundation, title: "The Mannerheim Foundation (mannerheim.fi): Marshal C. G. E. Mannerheim, Commander-in-Chief of the Finnish forces from 30 November 1939", note: "Read through the sourcing sheet of 21 Nov. Says he was applauded for not leading the army against Leningrad and for not cutting the Murmansk railway, which the US Army history contradicts: both readings kept."}
  - {key: ziemke_1959, title: "Earl F. Ziemke, The German Northern Theater of Operations, 1940-1945 (DA Pamphlet 20-271, 1959)", note: "Read (archive.org text) through the sourcing sheet of 21 Nov. At war from the night of 25 June 1941; the offensive from 10 July; the old border on the Isthmus by 2 September; on 1 September Mannerheim had Ryti's leave to cross it only as far as Sestroretsk-Agalatovo."}
  - {key: loc_finland_country_study, title: "Library of Congress, Finland: A Country Study (1988): the Continuation War", note: "Read through the sourcing sheet of 21 Nov. Gives 26 June 1941 for the declaration of war, where the US Army history gives the night of 25 June: both readings kept (amendment 9)."}
  - {key: van_de_ven_2003, title: "Hans van de Ven, War and Nationalism in China, 1925-1945 (RoutledgeCurzon, 2003): Chiang's orders to the war areas through the Military Affairs Commission", note: "Chiang directed the war area commanders himself, often over the head of the General Staff. Named citation; not read. Confirm that giving up a provincial capital waited on Chiang's word before release."}
  - {key: erickson_1975, title: "John Erickson, The Road to Stalingrad (Harper and Row, 1975): Stalin's orders to the fronts through the Stavka and the General Staff", note: "Stalin refused or delayed leave to withdraw through 1941. Named citation; not read. Confirm that a front's withdrawal waited on Stalin's word before release."}
  - {key: liaison_conference_1941, title: "The Liaison Conference of 1941: the Prime Minister, the Foreign, Army and Navy Ministers and the two Chiefs of Staff, deciding by consensus", note: "Named citation; not read. Confirm the membership and the rule of consensus before release."}
  - {key: fuehrer_naval_17_sep_1941, title: "Fuehrer Conferences on Naval Affairs, 17 September 1941: Hitler orders the U-boats to avoid incidents with American ships", note: "Raeder asked leave to attack American escorts; Hitler refused until the campaign in the East is decided. Named citation; not read. Confirm the date and the wording before release."}
  - {key: neutrality_act_1939, title: "Neutrality Act of 4 November 1939 (54 Stat. 4), section 3, Combat Areas; with Proclamation 2376 of the same day defining the combat area", note: "Read (presidency.ucsb.edu, Proclamation 2376, which quotes section 3). Section 3(a): once the President defines combat areas it is unlawful for any citizen of the United States or any American vessel to proceed into or through them. The area: the waters round the British Isles out to 20 W, from the north coast of Spain to Norway."}
  - {key: fdr_1941_09_11, title: "Roosevelt's fireside chat of 11 September 1941 on the Greer: the Navy's patrols of the Atlantic and the order to shoot on sight", note: "Named citation; not read. Confirm the text before release."}
  - {key: lane_choice, title: "The lane's own choice: no published measure", note: "Hubs and prestige ranks chosen by the lane for play; kept as gaps for Josh to mark."}
  - {key: tripartite_1940, title: "Tripartite Pact between Germany, Italy and Japan, Berlin, 27 September 1940: Article 3, the parties' assistance when one is attacked by a power not then in the war", note: "Named citation; the lane had no network and read no edition. Confirm the text before release."}
  - {key: anglo_soviet_1941, title: "Agreement for joint action between the United Kingdom and the Soviet Union in the war against Germany, Moscow, 12 July 1941", note: "Named citation; not read. The clause kept is no armistice or separate peace except by mutual consent. Confirm the text and its treaty series number before release."}
  - {key: soviet_japanese_1941, title: "Soviet-Japanese Neutrality Pact, Moscow, 13 April 1941: Article 2, neutrality if either is the object of hostilities by a third power", note: "Named citation; not read. Confirm the text before release."}
  - {key: moscow_conference_1941, title: "The Moscow Conference of 29 September to 1 October 1941 (Beaverbrook and Harriman with Stalin and Molotov): the supply protocol", note: "Named citation (FRUS 1941, vol. I); not read. The mission left London on 22 September and reached Moscow on 28 September. Confirm the dates and the protocol before release."}
  - {key: anti_comintern_1941, title: "Protocol prolonging the Anti-Comintern Pact for five years, Berlin, 25 November 1941, with the adhering states' signatures", note: "Named citation (Documents on German Foreign Policy, Series D, vol. XIII); not read. Confirm the date, the signatories and the term before release."}
  - {key: kurusu_arrival, title: "Special Ambassador Saburo Kurusu's journey from Tokyo on 5 November to Washington on 15 November 1941", note: "Named citation (FRUS: Japan, 1931-1941, vol. II); not read. Confirm the dates before release."}

