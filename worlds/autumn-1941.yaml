  # real one, so the leg starts on 16 September [proposed] to bring it to Moscow on the record's day.
  # source: moscow_conference_1941
  - {key: moscow_mission, kind: piece, piece: envoy, name: The Anglo-American mission to Moscow, side: uk, tier: 1, places: [london], legs: [{since: 1941-09-16, places: [moscow]}], gap: true}
  # source: kurusu_arrival
  - {key: kurusu_mission, kind: piece, piece: envoy, name: Kurusu's special mission to Washington, side: japan, tier: 1, places: [tokyo], legs: [{since: 1941-11-05, places: [washington]}], gap: true}

