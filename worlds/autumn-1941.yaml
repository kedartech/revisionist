# Contests (CON): what moves each, every step and line [proposed] (values sheet); a step left out
# takes its kind's default. Each is decided countdown_days after the start date.
contests:
  - key: neutrality_revision
    kind: rivalry
    name: Revising the Neutrality Act
    prize: Whether Congress repeals the 1939 Act's bans on arming merchant ships and on war zones.
    sides: [interventionists, noninterventionists]
    countdown_days: 73
    moves:
      - {kind: flag, toward: interventionists, quantity: neutrality_revision_passed}
      - {kind: flag, toward: interventionists, quantity: arm_merchant_ships_passed}
      - {kind: line, toward: noninterventionists, quantity: neutrality_revision_house_nays, line: 218, step: 25}
      - {kind: line, toward: noninterventionists, quantity: neutrality_revision_senate_nays, line: 49, step: 25}
  - key: us_japan_talks
    kind: rivalry
    name: The US-Japan negotiations
    prize: Whether talks end in a modus vivendi or in war in the Pacific.
    sides: [usa, japan, china]
    countdown_days: 97
    moves:
      - {kind: line, toward: usa, nation: japan, line: 80, falling: true}
      - {kind: battle, toward: usa, region: pacific}
      - {kind: battle, toward: japan, region: pacific}
      - {kind: battle, toward: china, region: pacific}
      - {kind: holder, toward: japan, territory: philippines}
      - {kind: holder, toward: japan, territory: malaya}
      - {kind: holder, toward: japan, territory: dutch_east_indies}
      - {kind: holder, toward: japan, territory: hunan}
      - {kind: holder, toward: china, territory: wuhan_area}
      - {kind: agreement_made, toward: japan, between: [japan, usa]}
  - key: atlantic_war
    kind: rivalry
    name: The war against Germany
    prize: Whether Britain's sea supply holds, the Soviet front survives, and America is drawn in.
    sides: [uk, germany, ussr, italy]
    countdown_days: 97
    moves:
      - {kind: battle, toward: uk, region: atlantic}
      - {kind: battle, toward: uk, region: mediterranean}
      - {kind: battle, toward: germany, region: atlantic}
      - {kind: battle, toward: germany, region: eastern_front}
      - {kind: battle, toward: ussr, region: eastern_front}
      - {kind: holder, toward: germany, territory: leningrad_area}
      - {kind: holder, toward: germany, territory: moscow_area}
      - {kind: holder, toward: germany, territory: egypt}
      - {kind: holder, toward: italy, territory: egypt}
      - {kind: line, toward: germany, nation: uk, line: 30, falling: true}
      - {kind: line, toward: germany, nation: ussr, line: 35, falling: true}
      - {kind: agreement_made, toward: uk, between: [uk, usa]}
      - {kind: agreement_broken, toward: germany, between: [uk, ussr]}

# Production keys (PRL): what the production rules read instead of names of their own. The
# finding is Roosevelt's Lend-Lease form: it draws on the second appropriation, writes each
# recipient's share, and a finding naming the Soviet Union makes it eligible. The priority is
# the production-priority form; merchant ships grow a nation's lift pool on each 1st (Britain's
# and Japan's are named on their entities; a nation with no lift_pool grows none). The values are
# the rules' own before PRL.
production:
  findings:
    - form: lend_lease_finding
      draws_on: lend_lease_second_appropriation
      shares: {uk: lend_lease_share_uk, ussr: lend_lease_share_ussr, china: lend_lease_share_china}
      eligible: {ussr: soviet_lend_lease_eligible}
  priority: {form: production_priority, grows_lift_on: merchant_ships}

# Laws (LWD): the four American bills the season's votes are taken on, read with the laws rule on.
# Each key is the key the blocs' rows under `groups` and the send-bill form carry, and each passed
# flag is the one the blocs' tally writes. Titles and clauses are the votes rule's own [proposed]
# (its clause on Lend-Lease money is the March act's 7,000,000,000; the October appropriation was
# 5,985,000,000, `lend_lease_second_appropriation`). What each does is [proposed], from the two
# effects the rules know: a law whose clause arms merchant ships arms them, and the draft adds 3 to
# the manpower pool, the effects the shipping and economy rules give the clauses' words with the
# rule off.
laws:
  - key: neutrality_revision  # source: hjr237_timeline (the Senate's text, House concurrence 13 Nov, signed 17 Nov)
    title: Neutrality Act revision
    nation: usa
    clauses:
      - {kind: power, subject: arm merchant ships}
      - {kind: limit, subject: war zones closed to American ships}  # source: neutrality_act_1939, section 3
    passed: neutrality_revision_passed
    does: {kind: arms_merchant_ships}
    daily_life: false  # [proposed]
  - key: draft_extension  # source: voteview (the House's 203 to 202 of 12 Aug, `draft_extension_yeas`)
    title: Selective Service extension
    nation: usa
    clauses:
      - {kind: power, subject: hold draftees beyond twelve months}
    passed: draft_extension_passed
    does: {kind: adds_manpower, amount: 3}  # gap: true, [proposed] (plan, SHP Defaults)
    daily_life: true  # [proposed]: holds the draftees in the army beyond their year
  - key: lend_lease_appropriation  # source: lend_lease_appropriations
    title: Lend-Lease appropriation
    nation: usa
    clauses:
      - {kind: money, subject: lend-lease supplies, amount: 7000000000}  # gap: true, [proposed]
    passed: lend_lease_appropriation_passed
    daily_life: false  # [proposed]
  - key: arm_merchant_ships  # source: hjr237_timeline (the House's bill of 17 Oct: section 6 repealed)
    title: Arming of merchant ships
    nation: usa
    clauses:
      - {kind: power, subject: arm merchant ships}
    passed: arm_merchant_ships_passed
    does: {kind: arms_merchant_ships}
    daily_life: false  # [proposed]
  # NUK: the National Service bill, which the Commons passed in December 1941. Its clause and what
  # it does are [proposed]: it adds 3 to Britain's manpower, as the draft does for the United States.
  - key: national_service  # source: national_service_1941
    title: National Service bill
    nation: uk
    clauses:
      - {kind: power, subject: call up unmarried women and men to fifty-one}
    passed: national_service_passed
    does: {kind: adds_manpower, amount: 3}  # gap: true, [proposed]
    daily_life: true  # [proposed]

# Locks (KCD): which of King's orders need whose decision, and while what holds.
locks:
  # Shoot on sight on the Iceland route: the posture is the President's, so the order is held
  # until he has set shoot on sight there by his own naval order. gap: true, [proposed].
  - key: iceland_shoot_on_sight
    order: {form: fleet_naval_order, params: {order: shoot_on_sight, zone: iceland_route}}
    when: {check: posture_not_set, form: naval_order, where: {zone: iceland_route}, posture: {order: shoot_on_sight}}
    decider: {person: roosevelt}
  # Escort beyond Iceland into the war zone: held while the Neutrality revision is not in force,
  # and Congress decides. The Act's reach (neutrality_act_1939, section 3): once the President
  # defined combat areas it was unlawful for any American citizen or American vessel to proceed
  # into or through them. It names citizens and American vessels, not the Navy; that escort
  # therefore ends at Iceland until the revision passes is the game's reading. gap: true, [proposed].
  - key: war_zone_escort
    order: {form: fleet_naval_order, params: {order: escort_convoys, zone: war_zone}}
    when: {check: law_not_in_force, clause: "war zones closed to American ships"}
    decider: {nation: usa, chambers: [house, senate], head: roosevelt}
  # NUK. Lending the Home Fleet's strength to the Western Approaches, at Liverpool: the balance
  # between home waters and the Atlantic is the Prime Minister's, so the order is held until he
  # has made the Atlantic the first priority for the HX convoys. gap: true, [proposed].
  - key: home_fleet_to_the_atlantic
    order: {form: home_fleet_detach, params: {to: liverpool}}
    when: {check: posture_not_set, form: convoy_orders, where: {route: hx_route}, posture: {priority: atlantic}}
    decider: {person: churchill}
  # NUK. Basing the Home Fleet at Iceland for the season: held while the National Service bill is
  # not law, and the Commons decides, with the Prime Minister answering for it. No Act of Parliament
  # held a Home Fleet order in 1941; that this one waits on the men the bill calls up is the game's
  # reading. gap: true, [proposed].
  - key: home_fleet_based_at_iceland
    order: {form: home_fleet_move, params: {to: reykjavik}}
    when: {check: law_not_in_force, clause: call up unmarried women and men to fifty-one}
    decider: {nation: uk, chambers: [commons], head: churchill}
  # NGE. Attacking American ships in the western Atlantic: the U-boats sent off Argentia, where
  # the American escorts took over the HX convoys, or a detachment sent there, are held until
  # Hitler has set the U-boats' posture in the North Atlantic to attack American ships, and Hitler
  # decides alone: Germany has no body or council that answers for it. His order of 17 September
  # held the boats from American ships. source: fuehrer_naval_17_sep_1941; gap: true, [proposed].
  - key: uboats_against_american_ships
    order: {form: uboat_move, params: {to: argentia}}
    when: {check: posture_not_set, form: uboat_directive, where: {theatre: north_atlantic}, posture: {posture: attack_us_shipping}}
    decider: {person: hitler}
  - key: uboat_detachment_against_american_ships
    order: {form: uboat_detach, params: {to: argentia}}
    when: {check: posture_not_set, form: uboat_directive, where: {theatre: north_atlantic}, posture: {posture: attack_us_shipping}}
    decider: {person: hitler}
  # NJP. Opening hostilities against the United States: the Combined Fleet sent against Pearl
  # Harbor, or part of it, is a question of war for the Liaison Conference, a council of the
  # cards that sat on it (the Prime Minister, the War Minister and the two Chiefs of Staff; the
  # Foreign and Navy Ministers have no card), all of whom must agree, as the conference decided
  # by consensus. The Prime Minister is the head an ask goes to. No condition: only the
  # conference's grant opens it. source: liaison_conference_1941; members and count [proposed],
  # gap: true.
  - key: pearl_harbor_strike
    question: war
    order: {form: combined_fleet_move, params: {to: pearl_harbor_base}}
    decider: {council: {members: [konoe, tojo, sugiyama, nagano], needed: 4, head: konoe}}
  - key: pearl_harbor_detachment
    question: war
    order: {form: combined_fleet_detach, params: {to: pearl_harbor_base}}
    decider: {council: {members: [konoe, tojo, sugiyama, nagano], needed: 4, head: konoe}}
  # NJP. Gathering the fleet, or part of it, at Hitokappu Bay, where the strike force assembled
  # in November, waits on the permission of the Chief of the Navy General Staff, whose staff
  # ordered the fleet's operations. source: prange_1981; gap: true, [proposed].
  - key: hitokappu_bay_gathering
    question: permission
    order: {form: combined_fleet_move, params: {to: hitokappu_bay}}
    decider: {person: nagano}
  - key: hitokappu_bay_detachment
    question: permission
    order: {form: combined_fleet_detach, params: {to: hitokappu_bay}}
    decider: {person: nagano}
  # NIT. A sortie of the battle fleet east of the Sicilian narrows: the fleet sent to Bardia on
  # the eastern Mediterranean, or part of it, where it would meet the Mediterranean Fleet from
  # Alexandria, waits on Mussolini's permission. He held the Ministry of the Navy, and the
  # fleet's sorties were ordered from Rome. No condition: only his grant opens it. Italy has no
  # body or council that decides. source: bragadin_1957; the place, gap: true, [proposed].
  - key: battle_fleet_sortie_east
    question: permission
    order: {form: battle_fleet_move, params: {to: bardia}}
    decider: {person: mussolini}
  - key: battle_fleet_detachment_east
    question: permission
    order: {form: battle_fleet_detach, params: {to: bardia}}
    decider: {person: mussolini}
  # NSU. A withdrawal of the Western Front behind the Mozhaisk line: the front sent back to
  # Moscow waits on Stalin's permission. Through 1941 he held the fronts to their
  # lines and gave leave to fall back late or not at all. No condition: only his grant opens it.
  # The Soviet Union has no body or council that decides. source: erickson_1975; the line, gap:
  # true, [proposed].
  - key: western_front_withdrawal
    question: permission
    order: {form: western_front_move, params: {to: moscow}}
    decider: {person: stalin}
  # NCH. Giving up Changsha without a fight: the Ninth War Area sent back to Chungking waits on
  # Chiang's permission. He directed the war areas himself through the Military Affairs
  # Commission, and Changsha was the city he meant the area to hold. No condition: only his
  # grant opens it. China has no body or council that decides. source: van_de_ven_2003; the
  # place, gap: true, [proposed].
  - key: changsha_given_up
    question: permission
    order: {form: ninth_war_area_move, params: {to: chungking}}
    decider: {person: chiang}
  # NFI. Crossing the 1939 border: the Finnish Army sent on to Leningrad waits on Ryti's
  # permission. Mannerheim took command on condition he never lead an offensive against
  # Leningrad, and on 1 September 1941 had Ryti's leave to cross the old border on the Isthmus
  # only as far as Sestroretsk-Agalatovo. No condition: only his grant opens it. Parliament does
  # not decide it. source: ziemke_1959; the place, gap: true, [proposed].
  - key: finnish_army_beyond_the_border
    question: permission
    order: {form: finnish_army_move, params: {to: leningrad}}
    decider: {person: ryti}
  # Peace (PED): who allows each nation with a seat to accept an armistice or an end to a war.
  # A row of the kind peace holds no order and has no condition. No sheet sources who may make
  # peace for any of the eight, so every row is gap: true, [proposed]; each comment names the
  # record the row is drawn from, to be read before release.
  # The President, who negotiates and signs. A treaty of peace also needs two thirds of the
  # Senate present (Constitution, Art. II s.2), which no peace row carries. gap: true, [proposed].
  - key: usa_peace
    question: peace
    decider: {person: roosevelt}
  # The Prime Minister: peace is made under the Crown's prerogative on ministers' advice, and the
  # War Cabinet sat under him. gap: true, [proposed].
  - key: uk_peace
    question: peace
    decider: {person: churchill}
  # Stalin. Formally the Presidium of the Supreme Soviet ratifies treaties (1936 Constitution,
  # Art. 49), which is not in the world. gap: true, [proposed].
  - key: ussr_peace
    question: peace
    decider: {person: stalin}
  # Hitler, as head of state and of government; the Reichstag was not asked. gap: true,
  # [proposed].
  - key: germany_peace
    question: peace
    decider: {person: hitler}
  # The Emperor, who makes peace and concludes treaties (Meiji Constitution, Art. 13), on the
  # advice of the cabinet and the Imperial Conference. gap: true, [proposed].
  - key: japan_peace
    question: peace
    decider: {person: hirohito}
  # The King, who makes treaties of peace (Statuto, Art. 5), not the Duce. gap: true,
  # [proposed].
  - key: italy_peace
    question: peace
    decider: {person: victor_emmanuel}
  # Chiang, as Chairman of the Military Affairs Commission; China has no body that decides it.
  # gap: true, [proposed].
  - key: china_peace
    question: peace
    decider: {person: chiang}
  # The President, who decides on peace with the consent of Parliament (1919 Form of Government,
  # s.33); Parliament is not in the world. gap: true, [proposed].
  - key: finland_peace
    question: peace
    decider: {person: ryti}

# Pacts in force on 1 September 1941 (PCW). The clause chosen for each is [proposed]: the rules judge
# what they can, and wording they cannot express is kept and marked unchecked.
pacts:
  - key: tripartite_pact
    name: The Tripartite Pact
    parties: [japan, germany, italy]
    public: true
    wording: Each party will assist the others with all political, economic and military means when one is attacked by a power not now in the war.
    source: tripartite_1940
    clauses:
      - {type: defend, binds: japan, nation: germany, days: 7}
      - {type: defend, binds: japan, nation: italy, days: 7}
      - {type: defend, binds: germany, nation: japan, days: 7}
      - {type: defend, binds: germany, nation: italy, days: 7}
      - {type: defend, binds: italy, nation: japan, days: 7}
      - {type: defend, binds: italy, nation: germany, days: 7}
  - key: anglo_soviet_agreement
    name: The Anglo-Soviet agreement of 12 July 1941
    parties: [uk, ussr]
    public: true
    wording: Neither government will negotiate or conclude an armistice or treaty of peace with Germany except by mutual agreement.
    source: anglo_soviet_1941
    # Each party is barred a separate peace with Germany (PED): the clause rests on the pact's
    # named citation, which no lane has read. gap: true, [proposed].
    clauses:
      - {type: no_separate_peace, binds: uk, nation: germany}
      - {type: no_separate_peace, binds: ussr, nation: germany}
  - key: soviet_japanese_neutrality
    name: The Soviet-Japanese Neutrality Pact
    parties: [ussr, japan]
    public: true
    wording: Each party will keep peace and friendly relations with the other and respect its territorial integrity.
    source: soviet_japanese_1941
    clauses:
      - {type: no_attack, binds: ussr, nation: japan}
      - {type: no_attack, binds: japan, nation: ussr}

# Conferences (PCW): the sourced last day is the voting day; the call opens CONF_DAYS earlier [proposed].
conferences:
  - key: moscow_supply_conference
    caller: ussr
    invited: [ussr, uk, usa]
    opens: 1941-09-27
    voting_day: 1941-10-01
    public: true
    wording: The three powers settle the arms and raw materials Britain and the United States will supply to the Soviet Union.
    source: moscow_conference_1941
    clauses:
      - {type: unchecked, binds: uk, text: "Supply the Soviet Union with arms and raw materials on the Moscow schedule."}
      - {type: unchecked, binds: usa, text: "Supply the Soviet Union with arms and raw materials on the Moscow schedule."}
  - key: anti_comintern_renewal
    caller: germany
    invited: [germany, japan, italy, hungary, romania_state, finland_state, spain]
    opens: 1941-11-21
    voting_day: 1941-11-25
    public: true
    wording: The Anti-Comintern Pact is prolonged for five years, with new adherents.
    source: anti_comintern_1941
    clauses:
      - {type: unchecked, binds: germany, text: "Prolong the Anti-Comintern Pact for five years."}
      - {type: unchecked, binds: japan, text: "Prolong the Anti-Comintern Pact for five years."}
      - {type: unchecked, binds: italy, text: "Prolong the Anti-Comintern Pact for five years."}

