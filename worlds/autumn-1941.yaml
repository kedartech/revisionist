pipelines:
  - key: executive_order
    name: An executive order
    gap: true
    steps:
      - {person: wh_clerk, kind: clerical, days: 1, assumed: true}
      - {person: roosevelt, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend, refuse]}
  # The House floor vote is the `votes` resolver's, at settlement, not a person's step.
  # Step lengths from H.J.Res. 237: message 9 Oct, House 17 Oct (8 days), Senate
  # 7 Nov (21 days, one of them the clerk's), signed 17 Nov (10 days). The 13 Nov concurrence
  # is a floor vote, so it is the votes resolver's, not a step.
  - key: bill_through_congress
    name: A bill through Congress
    source: hjr237_timeline
    steps:
      - {person: rayburn, kind: decision, days: 8, allowed: [pass, expedite, stall, amend, refuse, leak]}
      - {person: house_clerk, kind: clerical, days: 1, assumed: true}
      - {person: barkley, kind: decision, days: 20, allowed: [pass, expedite, stall, amend, refuse, leak]}
      - {person: roosevelt, kind: decision, days: 10, allowed: [pass, refuse]}
  - key: naval_order
    name: A naval order
    gap: true
    steps:
      - {person: stark, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, amend, refuse]}
      - {person: king, kind: decision, days: 2, assumed: true, allowed: [pass, expedite, stall, refuse]}
