# The House elections of 1862 were held on different days state by state, from September
# to November (mcpherson_1988). One day stands for them: 4 November, [proposed].
elections:
  - {nation: usa, chambers: [house], day: 1862-11-04}

# Places whose loss is felt beyond their yield. The figures are [proposed]. Each
# capital's state weighs most; abandoning a place costs more than losing it in a fight.
places:
  - {territory: maryland, nation: usa, moves: {republicans: -5, unionists: -4}}
  - {territory: kentucky, nation: usa, moves: {republicans: -3, unionists: -3}}
  - {territory: pennsylvania, nation: usa, moves: {republicans: -3, northern_workers: -3}}
  - {territory: virginia, nation: csa, moves: {planters: -5, yeomen: -3}}
  - {territory: tennessee, nation: csa, moves: {planters: -3, yeomen: -3}}

# The war under way on the start date. The United States never declared war on the
# Confederacy, which it held to be in rebellion (mcpherson_1988).
wars:
  - {a: csa, b: usa, since: 1861-04-12, declared: false, source: mcpherson_1988}

# Who decides. Each lock row names a decider who holds a card; the rows themselves are
# [proposed] game rules, not claims about the record.
locks:
  - key: cross_the_potomac
    question: permission
    order: {form: advance, params: {to: washington}}
    decider: {person: davis}
  # The Army of the Potomac advances only once the President has set the eastern posture.
  - key: potomac_advance
    order: {form: march, params: {to: manassas}}
    when: {check: posture_not_set, form: set_campaign, where: {theatre: eastern_theatre}, posture: {order: advance}}
    decider: {person: lincoln}
  # Bragg carries the war into Kentucky only once the draft law is in force; the
  # Confederate Congress decides.
  - key: kentucky_invasion
    order: {form: invade, params: {to: lexington_ky}}
    when: {check: law_not_in_force, clause: extend conscription to men of 35 to 45}
    decider: {nation: csa, chambers: [cs_house, cs_senate], head: davis}
  - key: war_on_britain
    question: war
    order: {form: declare_war, params: {target: uk}}
    decider: {council: {members: [lincoln, seward, stanton, chase, welles], needed: 3, head: lincoln}}

aim_patterns:
  - key: cw_hold_ground
    posts: [head_of_government, military]
    sentence: Hold {place} for {nation}.
    condition: {check: holds_area, area: $place, holder: $nation}
    blanks:
      - {name: place, kind: territory_held}
  - key: cw_take_ground
    posts: [head_of_government, military]
    sentence: Take {place} for {nation}.
    condition: {check: holds_area, area: $place, holder: $nation}
    blanks:
      - {name: place, kind: territory_not_held}
  - key: cw_keep_support
    posts: [head_of_government, military]
    sentence: Keep {group} at {line} or more.
    condition: {check: support_at, nation: $nation, group: $group, op: ge, value: $line}
    blanks:
      - {name: group, kind: own_group}
      - {name: line, values: [55, 65, 75]}
    government: false
  - key: cw_keep_peace
    posts: [head_of_government]
    sentence: Stay at peace with {foe}.
