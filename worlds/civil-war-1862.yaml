# Each side's named law, the contract's default: an emancipation measure for the Union and
# a draft law for the Confederacy, each passed by both chambers. The wording and the
# manpower are [proposed]; neither is the act of the record.
laws:
  - key: us_emancipation_measure
    title: The emancipation measure
    nation: usa
    clauses:
      - {kind: power, subject: free the slaves held in the states in rebellion}
    passed: us_emancipation_measure_passed
  - key: cs_draft_law
    title: The draft law
    nation: csa
    clauses:
      - {kind: power, subject: extend conscription to men of 35 to 45}
    passed: cs_draft_law_passed
    does: {kind: adds_manpower, amount: 2}

# Each nation's intelligence. The channels are [proposed]: a letter is the mail, a courier a
# rider, in person the cabinet room. The telegraph is not a channel the world has yet.
intelligence:
