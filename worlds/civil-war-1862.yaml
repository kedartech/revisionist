  - {key: veracruz, kind: location, name: Veracruz, at: [19.1738, -96.1342], within: mexico, port_on: western_gulf, base: {sides: [french_empire], domains: [sea]}}
  - {key: manassas, kind: location, name: Manassas, at: [38.7509, -77.4753], within: virginia}
  - {key: nashville, kind: location, name: Nashville, at: [36.1627, -86.7816], within: tennessee}
  - {key: chattanooga, kind: location, name: Chattanooga, at: [35.0456, -85.3097], within: tennessee}
  - {key: lexington_ky, kind: location, name: Lexington, at: [38.0406, -84.5037], within: kentucky}

