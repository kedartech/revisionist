# The kinds of piece the world has when this item lands: an army, a fleet and an envoy, as
# the 1941 world has them. Kinds of the Civil War's own (a river flotilla, cavalry, the
# raising places) are KSC's. Days per step are [proposed].
piece_kinds:
  - {key: army, name: Army, domain: land, days_per_step: {plain: 5, forest: 7, marsh: 8, mountain: 10}, detect: 0, conceal: 0}
  - {key: fleet, name: Fleet, domain: sea, days_per_step: {sea: 3, river: 2}, carries: [army], detect: 60, conceal: 0}
  - {key: envoy, name: Envoy, domain: envoy, days_per_step: {plain: 3, forest: 4, marsh: 4, mountain: 5, sea: 4, river: 2}, detect: 0, conceal: 0}

# The forces on the start date, as tiers (1 to 5). Who commanded each and where it stood is
# from the record; every tier is [proposed], so every row is gap: true. The Union forces at
# Corinth and New Orleans stand in ground the one-holder territory gives the Confederacy:
# they are left out and recorded as a finding (occupation inside a territory).
features:
  # The Army of the Potomac, falling back on Washington after Second Manassas (mcpherson_1988).
  - {key: army_of_the_potomac, kind: piece, piece: army, name: The Army of the Potomac, side: usa, tier: 4, places: [washington], gap: true}
  # The Army of the Ohio at Nashville (mcpherson_1988).
  - {key: army_of_the_ohio, kind: piece, piece: army, name: The Army of the Ohio, side: usa, tier: 3, places: [nashville], gap: true}
  - {key: north_atlantic_squadron, kind: piece, piece: fleet, name: The North Atlantic Blockading Squadron, side: usa, tier: 3, places: [fort_monroe], gap: true}
  - {key: south_atlantic_squadron, kind: piece, piece: fleet, name: The South Atlantic Blockading Squadron, side: usa, tier: 3, places: [port_royal], gap: true}
  - {key: east_gulf_squadron, kind: piece, piece: fleet, name: The East Gulf Blockading Squadron, side: usa, tier: 2, places: [key_west], gap: true}
  - {key: west_gulf_squadron, kind: piece, piece: fleet, name: The West Gulf Blockading Squadron, side: usa, tier: 3, places: [new_orleans], gap: true}
  - {key: western_flotilla, kind: piece, piece: fleet, name: The Western Flotilla, side: usa, tier: 2, places: [cairo], gap: true}
  # The Army of Northern Virginia near Manassas after the battle of 28 to 30 August (mcpherson_1988).
  - {key: army_of_northern_virginia, kind: piece, piece: army, name: The Army of Northern Virginia, side: csa, tier: 4, places: [manassas], gap: true}
  # Bragg's army, marched out of Chattanooga on 28 August (mcpherson_1988).
  - {key: army_of_mississippi, kind: piece, piece: army, name: The Army of the Mississippi, side: csa, tier: 3, places: [chattanooga], gap: true}
  # Kirby Smith's Army of Kentucky at Lexington (mcpherson_1988).
  - {key: army_of_kentucky, kind: piece, piece: army, name: The Army of Kentucky, side: csa, tier: 2, places: [lexington_ky], gap: true}
  - {key: james_river_squadron, kind: piece, piece: fleet, name: The James River Squadron, side: csa, tier: 1, places: [richmond], gap: true}
  # Squadrons the record puts on the American coast. The Royal Navy's North America and West
  # Indies station, and the French squadron in the Gulf with the Mexican expedition
  # (jones_2010). Where each stood on the start date and its strength are not sourced.
  - {key: royal_navy_station, kind: piece, piece: fleet, name: The North America and West Indies Station, side: uk, tier: 3, places: [halifax], gap: true}
  - {key: french_gulf_squadron, kind: piece, piece: fleet, name: The French Gulf squadron, side: french_empire, tier: 2, places: [veracruz], gap: true}

# The posts and their holders. A head's post rests on its blocs and its holder leaves at the
# end of his term: Lincoln's on 4 March 1865, Davis's six-year term, begun 22 February 1862,
# on 22 February 1868 (mcpherson_1988). A general's post names the lesser post he falls to
# and who may move him, so the head can relieve a general. The tiers and the lesser posts
# are [proposed].
assets:
  - key: us_presidency
    kind: office
    name: President of the United States
    tier: 3
    controller: lincoln
    rests_on: [republicans, unionists]
    removed_by: {by: term, ends: 1865-03-04}
  - key: cs_presidency
    kind: office
    name: President of the Confederate States
    tier: 3
    controller: davis
    rests_on: [administration_men, planters]
    removed_by: {by: term, ends: 1868-02-22}
  - key: us_general_in_chief
    kind: office
    name: General-in-Chief of the Armies of the United States
    tier: 2
    controller: halleck
    moved_by: [us_presidency]
  - key: us_war_department
    kind: office
    name: Secretary of War of the United States
    tier: 2
    controller: stanton
    moved_by: [us_presidency]
  - key: cs_war_department
    kind: office
    name: Secretary of War of the Confederate States
    tier: 2
    controller: randolph
    moved_by: [cs_presidency]
  - key: potomac_command
    kind: office
    name: Commander of the Army of the Potomac
    tier: 2
    controller: mcclellan
    ladder: [washington_defences]
    moved_by: [us_presidency]
  - key: ohio_command
    kind: office
    name: Commander of the Army of the Ohio
    tier: 2
    controller: buell
    ladder: [nashville_garrison]
    moved_by: [us_presidency]
  - key: northern_virginia_command
    kind: office
    name: Commander of the Army of Northern Virginia
    tier: 2
    controller: lee
    ladder: [richmond_defences]
    moved_by: [cs_presidency]
  - key: mississippi_command
    kind: office
    name: Commander of the Army of the Mississippi
    tier: 2
    controller: bragg
    ladder: [chattanooga_garrison]
    moved_by: [cs_presidency]
  # The lesser posts a relieved general falls to: nobody holds them at the start.
  - {key: washington_defences, kind: office, name: Commander of the Defences of Washington, tier: 1, controller: usa, location: washington}
  - {key: nashville_garrison, kind: office, name: Commander at Nashville, tier: 1, controller: usa, location: nashville}
  - {key: richmond_defences, kind: office, name: Commander of the Defences of Richmond, tier: 1, controller: csa, location: richmond}
  - {key: chattanooga_garrison, kind: office, name: Commander at Chattanooga, tier: 1, controller: csa, location: chattanooga}
