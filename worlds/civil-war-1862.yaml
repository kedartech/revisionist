# The Civil War on 1 September 1862, written from worlds/TEMPLATE.md.
#
# The two nations stand as they stood on the start date: the United States and the
# Confederate States, each holding the states that had kept to it or left it. A state the
# armies of the other side occupied in part (Tennessee, Louisiana, Virginia's west) is held
# by the nation it belonged to that day; a territory has one holder, so occupation inside a
# territory is a finding against the template, not a rule here. Forces raised by the states
# and a nation that broke in two are parked (the item's Unclear line).
#
# Every territory outside the two nations is held by its start-date holder, a nation nobody
# plays, tagged with its standing to the war. A map territory that joins the lands of
# several holders (Central America, the German States, China and the rest) stands with no
# holder: that is a finding too.
#
# Forces are tiers, not counts. Every tier, yield, support figure and seat count is
# [proposed] and the row carries gap: true until a source gives it. A person is named only
# with a source; each person's source sits in the dossier (worlds/dossiers/civil-war-1862.yaml).
# The sources below have not been checked against a copy in this item: verified is false.
world: civil-war-1862
name: The Civil War
ruleset: realism
start: "North America, 1 September 1862"
start_date: 1862-09-01

# The season ends on 15 December 1862 (the item's default). [proposed]
settings: {end_date: 1862-12-15}

# Every rule but the playable rule (its report goes to Josh first), the three a live model
# reads (writing, clause_reader, written_orders), and the three no code reads yet (aide_note,
# peace, post_view): a shipped world names a rule once its reader is built.
rules: [territories, holders, economy, supply, fuel, battles, reports, groups, agreements, conference, contests, aims, aid, command, locks, laws, ask_answers, deciders, own_aim, offers, classes, losses, places, posts, office, elections, defiance]

entities:
  # The two nations nobody can leave out. source: mcpherson_1988
  - {key: usa, kind: polity, name: The United States, tags: [union, standing_at_war], capital: washington}
  - {key: csa, kind: polity, name: The Confederate States, tags: [confederacy, standing_at_war], capital: richmond}
  # Start-date holders of the territories abroad: nations nobody plays, each with its
  # standing to the war. Britain and France proclaimed neutrality in May and June 1861 and
  # recognised the Confederacy as a belligerent, not as a nation (jones_2010). Russia stood
  # friendly to the Union (jones_2010). Mexico was at war with France from April 1862 and
  # took no side in the American war (jones_2010). Denmark, Austria, the Ottoman Empire and
  # Japan took no part: [proposed], gap.
  - {key: uk, kind: polity, name: The United Kingdom, tags: [standing_neutral, belligerent_rights_granted]}
  - {key: french_empire, kind: polity, name: France, tags: [standing_neutral, belligerent_rights_granted]}
  - {key: russia, kind: polity, name: The Russian Empire, tags: [standing_friendly_to_union]}
  - {key: mexican_republic, kind: polity, name: Mexico, tags: [standing_neutral, at_war_with_france]}
  - {key: denmark, kind: polity, name: Denmark, tags: [standing_none]}
  - {key: austrian_empire, kind: polity, name: The Austrian Empire, tags: [standing_none]}
  - {key: ottoman, kind: polity, name: The Ottoman Empire, tags: [standing_none]}
  - {key: japan_shogunate, kind: polity, name: Japan, tags: [standing_none]}

  # People: real ones only, each with a source in the dossier.
  # The United States. Lincoln, Hamlin, Seward, Chase, Stanton and Welles held their posts on
  # the start date (mcpherson_1988). Halleck had been general-in-chief since 23 July 1862
  # (mcpherson_1988). McClellan commanded the Army of the Potomac, Buell the Army of the Ohio
  # (mcpherson_1988). Farragut commanded the West Gulf Blockading Squadron and Du Pont the
  # South Atlantic (ors_navies).
  - {key: lincoln, kind: person, name: Abraham Lincoln, parent: usa}
  - {key: hamlin, kind: person, name: Hannibal Hamlin, parent: usa}
  - {key: seward, kind: person, name: William H. Seward, parent: usa}
  - {key: chase, kind: person, name: Salmon P. Chase, parent: usa}
  - {key: stanton, kind: person, name: Edwin M. Stanton, parent: usa}
  - {key: welles, kind: person, name: Gideon Welles, parent: usa}
  - {key: halleck, kind: person, name: Henry W. Halleck, parent: usa, tags: [chief_of_staff]}
  - {key: mcclellan, kind: person, name: George B. McClellan, parent: usa}
  - {key: buell, kind: person, name: Don Carlos Buell, parent: usa}
  - {key: farragut, kind: person, name: David G. Farragut, parent: usa}
  - {key: du_pont, kind: person, name: Samuel F. Du Pont, parent: usa}
  # The Confederate States. Davis, Stephens, Benjamin (State, from March 1862), Randolph
  # (War, March to November 1862), Mallory and Memminger held their posts on the start date
  # (mcpherson_1988). Lee commanded the Army of Northern Virginia from 1 June 1862, Bragg the
  # army that left Chattanooga for Kentucky on 28 August, Kirby Smith the column that took
  # Lexington, Kentucky, at the start of September (mcpherson_1988).
  - {key: davis, kind: person, name: Jefferson Davis, parent: csa}
  - {key: stephens, kind: person, name: Alexander H. Stephens, parent: csa}
  - {key: benjamin, kind: person, name: Judah P. Benjamin, parent: csa}
  - {key: randolph, kind: person, name: George W. Randolph, parent: csa, tags: [chief_of_staff]}
  - {key: mallory, kind: person, name: Stephen R. Mallory, parent: csa}
  - {key: memminger, kind: person, name: Christopher G. Memminger, parent: csa}
  - {key: lee, kind: person, name: Robert E. Lee, parent: csa}
  - {key: bragg, kind: person, name: Braxton Bragg, parent: csa}
  - {key: kirby_smith, kind: person, name: Edmund Kirby Smith, parent: csa}

  # Places: the two capitals the map names as sites, and the places the forces stand. A
# port on the coarse map is moved inland until it lies inside its territory.
