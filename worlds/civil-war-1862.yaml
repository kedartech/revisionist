# The roster: each head, each war secretary and the general of each main army. [proposed]
roster:
  - {entity: lincoln, pitch: The President who must keep the border states and the powers out of the war., reach: The Union armies and squadrons., composite: false}
  - {entity: davis, pitch: The President who means to carry the war into Maryland and Kentucky., reach: The Confederate armies., composite: false}
  - {entity: stanton, pitch: The Secretary of War who runs the Union's war machine., reach: The War Department., composite: false}
  - {entity: randolph, pitch: The Secretary of War who must find the Confederacy its men., reach: The Confederate War Department., composite: false}
  - {entity: mcclellan, pitch: The general who must stop Lee in Maryland., reach: The Army of the Potomac., composite: false}
  - {entity: buell, pitch: The general who must stop Bragg in Kentucky., reach: The Army of the Ohio., composite: false}
  - {entity: lee, pitch: The general who carries the war across the Potomac., reach: The Army of Northern Virginia., composite: false}
  - {entity: bragg, pitch: The general who carries the war into Kentucky., reach: The Army of the Mississippi., composite: false}
roster_limit: [2, 8]

contests:
  - key: border_states
    kind: rivalry
    name: The border states
    prize: Whether Maryland and Kentucky stay with the Union or go with the Confederacy.
    sides: [usa, csa]
    countdown_days: 105
    moves:
      - {kind: holder, toward: csa, territory: maryland}
      - {kind: holder, toward: csa, territory: kentucky}
      - {kind: holder, toward: usa, territory: tennessee}
      - {kind: battle, toward: usa, region: eastern_theatre}
      - {kind: battle, toward: csa, region: eastern_theatre}
      - {kind: battle, toward: usa, region: western_theatre}
      - {kind: battle, toward: csa, region: western_theatre}
  # Britain and France have no seat at the table; the contest is what can turn them.
  # [proposed]
  - key: recognition
    kind: rivalry
    name: Recognition abroad
    prize: Whether Britain and France recognise the Confederacy as a nation.
    sides: [usa, csa]
    countdown_days: 105
    moves:
      - {kind: agreement_made, toward: csa, between: [csa, uk]}
      - {kind: agreement_made, toward: csa, between: [csa, french_empire]}
      - {kind: battle, toward: csa, region: eastern_theatre}
      - {kind: battle, toward: usa, region: eastern_theatre}
      - {kind: holder, toward: csa, territory: maryland}
      - {kind: flag, toward: usa, quantity: us_emancipation_measure_passed}
  # The war in the East: the two armies between the capitals. [proposed]
  - key: eastern_war
    kind: rivalry
    name: The war in the East
    prize: Whether the war between Washington and Richmond goes the Union's way.
    sides: [usa, csa]
    countdown_days: 105
    moves:
      - {kind: battle, toward: usa, region: eastern_theatre}
      - {kind: battle, toward: csa, region: eastern_theatre}
      - {kind: holder, toward: usa, territory: virginia}
      - {kind: holder, toward: csa, territory: maryland}
      - {kind: holder, toward: csa, territory: pennsylvania}

# History's clock: what followed the start date, each item still happening while its
# condition holds (an act_of holds while nobody plays the person). Dates from
# mcpherson_1988, not checked against a copy in this item; the conditions are [proposed].
