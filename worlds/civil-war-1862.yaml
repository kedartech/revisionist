    name: Lee and McClellan fight at Antietam Creek (17 Sep)
    on_date: 1862-09-17
    condition: {check: act_of, person: lee}
    weight: 3
    headline: Lee's and McClellan's armies fight at Antietam Creek
    subject: lee
    obj: mcclellan
  - key: preliminary_emancipation
    name: Lincoln issues the preliminary emancipation proclamation (22 Sep)
    on_date: 1862-09-22
    condition: {check: act_of, person: lincoln}
    weight: 3
    headline: Lincoln proclaims the rebel states' slaves free
    subject: lincoln
  - key: perryville
    name: Buell and Bragg fight at Perryville (8 Oct)
    on_date: 1862-10-08
    condition: {check: act_of, person: bragg}
    weight: 2
