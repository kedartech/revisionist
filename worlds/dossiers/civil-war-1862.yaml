# Public dossier text for the civil-war-1862 world: read-only, served to every player.
# Each person's source names the key of a source in worlds/civil-war-1862.yaml; the post
# each held on 1 September 1862 is all that is said of them. Portraits stay null until
# their licence is cleared.
world: civil-war-1862
setting:
  situation: September 1862. The Confederate army has just beaten the Union army at Second Manassas,
    and a second Confederate army is marching north into Kentucky. Britain and France are weighing
    whether to recognise the Confederacy.
  sides:
  - The United States, holding the North, the border states and the West
  - The Confederate States, eleven states that left the Union in 1860 and 1861
  facts:
  - Britain and France proclaimed neutrality in 1861 and recognised the Confederacy as a belligerent.
  - The Union Navy blockades the Confederate coast.
  dates:
  - 'on': 1862-08-30
    what: The Second Battle of Manassas ends in a Confederate victory.
  - 'on': 1862-08-28
    what: Bragg's army leaves Chattanooga for Kentucky.
