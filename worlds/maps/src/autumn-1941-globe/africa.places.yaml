# Americas places file's entries copied unchanged, then the region's forty-three new places at the end;
# each place's coordinates are [proposed], the city's centre to two decimals, moved inland by up to
# 7 km where the simplified coast leaves the centre at sea (Lagos, Massawa, Djibouti, Mombasa,
# Lourenco Marques, Beira, Aden, Monrovia). When the world file gains the new places, the staging
# worlds name the world file again and this file goes.
