# The scoped check's staging world for the 1941 map's seventh region (Africa and Arabia):
#   python scripts/map_check.py check --region worlds/maps/src/autumn-1941-globe/africa.world.yaml
# It extends the Americas region's staging world, which extends the Pacific's, the Mediterranean's,
# the Atlantic's, Europe's and the pilot's, so the check reads all seven: the map block here is the
# newest, the territories, sea zones, adjacency and sites in scope are the seven files' lists joined.
# Its blocks are the build's world fragment (worlds/maps/autumn-1941-globe.world.yaml) as built, this
# region's territories and every adjacency pair that names one of them; the region adds no sea zone.
# The sites in scope are the region's 43 new places, entered here and in africa.places.yaml,
# which `places_of` names in place of the world file (the world file is not edited by this item).
# Rebuild the map, then copy the fragment's blocks into the seven staging worlds; the test pins the
# hash.
#
# The islands with no neighbour until the sea zones of the South Atlantic and the Indian Ocean are
# drawn: the Azores and Madeira, Cape Verde (with Portuguese Guinea, so the area has its mainland
# neighbours), the Canaries (with Spanish Sahara) and Madagascar.
