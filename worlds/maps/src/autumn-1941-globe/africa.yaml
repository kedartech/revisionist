# The 1941 map, seventh region: Africa and Arabia. Built by scripts/map_build.py together with the
# earlier regions (see worlds/maps/README.md); the provinces are Natural Earth 1:10m admin-1 codes
# (worlds/maps/SOURCES.md). Every value here is [proposed]: the territory list and names, which
# provinces make each territory, the cut line and every terrain. The list is the regions draft's
# (seventeen core territories at its grain and five small pieces the holders of 1 September 1941 set
# apart: Spanish Sahara with the Canaries, Liberia, Portuguese Guinea with Cape Verde, Spanish Guinea,
# and the Azores with Madeira).
#
# Build it with the earlier regions, naming the recipe files:
#   python scripts/map_build.py build worlds/maps/src/autumn-1941-globe/eastern-front.yaml \
#     worlds/maps/src/autumn-1941-globe/europe.yaml worlds/maps/src/autumn-1941-globe/atlantic.yaml \
#     worlds/maps/src/autumn-1941-globe/mediterranean.yaml worlds/maps/src/autumn-1941-globe/pacific.yaml \
#     worlds/maps/src/autumn-1941-globe/americas.yaml worlds/maps/src/autumn-1941-globe/africa.yaml \
#     --slug autumn-1941-globe
#
# What it claims. Africa south of the Mediterranean region's French North Africa, Libya and Egypt;
# Arabia south of Iraq and the Levant, with Aden, the Gulf sheikhdoms and Oman; the islands of the
# Gulf of Guinea, Cape Verde, the Canaries, the Azores and Madeira; Madagascar with the Comoros,
# Reunion and Mayotte; the Seychelles and Mauritius with British East Africa. The Mediterranean
# region's territories are not touched; each border this region shares with one of them is that
# territory's own line. Saint Helena, Ascension, Tristan da Cunha, Gibraltar, Ceuta, Melilla and the
# French southern islands (Kerguelen, Crozet, Saint-Paul, the Iles Eparses) stay unclaimed: the regions
# draft lists none of them as a territory; they are left for the sea-zone and whole-globe items.
#
# Cut lines. One: the Gondar pocket, cut from Ethiopia's Amhara unit (below). The line between French
# West and French Equatorial Africa (the French State against Free France) is the present Niger-Chad
# line and needs no cut. Yemen's units are split between Arabia and Aden along their own lines, which
# approximate the 1934 Anglo-Yemeni line; Al Bayda' and Al Dali' straddle it, a gap.
#
# One area, several holders. French Equatorial Africa takes French Cameroon and the British
# Cameroons; British West Africa three British colonies and a mandate; Arabia takes the Kingdom of
# Yemen with Saudi Arabia; Aden takes the Aden protectorates, Muscat and Oman, the Trucial States,
# Qatar, Bahrain and Kuwait; British East Africa takes Kenya, Uganda and Tanganyika with the
# Seychelles and Mauritius. Each has one holder in start.yaml, a gap, as the draft gives it.
#
# What is listed and not drawn. Kufra, taken by the Free French on 1 March 1941, lies in the existing
# Cyrenaica (Italy's); Ifni lies in the existing French North Africa (Morocco's Guelmim unit); the
# Spanish zone of Morocco and Tangier lie in French North Africa too. None is changed here.
