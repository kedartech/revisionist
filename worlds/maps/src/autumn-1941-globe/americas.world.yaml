# The scoped check's staging world for the 1941 map's sixth region (the Americas):
#   python scripts/map_check.py check --region worlds/maps/src/autumn-1941-globe/americas.world.yaml
# It extends the Pacific region's staging world, which extends the Mediterranean's, the Atlantic's,
# Europe's and the pilot's, so the check reads all six: the map block here is the newest, the
# territories, sea zones, adjacency and sites in scope are the six files' lists joined. Its blocks are
# the build's world fragment (worlds/maps/autumn-1941-globe.world.yaml) as built, this region's
# territories and every adjacency pair that names one of them; the region adds no sea zone. The sites
# in scope are the region's twenty-four new places, entered here and in americas.places.yaml, which
# `places_of` names in place of the world file (the world file is not edited by this item). Rebuild
# the map, then copy the fragment's blocks into the six staging worlds; the test pins the hash.
#
# Dutch Harbor is at -166.53 as written; the map draws Alaska a whole turn east, near 193.5, and the
# checker reads the place there (worlds/maps/README.md). The Falklands have no neighbour and the
# Lesser Antilles only the Caribbean Sea until the sea zones of the South Atlantic and the eastern
# Caribbean are drawn.
extends: pacific.world.yaml
places_of: americas.places.yaml
map: {coords: lonlat, file: autumn-1941-globe.json, sha256: afcd257ffb932123481e0908773bc33cc5da12305d9493506fe59fcd69e1b9df, box: [-126, -60, 234, 84]}
regions:
  - {key: americas, name: The Americas}
territories:
  - {key: alaska, name: Alaska, region: americas, terrain: mountain, sites: [dutch_harbor]}
  - {key: western_canada, name: Western Canada and the Arctic, region: americas, terrain: forest, sites: [vancouver, winnipeg]}
  - {key: mexico, name: Mexico, region: americas, terrain: mountain, sites: [mexico_city, tampico]}
  - {key: central_america, name: Central America, region: americas, terrain: forest, sites: [guatemala_city, balboa]}
  - {key: colombia_venezuela, name: Colombia and Venezuela, region: americas, terrain: forest, sites: [maracaibo, bogota]}
  - {key: guianas, name: The Guianas, region: americas, terrain: forest, sites: [georgetown, paramaribo]}
  - {key: andes, name: The Andes, region: americas, terrain: mountain, sites: [lima, guayaquil]}
  - {key: brazil_north, name: Northern Brazil, region: americas, terrain: forest, sites: [natal, recife]}
  - {key: brazil_south, name: Southern Brazil, region: americas, terrain: plain, sites: [rio_de_janeiro, santos]}
