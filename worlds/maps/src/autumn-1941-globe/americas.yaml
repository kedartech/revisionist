# The 1941 map, sixth region: the Americas. Built by scripts/map_build.py together with the earlier
# regions (see worlds/maps/README.md); the provinces are Natural Earth 1:10m admin-1 codes
# (worlds/maps/SOURCES.md). Every value here is [proposed]: the territory list and names, which
# provinces make each territory and every terrain. The list is the regions draft's (thirteen
# territories at its grain, split wherever the holder of 1 September 1941 differed).
#
# Build it with the earlier regions, naming the recipe files:
#   python scripts/map_build.py build worlds/maps/src/autumn-1941-globe/eastern-front.yaml \
#     worlds/maps/src/autumn-1941-globe/europe.yaml worlds/maps/src/autumn-1941-globe/atlantic.yaml \
#     worlds/maps/src/autumn-1941-globe/mediterranean.yaml worlds/maps/src/autumn-1941-globe/pacific.yaml \
#     worlds/maps/src/autumn-1941-globe/americas.yaml --slug autumn-1941-globe
#
# What it claims. The western hemisphere's land the Atlantic region left: Alaska, Canada west of
# Ontario with the Arctic islands, Mexico, Central and South America, the Falklands with South
# Georgia, and the Lesser Antilles with Trinidad, the Dutch islands, the Caymans and the Turks and
# Caicos. The Atlantic region's North American and Caribbean territories are not touched; each
# border this region shares with one of them is that territory's own line. Bermuda, Saint Pierre and
# Miquelon, Clipperton, Navassa and the Guantanamo base stay unclaimed: each is a site in a sea zone
# or inside an existing territory, for the sea-zone and whole-globe items.
#
# The seam. The box's west edge, 126 W, runs through British Columbia and the Yukon: the build takes
# each unit's part on both sides, so Western Canada has a part at the map's west edge (the coast at
# Vancouver and the prairies) and one at its east edge (the northern coast and the Yukon), beside
# Alaska, which the map draws a whole turn east as it does Hawaii.
#
# Cut lines. None. At this grain every border of 1 September 1941 in the region is a present-day
# country or admin-1 line: the Peru-Ecuador line then differed from today's, but both sides fall in
# one territory here; Newfoundland's Labrador line is the Atlantic region's.
#
# One area, several holders. Central America (five republics, British Honduras and the Canal Zone),
# Colombia and Venezuela, the Guianas (British, Dutch and Vichy French), the Andes (Ecuador, Peru and
# Bolivia), the River Plate (Argentina, Uruguay and Paraguay) and the Lesser Antilles (mostly
# British; Martinique and Guadeloupe Vichy; Aruba and Curacao Dutch) each have one holder in
# start.yaml, a gap, as the draft gives them.
