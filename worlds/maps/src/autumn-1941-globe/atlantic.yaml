# The 1941 map, third region: the Atlantic, Britain and North America. Built by scripts/map_build.py
# together with the Eastern Front and Europe regions (see worlds/maps/README.md); the provinces are
# Natural Earth 1:10m admin-1 codes (worlds/maps/SOURCES.md). Every value here is [proposed]: the
# territory list and names, which provinces make each territory, every terrain and every sea zone line.
#
# Build it with the earlier regions, naming the recipe files:
#   python scripts/map_build.py build worlds/maps/src/autumn-1941-globe/eastern-front.yaml \
#     worlds/maps/src/autumn-1941-globe/europe.yaml worlds/maps/src/autumn-1941-globe/atlantic.yaml --slug autumn-1941-globe
#
# The box. The map's box reaches west to -126 to take in North America and the Caribbean (the Pacific
# file gives its other edges); the box is the same in every recipe file that gives one (the build
# refuses a disagreement). Land and water in the box that no recipe claims (western Canada, Mexico, the
# Pacific shore, the Faroes, Bermuda and the Lesser Antilles, the Mediterranean and North Africa, the
# open Atlantic outside the zones) are the backdrop until a later region claims them.
#
# Cut lines. None. The land territories are whole countries or lists of states and provinces, and no
# 1941 border here runs through a present-day province: Newfoundland was its own dominion under
# commission of government (not yet part of Canada) and is its own province in the data. Northern
# Ireland (UK) is part of the Scotland and Ulster territory and touches Ireland on land; it is not
# joined to Scotland by land, so the territory has two parts. Where a 1941 holding differs from a
# present-day country (Greenland under Denmark, with American bases from April 1941; Iceland
# occupied by Britain and the United States), the starting holder is a later item's to set.
#
# Neutrals. Ireland is a neutral territory held by a polity with no seat; the build ignores the key.
#
# Sea zones. Eight, drawn for play and not sourced: the English Channel (south of Britain, joining
# the North Sea by the Strait of Dover, a declared crossing, and the Bay of Biscay), the Western
# Approaches (the Irish Sea and the waters west of Britain and Ireland), the Mid-Ocean Gap (the
# air-cover gap of the convoy routes), the Western Atlantic (the American and Canadian coast, with
# the Gulf of St Lawrence), the Labrador Sea, the Denmark Strait, the Arctic Route (from Iceland to
# the North Cape, joining the White Sea at 28 E) and the Caribbean with the Gulf of Mexico. Each port
# names its sea zone in the staging world (`ports`).
#
# Ports in the water. Liverpool (53.4 N, 3.0 W), Argentia (47.3 N, 54.0 W) and Scapa Flow (58.9 N,
# 3.1 W) lie in the water of the data, not on its land: Liverpool and Argentia within 0.002 degrees
# of the coast (a roadstead, as Lorient is), Scapa Flow an inlet of Orkney 0.02 degrees off the
# shore. Each is therefore a place in a sea zone (Western Approaches, Western Atlantic, North
# Sea) beside the territory that holds the port, and no territory's site; the staging world's
# `ports` names the zone and the territory. The world file is not edited by this item; the places
# at 53.41 N, 2.99 W, 47.31 N, 53.98 W and 58.97 N, 3.13 W would lie on land, listed for Josh and
# for the item that edits the world's places.
