# The scoped check's staging world for the 1941 map's ninth region (Australasia and the Pacific
# islands):
#   python scripts/map_check.py check --region worlds/maps/src/autumn-1941-globe/australasia.world.yaml
# It extends the inner Asia region's staging world, which extends the Africa, the Americas', the
# Pacific's, the Mediterranean's, the Atlantic's, Europe's and the pilot's, so the check reads all
# nine: the map block here is the newest, the territories, sea zones, adjacency and sites in scope are
# the nine files' lists joined. Its blocks are the build's world fragment
# (worlds/maps/autumn-1941-globe.world.yaml) as built, this region's territories and every adjacency
# pair that names one of them; the region adds no sea zone. The sites in scope are the region's 20 new
# places, entered here and in australasia.places.yaml, which `places_of` names in place of the world
# file (the world file is not edited by this item). Rebuild the map, then copy the fragment's blocks
# into the nine staging worlds; the test pins the hash.
extends: inner-asia.world.yaml
places_of: australasia.places.yaml
map: {coords: lonlat, file: autumn-1941-globe.json, sha256: 4cec6c8f44764ce8152e4bce84b8a599e1927a71e18055e7378e9d567190f3f9, box: [-126, -60, 234, 84]}
regions:
