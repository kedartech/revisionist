# The 1941 map, ninth region: Australasia and the Pacific islands. Built by scripts/map_build.py
# together with the earlier regions (see worlds/maps/README.md); the provinces are Natural Earth 1:10m
# admin-1 codes (worlds/maps/SOURCES.md). Every value here is [proposed]: the territory list and names,
# which provinces make each territory and every terrain. The list is the regions draft's seven
# territories at its grain.
#
# Build it with the earlier regions, naming the recipe files:
#   python scripts/map_build.py build worlds/maps/src/autumn-1941-globe/eastern-front.yaml \
#     worlds/maps/src/autumn-1941-globe/europe.yaml worlds/maps/src/autumn-1941-globe/atlantic.yaml \
#     worlds/maps/src/autumn-1941-globe/mediterranean.yaml worlds/maps/src/autumn-1941-globe/pacific.yaml \
#     worlds/maps/src/autumn-1941-globe/americas.yaml worlds/maps/src/autumn-1941-globe/africa.yaml \
#     worlds/maps/src/autumn-1941-globe/inner-asia.yaml worlds/maps/src/autumn-1941-globe/australasia.yaml \
#     --slug autumn-1941-globe
#
# What it claims. Australia whole, in two (the west with the Northern Territory, Ashmore and Cartier
# and the Indian Ocean Territories; the east with the other states, the capital territories, Lord Howe,
# Macquarie, Norfolk Island and the Coral Sea Islands); New Zealand whole with its outlying islands and
# Tokelau, which the data puts inside it; Papua New Guinea with the Solomon Islands; Palau, the
# Federated States of Micronesia, the Marshall Islands and the Northern Mariana Islands as the Japanese
# mandate; New Caledonia with Vanuatu; and Fiji, Tonga, Samoa, American Samoa, Kiribati, Tuvalu,
# Nauru, the Cook Islands, Niue, Wallis and Futuna, French Polynesia and the Pitcairn Islands as the
# South Pacific islands. Guam and the United States Minor Outlying Islands (Wake, Midway, Johnston,
# Palmyra, Howland, Baker and Jarvis) stay unclaimed: the regions draft makes each a place in its sea
# zone, held by the United States, not a part of a territory another power holds. Heard Island stays
# unclaimed too, for the southern seas. Norfolk Island, the Coral Sea Islands, Ashmore and Cartier and
# the Indian Ocean Territories, which the draft makes sites, are claimed with their Australian
# territory instead, so no land of the region is left to the backdrop.
#
# The mandate is drawn. The draft asked whether its islands, each under the checker's minimum area,
# can make a territory: the minimum is read per area, not per island, and the mandate's islands
# together pass it, so the mandate is a territory and not a set of sites. Truk and Kwajalein are
# atolls the simplified coast does not keep, so each is a place in the Central Pacific, as the draft
# puts Wake; Guam and Midway lie in water no sea zone takes yet and wait for the southern-seas item.
#
# Cut lines. None. The Dutch half of New Guinea is already in the Dutch East Indies (all of Indonesia's
# provinces, pacific.yaml), and the data's Indonesia-Papua New Guinea line is the line of 1941 (the
# 141st meridian with the Fly River bend, fixed by the Anglo-Dutch treaty of 1895), so no cut is drawn
# (MAC rule 3: none where the line does not differ). Gap: the line is read from the data, with no
# evidence record. The Japanese mandate's Northern Marianas leave out Guam, which the data keeps apart.
#
# One area, several holders. The South Pacific islands fold British colonies (Fiji, the Gilbert and
# Ellice Islands, Tonga under protection, Pitcairn), New Zealand's Western Samoa and Cook Islands, the
# United States' American Samoa, Free French Polynesia and Wallis and Futuna (Vichy until 1942) into
# one holder in start.yaml, a gap. New Caledonia with the New Hebrides (an Anglo-French condominium)
# has the Free French holder, a gap for the New Hebrides. New Guinea with the Solomons is the United
# Kingdom's: the Australian mandate and Papua and the British Solomons protectorate, held as the world
# holds a dominion.
