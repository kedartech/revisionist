# The scoped check's staging world for the 1941 map's second region (Europe and the rest of the
# Eastern Front):
#   python scripts/map_check.py check --region worlds/maps/src/autumn-1941-globe/europe.world.yaml
# It extends the pilot's staging world, so the check reads both: the map block here is the newest,
# the territories, sea zones, adjacency and sites in scope are the two files' lists joined. Its
# blocks are the build's world fragment (worlds/maps/autumn-1941-globe.world.yaml) as built, the Europe
# region's areas and every adjacency pair that names one of them; the pilot's file keeps the pairs
# inside its own region. The sites in scope are the three places today's world file has in the
# region, their coordinates copied from it (that file is not edited here). Rebuild the map, then copy
# the fragment's blocks into both staging worlds; the test pins the hash.
