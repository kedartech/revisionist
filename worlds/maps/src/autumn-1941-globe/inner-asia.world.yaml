# The scoped check's staging world for the 1941 map's eighth region (India, Central Asia and Siberia):
#   python scripts/map_check.py check --region worlds/maps/src/autumn-1941-globe/inner-asia.world.yaml
# It extends the Africa region's staging world, which extends the Americas', the Pacific's, the
# Mediterranean's, the Atlantic's, Europe's and the pilot's, so the check reads all eight: the map block
# here is the newest, the territories, sea zones, adjacency and sites in scope are the eight files'
# lists joined. Its blocks are the build's world fragment (worlds/maps/autumn-1941-globe.world.yaml) as
# built, this region's territories and every adjacency pair that names one of them; the region adds no
# sea zone. The sites in scope are the region's 29 new places, entered here and in
# inner-asia.places.yaml, which `places_of` names in place of the world file (the world file is not
# edited by this item). Rebuild the map, then copy the fragment's blocks into the eight staging worlds;
# the test pins the hash.
