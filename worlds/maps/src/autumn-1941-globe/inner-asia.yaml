# The 1941 map, eighth region: India, Central Asia and Siberia. Built by scripts/map_build.py together
# with the earlier regions (see worlds/maps/README.md); the provinces are Natural Earth 1:10m admin-1
# codes (worlds/maps/SOURCES.md). Every value here is [proposed]: the territory list and names, which
# provinces make each territory and every terrain. The list is the regions draft's (thirteen core
# territories at its grain and one small piece the holders of 1 September 1941 set apart: Goa).
#
# Build it with the earlier regions, naming the recipe files:
#   python scripts/map_build.py build worlds/maps/src/autumn-1941-globe/eastern-front.yaml \
#     worlds/maps/src/autumn-1941-globe/europe.yaml worlds/maps/src/autumn-1941-globe/atlantic.yaml \
#     worlds/maps/src/autumn-1941-globe/mediterranean.yaml worlds/maps/src/autumn-1941-globe/pacific.yaml \
#     worlds/maps/src/autumn-1941-globe/americas.yaml worlds/maps/src/autumn-1941-globe/africa.yaml \
#     worlds/maps/src/autumn-1941-globe/inner-asia.yaml --slug autumn-1941-globe
#
# What it claims. The 35 Russian units the earlier regions left (Kalmykia to Kirov on the Volga, the
# Urals, Siberia up to the Soviet Far East's line, and Tuva); Kazakhstan with Baykonur;
# the four Central Asian republics; Afghanistan; Pakistan, Bangladesh, Sri Lanka, Nepal, Bhutan,
# Mongolia and the Indian units; Xizang and Xinjiang. With it Russia's 86 units are all claimed, and
# India's 36 but one. The earlier regions' territories are not touched; each border this region shares
# with one of them is that territory's own line. The Andaman and Nicobar Islands stay unclaimed: the
# Andaman Sea zone's western edge crosses the Nicobars, and claiming them leaves a gap of one grid step
# between the zone, the backdrop and the islands where that edge meets the coast, which the build's
# check fails. They are left for the sea-zone item, which can move that edge.
#
# Cut lines. None. The Soviet republics' lines of 1941 differ from the present ones (the Kalmyk ASSR,
# Astrakhan, the Kazakh-Uzbek line after the Karakalpak ASSR moved in 1936), but each such line falls
# between two territories the Soviet Union holds, so the present lines stand, a gap. Xinjiang, Xizang
# and Tuva are whole admin-1 units: present Xizang against the 1941 Lhasa-held line (the Xikang border
# with Sichuan and Qinghai) is a gap, not a cut the data can make without a source. Aksai Chin lies
# in Xinjiang in the data, against a 1941 line that was never fixed, a gap. Arunachal Pradesh goes
# with Bengal, against Tibet's administration of Tawang in 1941, a gap.
#
# One area, several holders. The Indus and the North-West, the Ganges plain and Southern India fold in
# the princely states with British India; Southern India takes Ceylon, and French India's Puducherry
# unit, a gap; the Indus takes Daman and Diu, Portuguese, inside the Dadra unit, a gap. Tibet takes
# Nepal and Bhutan; Mongolia takes Tannu Tuva. Each has one holder in start.yaml, a gap.
