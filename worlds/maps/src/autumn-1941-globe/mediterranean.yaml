# The 1941 map, fourth region: the Mediterranean, North Africa and the Middle East. Built by
# scripts/map_build.py together with the earlier regions (see worlds/maps/README.md); the provinces are
# Natural Earth 1:10m admin-1 codes (worlds/maps/SOURCES.md). Every value here is [proposed]: the
# territory list and names, which provinces make each territory, every cut line, every terrain and every
# sea zone line.
#
# Build it with the earlier regions, naming the recipe files:
#   python scripts/map_build.py build worlds/maps/src/autumn-1941-globe/eastern-front.yaml \
#     worlds/maps/src/autumn-1941-globe/europe.yaml worlds/maps/src/autumn-1941-globe/atlantic.yaml \
#     worlds/maps/src/autumn-1941-globe/mediterranean.yaml --slug autumn-1941-globe
#
# The box is the map's (the Pacific file gives its reason). Land and water in the box that no recipe
# claims (Western Sahara and the Sahel, Arabia, the Gulf, the Red Sea and Italian East Africa, Cape Verde
# and the Canaries) stay the backdrop.
#
# The Caucasus. Georgia, Armenia and Azerbaijan, with the Soviet North Caucasus (Krasnodar, Adygea,
# Stavropol and the republics from Karachay-Cherkessia to Dagestan: Maikop, Grozny and the road to Baku).
# Astrakhan and Kalmykia are left to the backdrop, and no recipe claims them.
#
# Libya. Libya's districts make three territories: Tripolitania and the Fezzan (the north-west, the
# Jefara, Sirte and the Saharan south, 1941 Italian Tripolitania and the Southern Territory), Cyrenaica
# (Ajdabiya and the Jebel Akhdar to Derna, the Marmarica plateau to Bardia, and the oasis of Kufra) and
# the Tobruk enclave. The district of Al Butnan holds Tobruk and Bardia; it is cut so that the enclave,
# the perimeter the Eighth Army's garrison held from April to December 1941, is a territory of its own and
# Bardia, outside it, is in Cyrenaica. The line is a half-circle of 0.25 degrees (about 27 km) round the
# town that runs from the sea west of Tobruk to the sea east of it, drawn for play; its points are the
# lane's interpretation with no evidence record, so it is `gap: true`. The enclave is 0.11 square degrees,
# above the checker's minimum of 0.05.
#
# The Dodecanese. The Italian islands (Rhodes, Kos, Leros and the rest) are in the Greek region of
# Notio Aigaio together with the Cyclades, which were Greek (and under German-Italian occupation from
# 1941). The province is cut by a north-south line at 26.15 E between Amorgos (Cyclades) and Astypalaia
# (Dodecanese), and the east side is the Dodecanese territory. Gap: the line is the lane's reading of the
# archipelago's division, with no evidence record. The islands north of it (Ikaria, Samos, Chios, Lesbos)
# are in Voreio Aigaio, Greek in 1941 until April-May 1941 and then occupied; the whole of Greece is one
# territory (the holder is a later item's).
#
# Malta and Cyprus. Malta is carried by the data (68 local councils, 0.0325 square degrees) but is smaller
# than the checker's minimum area of 0.05 square degrees, so it cannot be a territory of its own. The
# default taken: Malta is joined to Cyprus, also a British island and 0.56 square degrees, in one
# territory of two parts (the same way Scotland and Ulster are one territory of two parts). Listed for
# Josh: a holder holds both, and a later item may lower the checker's minimum, or give Malta a sea-zone
# site, to part them.
#
# 1941 borders that follow present-day province lines, so no cut is needed:
# - Libya and Egypt: the present border follows the wire of 1941 (25 E, Sollum).
# - Hatay (Alexandretta) went to Turkey in 1939: it is Turkish whole.
# - Lebanon and Syria, Palestine and Transjordan: the mandates of 1941 follow the present borders; Syria and
#   Lebanon are one territory, as are Palestine (Israel, the West Bank and Gaza) and Transjordan.
# - Kars and Ardahan went to Turkey in 1921; the present border is the 1941 one.
# Where a 1941 border runs inside a present-day province and this file carries no cut (listed for Josh):
# - The Spanish zone of Morocco and the Tangier zone are in French North Africa; Ceuta and Melilla are in
#   the Iberian territory of the Europe file.
# - The Aouzou strip, the Libyan-Algerian line in the Sahara and the Fezzan's southern edge.
# - Iraq, Iran and the Gulf: the Anglo-Soviet occupation of Iran in August 1941 is a later item's.
# - Kastellorizo (Italian since 1921) is too small to survive the simplification and is not in the map.
#
# Sea zones. Five, drawn for play and not sourced: the Western Mediterranean, the Central Mediterranean
# (the Sicily Narrows, the Tyrrhenian and Ionian seas, the Adriatic and the Gulf of Sirte), the Eastern
# Mediterranean (Crete and the Levant to Egypt, Cyprus, Tobruk and Alexandria), the Aegean, and the
# Gibraltar Approaches (the Atlantic coast of Morocco, Portugal and Spain south of the Bay of Biscay), which
# the plan's four did not name and without which the Mediterranean would not join the Atlantic. The
# Strait of Gibraltar and the Turkish Straits are declared crossings, because the water that joins them is
# narrower than the checker's shared-border minimum or is not water in the data. The Black Sea, the Bay of
# Biscay and the Mid-Ocean Gap are the earlier regions' zones the new ones join.
#
# Places. Six, new to the map, each a site of the territory it lies in: Alexandria (Egypt), Malta (Malta and
# Cyprus), Tobruk (the Tobruk enclave), Bardia (Cyrenaica), Tripoli (Tripolitania) and Taranto, which
# lies in the Europe file's Rome and the South territory (ITA-5408); the Europe recipe and its staging
# world list it there as a site (a deviation line records that edit). The town centre of Bardia is on the
# data's coast (31.756 N, 25.087 E), so the place is set 0.02 degrees inland, on the escarpment above the
# harbour; Tobruk and Bardia then lie in different territories. The coordinates are the towns' published
# centres to 0.01 degrees, entered without a network and not yet confirmed against GeoNames: listed for
# COD3 and Josh to confirm.
