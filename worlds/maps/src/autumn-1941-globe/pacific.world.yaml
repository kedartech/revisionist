# The scoped check's staging world for the 1941 map's fifth region (China, Japan and the Pacific):
#   python scripts/map_check.py check --region worlds/maps/src/autumn-1941-globe/pacific.world.yaml
# It extends the Mediterranean region's staging world, which extends the Atlantic's, Europe's and the
# pilot's, so the check reads all five: the map block here is the newest, the territories, sea zones,
# adjacency and sites in scope are the five files' lists joined. Its blocks are the build's world fragment
# (worlds/maps/autumn-1941-globe.world.yaml) as built, this region's areas and every adjacency pair that names
# one of them; the earlier files keep the pairs inside their own regions. The sites in scope are the
# world's five places in the region (Tokyo, Kure, Hitokappu Bay, Pearl Harbor and Chungking, coordinates
# unchanged) and two new ones, Changsha and Wuhan, entered here and in pacific.places.yaml, which
# `places_of` names in place of the world file (the world file is not edited by this item). Rebuild the
# map, then copy the fragment's blocks into the five staging worlds; the test pins the hash.
#
# Pearl Harbor is at -158 as the world writes it; the map draws Hawaii a whole turn east, near 202, and the
# checker reads the place there (worlds/maps/README.md).
extends: mediterranean.world.yaml
places_of: pacific.places.yaml
map: {coords: lonlat, file: autumn-1941-globe.json, sha256: afcd257ffb932123481e0908773bc33cc5da12305d9493506fe59fcd69e1b9df, box: [-126, -60, 234, 84]}
regions:
