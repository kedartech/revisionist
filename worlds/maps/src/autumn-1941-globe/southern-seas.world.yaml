# The scoped check's staging world for the 1941 map's southern and polar seas:
#   python scripts/map_check.py check --region worlds/maps/src/autumn-1941-globe/southern-seas.world.yaml
# It extends the Australasia region's staging world, which extends the nine earlier ones, so the check
# reads all ten: the map block here is the newest, the territories, sea zones, adjacency and sites in
# scope are the ten files' lists joined. Its blocks are the build's world fragment
# (worlds/maps/autumn-1941-globe.world.yaml) as built, this region's sea zones and every adjacency pair
# that names one of them, with the two pairs the item adds elsewhere (the grown Arctic route meets
# northern Britain, and Ceuta and Melilla join Iberia to French North Africa); the region adds no
# territory and no place. Rebuild the map, then copy the
# fragment's blocks into the ten staging worlds; the test pins the hash.
