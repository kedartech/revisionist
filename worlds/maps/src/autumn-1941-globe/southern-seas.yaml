# The 1941 map, tenth region: the southern and polar seas. Built by scripts/map_build.py together with
# the nine land regions (see worlds/maps/README.md). Every value here is [proposed]: the zone list,
# the names and every sea zone line.
#
# Build it with the other regions, naming the recipe files:
#   python scripts/map_build.py build worlds/maps/src/autumn-1941-globe/eastern-front.yaml \
#     worlds/maps/src/autumn-1941-globe/europe.yaml worlds/maps/src/autumn-1941-globe/atlantic.yaml \
#     worlds/maps/src/autumn-1941-globe/mediterranean.yaml worlds/maps/src/autumn-1941-globe/pacific.yaml \
#     worlds/maps/src/autumn-1941-globe/americas.yaml worlds/maps/src/autumn-1941-globe/africa.yaml \
#     worlds/maps/src/autumn-1941-globe/inner-asia.yaml worlds/maps/src/autumn-1941-globe/australasia.yaml \
#     worlds/maps/src/autumn-1941-globe/southern-seas.yaml --slug autumn-1941-globe
#
# The cover. The map says `cover: whole`: with this region every part of the box is land of some
# territory or water of some sea zone, and the build refuses a gap. Antarctica lies south of the box.
#
# Sea zones. Drawn for play and not sourced; each takes the open water no earlier zone took. The
# zones of the other regions keep their keys and names; where open water met one of them along a
# coast too narrow for a zone of its own (the Channel's French shore, the Irish Sea, the Gulf of
# Alaska, the Bosporus and the Dardanelles, the Gulf of Aqaba, the Andaman shore, the Riau and Bangka
# straits, the Yellow Sea's Chinese shore), that zone's line was moved to the coast, and the
# Caribbean's line was moved off the Pacific shore of Central America so that the two oceans meet
# only at Panama. The Caspian Sea and the Greenland and Barents seas are water in the box with no zone
# before this region, so each has one.
#
# Crossings. Where the box's seam at 126 W runs through open sea, the zones on its two sides are joined
# by a crossing over it. The Suez Canal joins the Eastern Mediterranean and the Red Sea, and the Panama
# Canal the Caribbean and the American Pacific, each as a plain step; a fleet's passage of either is
# still barred while its side is at war with the canal's holder by the sea routing's doors.
#
# Small islands. The islands earlier regions left out are claimed with the nearest territory of
# their 1941 holder in start.yaml (Bermuda with Eastern Canada, the Maldives and Chagos with Southern
# India, Guam with the Philippines, the American Pacific islands with Hawaii, the French southern
# islands with Madagascar), else of their present-day country, else with the nearest territory.
