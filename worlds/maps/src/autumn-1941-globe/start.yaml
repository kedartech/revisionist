# The 1941 start for the territory world of autumn 1941: the wars in force on 1 September 1941, each
# land territory's holder on that day, the terrain, resources and piece kinds, the bases and ports as
# sites, and every force as a piece in an area. A staging file: the item that converts the world (FLP)
# assembles these blocks into worlds/autumn-1941.yaml, so the game plays as today until then. The
# tests (tests/test_world_start_1941.py) read it against the map's world fragment
# (worlds/maps/autumn-1941-globe.world.yaml), the map file and today's world file.
#
# Blocks shaped as the world file has them: `sources`, `wars`, `terrain`, `resources`, `piece_kinds`,
# `entities` (new polities, and every place restated with `within`, a port's `port_on` and a base's
# `base`), `features` (the eight new forces). Blocks of this file's own, for FLP to fold in:
# - `holders`: each land territory's holder on 1 September 1941 (the territory's `holder`), with a
#   source or `gap: true`. Every holder here is a gap: the lane had no network and no evidence record.
# - `forces`: every force, today's and the new, with its piece kind, its side, the area it stands in at
#   the start and its scripted legs as areas (the leg's place read the way a piece of its domain
#   stands there: a ship at a port in the port's sea zone, anything else in the area the place lies in).
#
# Every value here is [proposed]: the holders, the bases and ports added for the new forces, the new
# forces' strengths (tiers), and the days per step (the plan's Values section). Defaults taken from the
# plan until sourced: the two Italian declarations of war, the Eleventh Army's legs (to Changsha on
# 17 September, back to Wuhan on 6 October), and Bardia as the Axis frontier place.
#
# The world file indexes places, polities, features and areas as one set of keys. An area whose name
# is also a place's, a polity's or a force's carries the suffix `_area` (moscow_area, tobruk_area,
# sweden_area, western_approaches_area), so every place and force keeps its key.
#
# For FLP and the values sheet. With `holders` on, a base serves a side only on ground held by that side
# or an ally (`holders.serves`), and a polity is an ally only while at war with a common enemy
# (`territory.allied`): so Vyazma's base does not serve the Soviet Western Front while Germany holds
# Smolensk, Reykjavik's does not serve the United States (at war with nobody), and Argentia's air base
# has no area (Argentia lies in the Western Atlantic). Finland, Romania and Hungary hold their own
# territories and are at war with nobody here: the plan's five wars leave them out, so a piece of any
# seated nation is barred from their ground until a later item gives them their wars or pacts.

sources:
  - key: hansard_1939_09_03
    title: "House of Commons debates, 3 September 1939: the Prime Minister's statement that Britain is at war with Germany"
    note: "Named citation; the lane had no network and read no edition or column. Confirm the locator before release."
  - key: dgfp_d_xii
    title: "Documents on German Foreign Policy, Series D, vol. XII: Germany's note to the Soviet Union of 22 June 1941"
    note: "Named citation; the lane had no network and read no document number. Confirm the locator before release."
  - key: frus_japan_1931_1941
    title: "Foreign Relations of the United States, Japan 1931-1941, vol. I: the Marco Polo Bridge incident, 7 July 1937"
    note: "Named citation for the start of the undeclared war; the lane had no network and read no page. Confirm before release."

# Rule 1: five wars. `a` began each. The two Italian declarations are gaps until sourced (the plan's
# default).
wars:
  - {a: uk, b: germany, since: 1939-09-03, source: hansard_1939_09_03}
  - {a: italy, b: uk, since: 1940-06-10, gap: true}
  - {a: germany, b: ussr, since: 1941-06-22, source: dgfp_d_xii}
  - {a: italy, b: ussr, since: 1941-06-22, gap: true}
  - {a: japan, b: china, since: 1937-07-07, declared: false, source: frus_japan_1931_1941}

# Rule 3: the map's terrain. No defence values: the battle items set them.
terrain:
  - {key: plain, kind: land}
  - {key: forest, kind: land}
  - {key: marsh, kind: land}
  - {key: mountain, kind: land}
  - {key: sea, kind: sea}

# The five yields a territory has (the yields item writes the numbers).
resources:
  - {key: industry, name: Industry, unit: points, role: output}
  - {key: manpower, name: Manpower, unit: points, role: manpower}
  - {key: oil, name: Oil, unit: points, role: fuel}
  - {key: supply, name: Rail and ports, unit: hubs, role: supply}
  - {key: prestige, name: Prestige, unit: points, role: prestige}

# Days per step from the plan's Values section: an army 5 over plain, 7 through forest or marsh, 10
# through mountain; a fleet 3 a sea zone; an envoy 2 a step. An air group rebases 2 steps a day in the
# plan; a step takes whole days, so it takes 1, the least there is. Its range is 2 steps.
piece_kinds:
  - {key: army, name: Army, domain: land, days_per_step: {plain: 5, forest: 7, marsh: 7, mountain: 10}}
  - {key: fleet, name: Fleet, domain: sea, days_per_step: {sea: 3}, carries: [army]}
  - key: air_group
    name: Air group
    domain: air
    days_per_step: {plain: 1, forest: 1, marsh: 1, mountain: 1, sea: 1}
    range_steps: 2
  - {key: envoy, name: Envoy, domain: envoy, days_per_step: {plain: 2, forest: 2, marsh: 2, mountain: 2, sea: 2}}

