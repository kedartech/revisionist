# The scoped check's staging world for the 1941 map's third region (the Atlantic, Britain and North
# America):
#   python scripts/map_check.py check --region worlds/maps/src/autumn-1941/atlantic.world.yaml
# It extends the Europe region's staging world, which extends the pilot's, so the check reads all
# three: the map block here is the newest, the territories, sea zones, adjacency and sites in scope
# are the three files' lists joined. Its blocks are the build's world fragment
# (worlds/maps/autumn-1941.world.yaml) as built, the Atlantic region's areas and every adjacency pair
# that names one of them (a declared crossing included); the earlier files keep the pairs inside
# their own regions. The sites in scope are the places today's world file has in the region, their
# coordinates copied from it (that file is not edited here). Rebuild the map, then copy the
# fragment's blocks into the three staging worlds; the test pins the hash.
#
# `ports` (read by the test, not by the checker) names, for each port of the region, the territory
# that holds it and the sea zone it lies in or opens on. Liverpool, Argentia and Scapa Flow lie in
# the water of the data (see the recipe), so each is a place in its zone and no territory's site;
# the others are sites on land. London and Washington are inland and have no port entry.
extends: europe.world.yaml
places_of: ../../../autumn-1941.yaml
map: {coords: lonlat, file: autumn-1941.json, sha256: 0a0e5b5b753978e7391c82d004bb5cc92802efe10b793931160bc1530ace6bac, box: [-126, -11.5, 234, 71.5]}
regions:
  - {key: atlantic, name: The Atlantic}
territories:
  - {key: britain_south, name: England and Wales, region: atlantic, terrain: plain, sites: [london]}
  - {key: britain_north, name: Scotland and Ulster, region: atlantic, terrain: mountain}
  - {key: ireland, name: Ireland, region: atlantic, terrain: plain}
  - {key: iceland, name: Iceland, region: atlantic, terrain: mountain, sites: [reykjavik]}
  - {key: greenland, name: Greenland, region: atlantic, terrain: mountain}
  - {key: newfoundland, name: Newfoundland and Labrador, region: atlantic, terrain: forest}
  - {key: eastern_canada, name: Eastern Canada, region: atlantic, terrain: forest, sites: [halifax_port, sydney_cb]}
  - {key: us_east, name: The Eastern United States, region: atlantic, terrain: forest, sites: [washington, norfolk]}
  - {key: us_central, name: The Central United States, region: atlantic, terrain: plain}
  - {key: us_west, name: The Western United States, region: atlantic, terrain: mountain}
  - {key: caribbean, name: The Caribbean, region: atlantic, terrain: forest}
sea_zones:
