  - {key: mid_ocean_gap, name: The Mid-Ocean Gap, region: atlantic, terrain: sea}
  - {key: western_atlantic, name: The Western Atlantic, region: atlantic, terrain: sea}
  - {key: labrador_sea, name: The Labrador Sea, region: atlantic, terrain: sea}
  - {key: denmark_strait, name: The Denmark Strait, region: atlantic, terrain: sea}
  - {key: arctic_route_area, name: The Arctic Route, region: atlantic, terrain: sea}
  - {key: caribbean_sea, name: The Caribbean and the Gulf of Mexico, region: atlantic, terrain: sea}
