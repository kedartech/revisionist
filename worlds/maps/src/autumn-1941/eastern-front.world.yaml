# The scoped check's staging world for the 1941 pilot region (the Eastern Front). The map now holds
# the regions built after it too, so the check runs on the newest staging world, which extends this:
#   python scripts/map_check.py check --region worlds/maps/src/autumn-1941/europe.world.yaml
# Its map block, regions, territories, sea zones and adjacency are the build's world fragment
# (worlds/maps/autumn-1941.world.yaml) as built, the pilot region's areas and the adjacency pairs
# between them; the sites in scope are the twelve places today's world file has in the region, their
# coordinates copied from it (that file is not edited here). Rebuild the map, then copy the
# fragment's blocks here; the test pins the hash.
places_of: ../../../autumn-1941.yaml
map: {coords: lonlat, file: autumn-1941.json, sha256: f770cde38f1fd71b3dce6000c04bb238062d421f7161565fce9abd409f8c57bc, box: [-126, -11.5, 234, 71.5]}
regions:
