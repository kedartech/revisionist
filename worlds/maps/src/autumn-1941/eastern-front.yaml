# The 1941 map, pilot region: the Eastern Front, from the Baltic to the Black Sea and from the frontier
# of June 1941 to the Volga. Built by scripts/map_build.py (see worlds/maps/README.md); the provinces
# are Natural Earth 1:10m admin-1 codes (worlds/maps/SOURCES.md). Every value here is [proposed]:
# the territory list and names, which provinces make each territory, every cut line and every terrain.
#
# Build it with the regions built after it, naming the recipe files, not the directory (the staging
# worlds beside them are `.yaml` too); the map's box is in the Europe file, so this file alone does not
# build:
#   python scripts/map_build.py build worlds/maps/src/autumn-1941/eastern-front.yaml \
#     worlds/maps/src/autumn-1941/europe.yaml --slug autumn-1941
#
# Cut lines. The lane has no network and no evidence record for any 1941 border, so every cut is
# `gap: true`: `named_source` says which border it stands for and which publication would source it,
# and the points are the lane's interpretation, drawn dashed on the proof sheet for Josh to mark. A gap
# becomes sourced only by an evidence record (edition and locator, the exact claim, how the points were
# taken, who verified it); that a publication exists does not promote it. No border here was compared
# by eye with CShapes or historical-basemaps.
#
# Where the plan names a 1941 border and this file carries no cut (each listed for Josh):
# - Bessarabia and northern Bukovina against Romania: the June 1941 line ran on the Prut and on the
#   line of 1940 north of it, which the present Moldova-Romania and Ukraine-Romania borders follow at
#   this map's scale, so no present-day province is divided. Moldova and Chernivtsi are whole here.
# - The Soviet-Lithuanian line: in June 1941 it was a line inside the USSR (Lithuania annexed in
#   August 1940, the strip west of Marijampole bought from Germany in January 1941), so it divides no
#   holder. The East Prussian line on the Baltic is the Memel Territory cut below.
# - The 1939 line along the Bug: the present Poland-Belarus and Poland-Ukraine borders follow the river,
#   so Lublin is not divided. Two places where the 1939 line may leave the present border are not cut
#   (no source, and too small to place without one): the strip east of the Bug in Masovian around
#   Malkinia and Zareby, and the Belz-Sokal strip that the 1951 exchange moved between Lviv and Lublin.
# - Zakarpattia was Hungary's in June 1941 and is left out of the region.
#
# Neighbours. A cut gives each side to a territory, so the far side of each frontier cut needs one:
# East Prussia, occupied Poland and Finland. The Europe file (europe.yaml) defines the three, with
# their provinces, in its own region; the cut lines below name them and stay here.
