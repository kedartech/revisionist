    left: belorussia
    right: east_prussia
    gap: true
    named_source: >-
      the German-Soviet boundary of the treaty of 28 Sep 1939 (Suwalki and Sejny to Germany,
      Augustow to the USSR, then the Pisa to the Narew); points interpreted, no evidence record
  - name: the German-Soviet line of 1939 (Podkarpackie)
    province: POL-3152
    line: [[22.90, 48.95], [22.65, 49.20], [22.45, 49.35], [22.33, 49.47], [22.20, 49.56],
           [22.23, 49.80], [22.50, 49.78], [22.77, 49.78], [22.81, 49.95], [23.05, 50.20],
           [23.35, 50.40], [23.45, 50.60]]
    left: occupied_poland
    right: western_ukraine
    gap: true
    named_source: >-
      the German-Soviet boundary of the treaty of 28 Sep 1939 along the San, then north-east past
      Radymno with Lubaczow on the Soviet side; points interpreted, no evidence record
  - name: the Finnish border of 1940 (Petsamo)
    province: RUS-2333
    line: [[28.20, 68.45], [29.40, 68.95], [30.20, 69.20], [31.00, 69.45], [31.95, 69.72],
           [32.10, 70.05]]
    left: finland
    right: the_north
    gap: true
    named_source: >-
      the Finnish-Soviet border of the Moscow peace treaty of 12 Mar 1940, which left Petsamo to
      Finland as the treaty of Tartu (1920) drew it; points interpreted, no evidence record
