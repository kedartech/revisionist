cuts:
  # Walking a line from its first point, `left` takes what lies left of it and `right` what lies right.
  - name: the Memel Territory line (Klaipeda county)
    province: LTU-935
    line: [[20.85, 55.865], [21.30, 55.80], [21.36, 55.68], [21.47, 55.55], [21.70, 55.42],
           [21.95, 55.30], [22.30, 55.18], [22.62, 55.07], [22.75, 54.98]]
    left: baltic_states
    right: east_prussia
    gap: true
    named_source: >-
      the boundary of the Memel Territory as returned to Germany by the German-Lithuanian treaty of
      22 Mar 1939; points interpreted, no evidence record
  - name: the Memel Territory line (Taurage county)
    province: LTU-1073
    line: [[21.47, 55.55], [21.70, 55.42], [21.95, 55.30], [22.30, 55.18], [22.62, 55.07],
           [22.75, 54.98]]
    left: baltic_states
