# The 1941 map, second region: Europe and the rest of the Eastern Front, from the Atlantic coast of
# France and Iberia to the Baltic, the Carpathians and the Balkans. Built by scripts/map_build.py
# together with the pilot region (see worlds/maps/README.md); the provinces are Natural Earth 1:10m
# admin-1 codes (worlds/maps/SOURCES.md). Every value here is [proposed]: the territory list and
# names, which provinces make each territory, every cut line, every terrain and every sea zone line.
#
# Build it with the pilot, naming the recipe files (the staging worlds beside them are `.yaml` too):
#   python scripts/map_build.py build worlds/maps/src/autumn-1941/eastern-front.yaml \
#     worlds/maps/src/autumn-1941/europe.yaml --slug autumn-1941
# This file carries the map's box; the pilot's file gives none.
#
# Taken over from the pilot. East Prussia, occupied Poland (the General Government) and Finland were
# the pilot's neighbours beyond the frontier; they are defined here, with their provinces, in this
# region. The pilot's cut lines (the Memel Territory, the 1939 line in Podlaskie and Podkarpackie,
# Petsamo) stay in its file unchanged and still give their far sides to these three. No province is
# claimed by both files.
#
# Cut lines. The lane has no network and no evidence record for any 1941 border, so every cut is
# `gap: true`: `named_source` says which border it stands for and which act would source it, and the
# points are the lane's interpretation, drawn dashed on the proof sheet for Josh to mark. A gap
# becomes sourced only by an evidence record (edition and locator, the exact claim, how the points were
# taken, who verified it); that a publication exists does not promote it. No border here was compared
# by eye with CShapes or historical-basemaps.
#
# 1941 borders that follow present-day province lines, so no cut is needed:
# - Alsace-Lorraine: the departments of Moselle, Bas-Rhin and Haut-Rhin keep the line of 1871 that the
#   annexation of 1940 restored; the Territoire de Belfort stayed French.
# - Northern Transylvania outside the three cut counties: Satu Mare, Maramures, Salaj,
#   Bistrita-Nasaud, Harghita and Covasna went to Hungary whole; Arad, Alba, Sibiu and Brasov stayed
#   Romanian whole at this map's scale.
# - Southern Dobruja: the present Romania-Bulgaria border is the line of 1940.
# - Zakarpattia (Transcarpathia), Hungarian since 1939, is a province of its own.
#
# Where a 1941 border runs inside a present-day province and this file carries no cut (each listed
# for Josh; too small to place without a source, or inside one territory of this map):
# - The Italian zone in France of 1940 (Menton and a few Alpine communes), inside Alpes-Maritimes
#   and Savoie, which are Vichy France here.
# - Hanko, leased to the Soviet Union in 1940, inside Uusimaa, which is Finland here.
# - Spisz and Orava, given to Slovakia in 1939, inside Lesser Poland, which the Reich border divides.
# - The partition of Yugoslavia in April 1941, by Slovenian statistical region and Serbian district:
#   Gorenjska, Koroska, Podravska, Savinjska, Zasavska and Spodnjeposavska go to Bavaria, Austria and
#   Bohemia (the annexed north); the Ljubljana province and the coast to Northern Italy; Pomurska
#   (Prekmurje), Medimurje and the three Backa districts to Hungary and Slovakia. The Sava line and
#   the north of Osrednjeslovenska, Baranja inside Osijek-Baranja, and the Srem edge of
#   Juzno-Backi are not cut.
# - Fiume (Rijeka, inside Primorsko-Goranska) and Zara (Zadar, inside Zadarska), Italian before
#   1941, lie inside the Balkans territory.
# - Dalmatia, Montenegro, Kosovo and Bulgarian Macedonia lie inside the one Balkans territory.
# - The western edge of the Pays de Gex and the line through the Jura follow the cut, not the
#   zone interdite, whose line is not drawn.
#
# Lorient. Today's world puts Lorient at 47.7 N, 3.4 W, in the roadstead 1.2 km off the Morbihan
# shore of the data, so it lies in the Bay of Biscay sea zone, not in Occupied France; it is no site of
# a territory here. The world file is not edited by this item; 47.75 N, 3.37 W (the town) would put it
# in Occupied France, listed for Josh and for the item that edits the world's places.
#
# Neutrals. Sweden, Switzerland, and Spain and Portugal are territories like any other; `neutral`
# lists the polity keys that hold each, none of which has a seat. The build ignores the key; the
# starting holders are set in the world file by a later item, which reads it.
#
# Sea zones. Four, drawn for play and not sourced: the North Sea (south to the Strait of Dover), the
# Kattegat and the western Baltic (the Belts and the Sound, joining the pilot's Baltic at 16 E to the
# North Sea), the Gulf of Bothnia (north of the pilot's Baltic) and the Bay of Biscay. The Channel,
# the waters west of Britain and Ireland and the open Atlantic are left for the Atlantic's zones,
# which join the North Sea and the Bay of Biscay; the Mediterranean is left for its own region.
