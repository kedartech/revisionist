# The scoped check's staging world for the 1941 map's fourth region (the Mediterranean, North Africa and
# the Middle East):
#   python scripts/map_check.py check --region worlds/maps/src/autumn-1941/mediterranean.world.yaml
# It extends the Atlantic region's staging world, which extends Europe's, which extends the pilot's, so the
# check reads all four: the map block here is the newest, the territories, sea zones, adjacency and sites
# in scope are the four files' lists joined. Its blocks are the build's world fragment
# (worlds/maps/autumn-1941.world.yaml) as built, this region's areas and every adjacency pair that names
# one of them (a declared crossing included); the earlier files keep the pairs inside their own regions.
# The sites in scope are six new places: the world file has none in the region, so each is entered here
# with its coordinates and in mediterranean.places.yaml, which `places_of` names in place of the world
# file (the world file is not edited by this item). Rebuild the map, then copy the
# fragment's blocks into the four staging worlds; the test pins the hash.
#
# `ports` (read by the test, not by the checker) names, for each port of the region, the territory that
# holds it and the sea zone it opens on; all six lie on land in the data.
extends: atlantic.world.yaml
places_of: mediterranean.places.yaml
map: {coords: lonlat, file: autumn-1941.json, sha256: f770cde38f1fd71b3dce6000c04bb238062d421f7161565fce9abd409f8c57bc, box: [-126, -11.5, 234, 71.5]}
regions:
  - {key: mediterranean, name: The Mediterranean and the Middle East}
territories:
  - {key: french_north_africa, name: French North Africa, region: mediterranean, terrain: mountain}
  - {key: tunisia, name: Tunisia, region: mediterranean, terrain: plain}
  - {key: tripolitania, name: Tripolitania and the Fezzan, region: mediterranean, terrain: plain, sites: [tripoli]}
  - {key: cyrenaica, name: Cyrenaica, region: mediterranean, terrain: mountain, sites: [bardia]}
  - {key: tobruk, name: The Tobruk enclave, region: mediterranean, terrain: plain, sites: [tobruk]}
  - {key: egypt, name: Egypt, region: mediterranean, terrain: plain, sites: [alexandria]}
  - {key: levant, name: Palestine and Transjordan, region: mediterranean, terrain: plain}
  - {key: syria, name: Syria and Lebanon, region: mediterranean, terrain: plain}
  - {key: iraq, name: Iraq, region: mediterranean, terrain: plain}
