cuts:
  # Walking a line from its first point, `left` takes what lies left of it and `right` what lies right.
  # Inner Mongolia is cut twice: first Manchukuo's part, then Mengjiang's from the free west.
  - name: Manchukuo's western border in Inner Mongolia
    province: CHN-1838
    line: [[115.6, 47.6], [116.9, 46.4], [117.6, 45.3], [117.4, 44.0], [116.9, 42.8], [116.6, 41.8],
           [116.9, 41.0]]
    left: manchuria
    gap: true
    named_source: >-
      the western border of Manchukuo's Hsingan provinces and Jehol against Mengjiang's Chahar, 1941
      (Hulunbuir, Hinggan, Tongliao and Chifeng to Manchukuo); points interpreted, no evidence record
  - name: the Mengjiang front on the Yellow River bend
    province: CHN-1838
    line: [[109.0, 43.5], [109.3, 41.5], [109.6, 40.7], [110.5, 40.5], [111.2, 40.3], [112.0, 39.5]]
    left: north_china
    right: northwest_china
    gap: true
    named_source: >-
      the line between Mengjiang (Hohhot, Baotou) and the Chinese-held Hetao and Ordos after the battle of
      Wuyuan, March 1940; points interpreted, no evidence record
  - name: the Yellow River flood front in Henan
    province: CHN-1812
    line: [[112.3, 35.6], [112.6, 34.95], [113.6, 34.9], [114.3, 34.5], [114.7, 33.9], [115.3, 33.2],
           [115.9, 32.9]]
    left: north_china
    right: northwest_china
    gap: true
    named_source: >-
      the front along the Yellow River and its 1938 flood belt from Huayuankou to the Anhui border,
      autumn 1941; points interpreted, no evidence record
  - name: the Yichang front in Hubei
