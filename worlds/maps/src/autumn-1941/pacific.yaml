# The 1941 map, fifth region: China, Japan and the Pacific. Built by scripts/map_build.py together with
# the earlier regions (see worlds/maps/README.md); the provinces are Natural Earth 1:10m admin-1 codes
# (worlds/maps/SOURCES.md). Every value here is [proposed]: the territory list and names, which provinces
# make each territory, every cut line, every terrain and every sea zone line.
#
# Build it with the earlier regions, naming the recipe files:
#   python scripts/map_build.py build worlds/maps/src/autumn-1941/eastern-front.yaml \
#     worlds/maps/src/autumn-1941/europe.yaml worlds/maps/src/autumn-1941/atlantic.yaml \
#     worlds/maps/src/autumn-1941/mediterranean.yaml worlds/maps/src/autumn-1941/pacific.yaml \
#     --slug autumn-1941
#
# The box. This region widens the map's box to [-126, -11.5, 234, 71.5]: east past the date line to 234
# (126 W written a whole turn on), so the box runs once round the globe with its seam at 126 W, off the
# American west coast, and south to 11.5 S for Java, Timor and New Guinea. The build writes the land and
# water east of 180 with longitudes beyond 180 (GEO rule 8), so the Pacific is one stretch of water with
# Japan at its west and Hawaii (about 202) inside it, and the date line runs through the Central Pacific
# zone, not along a border. The box is the same in every recipe file (the build refuses a disagreement).
# A place of the world file keeps its longitude as written (Pearl Harbor at -158); the checker reads a
# lonlat place outside the box a whole turn east or west when that brings it inside (map_check.place_lon).
# Land and water in the box that no recipe claims stay the backdrop: Alaska, western Canada, Mexico and
# Central America, Siberia west of Transbaikalia and north of the Amur, Sakha, Magadan, Chukotka and
# Kamchatka, Mongolia, Xinjiang and Tibet, India and Ceylon, Australia's north, New Guinea east of the
# Dutch line, Africa and South America south of 10 N, the Indian Ocean, and the small islands of the
# Pacific (the Japanese mandate, Guam, Wake and Midway, which the data carries but which are each under the
# checker's minimum area of 0.05 square degrees).
#
# The Pacific joins the American west coast (MAC rule 4). The box's seam at 126 W runs through open sea
# off the coast: the Eastern Pacific zone (150 W to the seam) ends at the box's east edge, and the coast of
# California, Oregon and Washington lies a few degrees inside its west edge, with the strip of water
# between them left to the backdrop. The zone and the Western United States are joined by a declared
# crossing over the seam, so the two are adjacent; the zone touches the Central and North Pacific, so a
# fleet from Pearl Harbor reaches the coast through adjacent zones. (A zone drawn in two parts, one each
# side of the seam, would stretch the region's proof sheet round the whole globe.)
#
# Japan. Japan in two: Japan East (Hokkaido, Tohoku, Kanto and Chubu, with southern Sakhalin, Karafuto,
# and the Kuriles) and Japan West (Kinki, Chugoku, Shikoku, Kyushu and Okinawa). Formosa (Taiwan with the
# Pescadores) is a territory of its own. Korea is whole (South and North Korea's provinces).
#
# Sakhalin. The Sakhalin oblast holds the whole island and the Kuriles. In 1941 the island was divided at
# the 50th parallel (Treaty of Portsmouth, 1905, Article IX) and the Kuriles were Japanese (Treaty of
# St Petersburg, 1875); the cut runs along 50 N across the island and bends north-east in the sea so that
# Shumshu, the northernmost Kurile, stays on the Japanese side. Gap: the line is placed by the lane from
# the treaties' wording, with no evidence record.
#
# Manchuria and the Soviet Far East. Manchuria is Heilongjiang, Jilin and Liaoning (the Kwantung lease
# included) and the part of Inner Mongolia Manchukuo held (Hulunbuir, Hinggan, Tongliao and Chifeng), cut
# from Inner Mongolia along Manchukuo's western border (gap). Not cut, and listed for Josh: Jehol's part now
# in Hebei (Chengde) stays with Occupied North China, also Japanese-held. The Soviet Far East is
# Transbaikalia (Chita), Amur, the Jewish oblast, Khabarovsk and Primorye, with northern Sakhalin. Its
# border with Manchuria is the present-day Russia-China line: at this map's scale the data's line is the
# 1941 Manchukuo-Soviet line on the Argun, the Amur and the Ussuri; the islands at Khabarovsk divided in
# 2004 to 2008 (Bolshoy Ussuriysky) are under the checker's minimum, so no cut is drawn (MAC rule 3: none
# where the line does not differ).
#
# China. The front between occupied and free China as it stood in autumn 1941, after the first battle of
# Changsha (September to October 1941) and before the Pacific war, is the least sure line on the map
# (MAC Defaults). Every cut through a Chinese province is `gap: true`: the points are the lane's reading of
# where the Japanese held, with no evidence record, for Josh to mark. Occupied: Occupied North China
# (Hebei, Beijing, Tianjin, Shandong, Shanxi, the Mengjiang part of Inner Mongolia and Henan north and east
# of the Yellow River flood), the Wuhan area and the lower Yangtze (Jiangsu, Shanghai, Anhui, eastern Hubei
# to Yichang, Yueyang at the tip of Hunan, northern Jiangxi with Nanchang and northern Zhejiang with
# Hangzhou and Ningbo) and the South China coast (Guangdong south of a line north of Canton and round
# Swatow, with Hainan, Macau and Kinmen). Free: Szechwan and the Southwest (Sichuan, Chongqing, Guizhou,
# Yunnan and western Hubei), the Northwest (Shaanxi, Gansu, Ningxia, Qinghai, western Inner Mongolia and
# Henan south and west of the flood), Hunan and Kiangsi (Hunan without Yueyang, and southern Jiangxi) and
# Free South China (Guangxi, Fujian, southern Zhejiang and northern Guangdong). Hong Kong, British until
# December 1941, is a territory of its own. Not cut, and listed for Josh: Shanxi (Japanese cities and
# railways, Chinese hills), Anhui (the Dabie hills held by China), Xiamen island in Fujian (Japanese from
# 1938) and Guangzhouwan (French, in Guangdong's south-west), each given whole to one side.
#
# Indochina and Thailand. French Indochina is Vietnam, Laos and Cambodia, less the provinces ceded to
# Thailand by the Tokyo treaty of 9 May 1941: Battambang, Banteay Meanchey, Pailin and Oddar Meanchey in
# Cambodia and Sainyabuli in Laos go to Thailand whole. Not cut, and listed for Josh: the ceded strip of
# Siem Reap and Preah Vihear and Champasak's west bank of the Mekong, each left whole with Indochina.
#
# Malaya and British Borneo (with Singapore, Sarawak, Sabah and Brunei), Burma, the Dutch East Indies (all
# of Indonesia's provinces, with Portuguese Timor joined to them: too small a holder to stand alone here),
# the Philippines and Hawaii are whole countries or states.
#
# Sea zones, chosen for play and not sourced: the Sea of Japan (the Korea Strait, La Perouse and the Tatar
# Strait to the Amur estuary at its edges), the East China Sea with the Yellow Sea and the Bohai, the South
# China Sea with the Gulf of Thailand and the Gulf of Tonkin, the Andaman Sea with the Strait of Malacca,
# the Java Sea with the seas of the Indies to Dutch New Guinea, the Philippine Sea (the western Pacific to
# 150 E, with the Inland Sea, the Sulu Sea and the inner Philippine seas), the North Pacific (north of 36 N
# from Japan to 150 W, with the Sea of Okhotsk and the Bering Sea), the Central Pacific (150 E to 150 W,
# the equator to 36 N, across the date line) and the Eastern Pacific (as above). The Tsugaru Strait is
# divided between the Sea of Japan and the North Pacific along the zones' line.
#
# Places. Tokyo, Kure, Hitokappu Bay, Pearl Harbor and Chungking are the world's (coordinates unchanged);
# Changsha and Wuhan are new sites with coordinates from GeoNames (Changsha, id 1815577: 28.19874 N,
# 112.97087 E; Wuhan, id 1791247: 30.58333 N, 114.26667 E; read 19 Nov 2026 at
# https://www.geonames.org/1815577 and https://www.geonames.org/1791247), entered to two decimals.
