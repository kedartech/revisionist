# The 1941 yields for the territory world of autumn 1941: each land territory's industry, manpower,
# oil, supply (rail hubs and ports) and prestige, the trade lines and the fuel stocks in force on
# 1 September 1941. A staging file: the item that converts the world (FLP) folds each row into the
# territory's `yields` (by the resource keys of start.yaml), and the trade lines and fuel stocks into
# the world's `trade_lines` and `fuel_stocks`, so the game plays as today until then. Read by
# tests/test_world_yields_1941.py against the map's world fragment and start.yaml (holders, places).
#
# How a figure counts as sourced (plan, YLS rule 6). A yield, scale, trade line or stock is sourced
# only when it names an `evidence` record giving the source, the edition, the locator, the exact claim
# the figure supports, the calculation from that figure to the territory, and who checked it. Any other
# figure is `gap: true` and names the source it is to be taken from (`named_source`) and the basis of
# the number given (`basis`), so the values sheet shows it as a gap. In this first pass every figure is
# a gap: the plan's default (YLS, Unclear) keeps every derived number a gap until Josh marks the sheet,
# and the lane read no edition page by page. The one locator the lane checked, through search results
# that quote it and not the book itself, is Kennedy's table 32 (below); it is named in the source note,
# not used as evidence.
#
# The allocation within a nation is the lane's: each nation's total is spread over its territories by
# the industrial regions the cited histories describe, and every row's `basis` says what it counts.
# Territories that are neither a seated nation's nor occupied by one (the neutrals, Vichy) carry their
# own share at the same scale; they count toward no seated nation's total.
#
# Every value here is [proposed]: the scales, the totals, each row, the hubs, the prestige ranks, the
# trade lines and the stocks (the plan's Values section; each is a row on the values sheet).

scales:
  industry:
    unit: points of war production a month
    measure: >-
      relative war potential of the powers, in percent of the seven powers' total (Kennedy, table 32,
      a 1937 figure; proposed as the 1941 measure until a 1941 series is chosen). The plan's ratio:
      United States 42, Germany 14 plus occupied Europe 6, USSR 14, Britain 10, Japan 4, Italy 3,
      China 1 (France's 4.2 goes to occupied Europe under Germany and the French State).
    totals: {usa: 42, germany: 20, ussr: 14, uk: 10, japan: 4, italy: 3, china: 1}
    germany_own: [germany_east, germany_west, germany_south, east_prussia]
    gap: true
    named_source: kennedy_1987
    basis: >-
      Kennedy's 1937 percentages rounded to whole points; Germany's own 14 is its 14.4, occupied
      Europe's 6 is the plan's figure for the conquered economies; China's 1 is the plan's.
  manpower:
    unit: millions of people
    measure: 1941 population of each territory, in millions, the nearest census or official estimate
    gap: true
    named_source: lon_yearbook_1941
    basis: >-
      Each row is the population of the provinces the territory is made of, rounded; the Soviet rows
      from the 1939 census by oblast, the American from the 1940 census by state.
  oil:
    unit: points a month
    measure: 1941 crude output, one point for about 3 million tonnes of crude a year
    million_tonnes_a_year_per_point: 3
    gap: true
    named_source: minerals_yearbook
    basis: >-
      Each producing territory's 1941 crude output in million tonnes, divided by 3 and rounded to a
      tenth; a field under 0.15 million tonnes counts 0.
  supply:
    unit: hubs
    measure: the rail junctions and ports in the territory that a 1941 rail map shows as junctions
    gap: true
    named_source: lane_choice
    basis: one point for each named hub; the hubs are listed on each row
  prestige:
    unit: points
    measure: a rank of each territory's standing, 1 to 10; the capital is 10 and highest in its nation
    gap: true
    named_source: lane_choice
    basis: the lane's ranking; no measure exists to cite

sources:
  - key: kennedy_1987
    title: "Paul Kennedy, The Rise and Fall of the Great Powers (Random House, 1987), table 32: Relative War Potential of the Powers in 1937, p. 332"
    note: "Locator and figures (US 41.7, Germany 14.4, USSR 14.0, UK 10.2, France 4.2, Japan 3.5, Italy 2.5) seen only in search results quoting the table, not in the book. A 1937 measure, after Hillmann."
  - key: harrison_1998
    title: "Mark Harrison (ed.), The Economics of World War II: Six Great Powers in International Comparison (Cambridge, 1998), the GDP and munitions tables"
    note: "The alternative 1941 measure (GDP or munitions output in 1941). Named citation; not read. Confirm the table before use."
  - key: lon_yearbook_1941
    title: "League of Nations, Statistical Year-Book of the League of Nations 1940/41 (Geneva, 1941): area and population tables"
    note: "Named citation; not read. Confirm the table and the year of each estimate before release."
  - key: census_ussr_1939
    title: "All-Union Census of 17 January 1939: population by oblast and republic"
    note: "Named citation; not read. Confirm the published tables before release."
  - key: census_us_1940
    title: "Sixteenth Census of the United States, 1940: Population, vol. I, number of inhabitants by state"
    note: "Named citation; not read. Confirm the table before release."
  - key: minerals_yearbook
    title: "U.S. Bureau of Mines, Minerals Yearbook 1942 (review of 1941): petroleum, world production by country"
    note: "Named citation; not read. Confirm the table and the 1941 figures before release."
  - key: frus_1941_iv
    title: "Foreign Relations of the United States, 1941, vol. IV, The Far East: the freezing of Japanese assets, 26 July 1941"
    note: "Named citation; not read. Confirm the document before release."
  - key: lane_choice
    title: "The lane's own choice: no published measure"
    note: "Hubs and prestige ranks chosen by the lane for play; kept as gaps for Josh to mark."

# Rule 6: the evidence records. None yet: no figure here has been checked against an edition.
evidence: []

# Rule 4: the trade lines in force on 1 September 1941, in points a month of the resource (oil at the
# scale above, industry in war-production points). `cut` when the line starts cut.
trade_lines:
  - key: usa_japan_oil
    exporter: usa
    importer: japan
    resource: oil
    amount: 1.3
    cut: true
    gap: true
    named_source: frus_1941_iv
    basis: >-
      about 4 million tonnes a year of American crude and products to Japan before the freeze, divided
      by 3; cut since the freeze of Japanese assets on 26 July 1941 and the oil embargo that followed
  - key: dei_japan_oil
    exporter: netherlands
    importer: japan
    resource: oil
    amount: 0.4
    cut: true
    gap: true
    named_source: frus_1941_iv
    basis: about 1.2 million tonnes a year from the Indies, cut when the Netherlands Indies froze Japanese assets on 28 July 1941
  - key: romania_germany_oil
    exporter: romania_state
    importer: germany
    resource: oil
    amount: 1.0
    gap: true
    named_source: minerals_yearbook
    basis: about 3 million tonnes a year of Romanian oil to Germany in 1941, divided by 3
  - key: usa_uk_oil
    exporter: usa
    importer: uk
    resource: oil
    amount: 3.0
    gap: true
    named_source: minerals_yearbook
    basis: about 9 million tonnes a year of American and Caribbean oil shipped to Britain, divided by 3
  - key: usa_uk_lend_lease
    exporter: usa
    importer: uk
    resource: industry
    amount: 1.0
    gap: true
    named_source: harrison_1998
    basis: lend-lease from March 1941, about a tenth of Britain's war production in the year's second half
  - key: sweden_germany_ore
    exporter: sweden
    importer: germany
    resource: industry
    amount: 0.5
    gap: true
    named_source: harrison_1998
    basis: Swedish iron ore, about 10 million tonnes a year, as a share of Germany's war production

# Rule 4: each nation's fuel stock on 1 September 1941, in oil points (3 million tonnes a year is one
# point a month, so a stock of one point is 0.25 million tonnes). A nation not named starts at
# trade.STOCK_MONTHS of its fuel income.
fuel_stocks:
  - {polity: japan, amount: 23, gap: true, named_source: frus_1941_iv, basis: "about 5.8 million tonnes held in Japan in late 1941, divided by 0.25"}
  - {polity: germany, amount: 8, gap: true, named_source: minerals_yearbook, basis: "about 2 million tonnes of reserves in mid-1941, divided by 0.25"}
  - {polity: uk, amount: 28, gap: true, named_source: minerals_yearbook, basis: "about 7 million tonnes held in Britain in 1941, divided by 0.25"}
  - {polity: italy, amount: 4, gap: true, named_source: minerals_yearbook, basis: "about 1 million tonnes held in Italy in 1941, divided by 0.25"}

