# The Civil War's map, 1 September 1862. Built by scripts/map_build.py from this one file (see
# worlds/maps/README.md); the provinces are Natural Earth 1:10m admin-1 codes (worlds/maps/SOURCES.md).
# Nothing here is drawn by hand: every border is the data's, dissolved. Every value is [proposed]: the
# territory list and names, which units make each territory, every terrain, every sea zone line, the
# river's width and stretch, and the theatre box.
#
#   uv run --frozen --group map python scripts/map_build.py build worlds/maps/src/civil-war-1862
#
# The box is the whole map's: the full turn of longitude from 60 S to 84 N. The war is fought in the
# United States; the rest of the world is coarse, present-day countries dissolved whole into about thirty
# territories, so every unit of the data inside the box is claimed. Units are grouped by their country
# code; a unit far from its country's main land (France's overseas departments, the Dutch islands in the
# Caribbean, the scattered American islands, Alaska and Hawaii) goes to the territory around it, and
# Russia's units go to European Russia west of 60 E (by each unit's inner point) and to Siberia east of
# it. The two units of Antarctica lie south of the box and are left out. Islets of the land file that no
# unit holds stay land with no territory, in the backdrop: the build has no rule yet that gives them to a
# neighbour.
#
# The theatre box [proposed]: 125 W to 66 W, 24 N to 49 N, the frame of the two theatre regions'
# proof sheets. The theatres: 27 land territories, present-day states whole or grouped (the eastern
# theatre, and the western theatre with the far west beyond the river), and the coast and the river: seven
# sea zones and the Mississippi. The coarse world and its oceans are one region, the world beyond. The capitals lie in different territories a short march apart: Washington in Maryland,
# Delaware and Washington (the District of Columbia is under the smallest area alone), Richmond in
# Virginia.
#
# 1862 lines. Virginia before its western counties left is the two present-day states dissolved, so no
# cut line is needed (the Restored Government held the west, but West Virginia was admitted only in June
# 1863). No other 1862 line in the theatres runs through a present-day state. Where a territory's outline
# is not an 1862 line, it says so with `gap: true` and a note: the western territories, the Indian
# Territory's panhandle, and most of the coarse world, whose present-day countries did not exist or did
# not have today's lines in 1862. Holders, yields and places are the world's to set.
#
# Sea zones. Twenty, drawn for play and not sourced: seven on the war's coast (the Union's northern
# waters, the Chesapeake with Hampton Roads, the Carolina sounds to Cape Fear, the South Atlantic coast of
# Charleston and Savannah, the Florida Straits with the Bahamas channels, the eastern Gulf of Pensacola
# and Mobile, and the western Gulf of New Orleans and Galveston) and thirteen oceans. The zones' polygons
# meet edge to edge and together cover every water face of the box; a polygon's line over land draws
# nothing, since each zone is its polygon cut from the ocean.
#
# The river. The Mississippi is a zone a fleet can stand in: a strip 0.25 degrees wide along the shared
# borders of the states on its banks, from the Missouri-Illinois line down to the 31st parallel, where the
# Louisiana-Mississippi line leaves the river (the stretch is the polygon's; the line under it is the
# data's). It parts the states on its two banks, so each pair it parts is a declared crossing; below the
# 31st parallel the river runs inside Louisiana, where the data has no line to follow, so the river joins
# the western Gulf by a declared crossing. The box's edge divides the Pacific at the date line, so the two
# halves of each Pacific band are joined by a declared crossing.

map: {box: [-180, -60, 180, 84]}

regions:
  - {key: eastern_theatre, name: The Eastern Theatre}
  - {key: western_theatre, name: The Western Theatre}
  - {key: the_coast, name: The Coast and the River}
  - {key: the_world, name: The World Beyond}

