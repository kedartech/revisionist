# Nobody is pre-seated: players claim the playable leaders at Session Zero.
seats: []

roster:
  - {entity: oren_vale, pitch: The First Minister who keeps the strait open and Varda's., reach: The Saltworks and the Varda galleys., composite: true}
  - {entity: general_aske, pitch: The Marshal who means to march through Harrow Pass., reach: The Ostrel levy and its galleys., composite: true}

# The contest of the season (SSG): Varda and Ostrel over the strait, decided 120 days after
# the start, on 31 July 1900. Each move is a step toward one side. [proposed]
contests:
  - key: strait_mastery
    kind: rivalry
    name: Mastery of the Salt Strait
    prize: Whether Varda keeps the strait open or Ostrel closes it behind Harrow Pass.
    sides: [varda, ostrel]
    countdown_days: 120
    moves:
      - {kind: holder, toward: ostrel, territory: varda_saltworks}
      - {kind: holder, toward: ostrel, territory: varda_downs}
      - {kind: holder, toward: varda, territory: harrow_pass}
      - {kind: battle, toward: varda, region: the_waters}
      - {kind: battle, toward: ostrel, region: the_waters}
      - {kind: battle, toward: ostrel, region: the_shores}
      - {kind: battle, toward: varda, region: the_shores}
      - {kind: line, toward: ostrel, nation: varda, line: 40, falling: true}
      - {kind: agreement_made, toward: varda, between: [varda, lune]}

# One pact in force at the start (SSG): Kesh and the Lune Isles defend each other. [proposed]
pacts:
  - key: harbour_compact
    name: The Harbour Compact
    parties: [kesh, lune]
    public: true
    wording: Kesh and the Lune Isles each go to war within seven days on any power that newly attacks the other.
    source: salt_strait
    clauses:
      - {type: defend, binds: kesh, nation: lune, days: 7}
      - {type: defend, binds: lune, nation: kesh, days: 7}

# A conference the world schedules (SSG): the Lune Isles call the four powers to keep the
# peace of the strait for the season. [proposed]
conferences:
  - key: strait_peace_conference
    caller: lune
    invited: [lune, varda, ostrel, kesh]
    opens: 1900-05-14
    voting_day: 1900-05-18
    public: true
    wording: Varda and Ostrel declare no war on each other this season, and the strait stays open to every flag.
    source: salt_strait
    clauses:
      - {type: no_war, binds: varda, nation: ostrel}
      - {type: no_war, binds: ostrel, nation: varda}
